    function checkpointTrackerEntries(checkpoint, now = Date.now() / 1000) {
      const candidates = [...trackers.values()]
        .filter(tracker => (tracker.name || "").startsWith("#"))
        .concat(clientSummaryTracker ? [clientSummaryTracker] : []);
      return candidates.flatMap(tracker => {
        if (!validPosition(tracker)) return [];
        const approaching = tracker.checkpointEta?.trackName === checkpoint.track.name
          && Boolean(formatCheckpointEta(tracker, now));
        const stopped = trackerIsKnownStopped(tracker) && map.distance(
          checkpoint.position,
          L.latLng(tracker.latitude, tracker.longitude)
        ) <= ROUTE_MATCH_MARGIN_METERS;
        if (!stopped && !approaching) return [];
        return [{ tracker, stopped, approaching: approaching && !stopped }];
      }).sort((left, right) => {
        if (left.stopped !== right.stopped) return left.stopped ? -1 : 1;
        return (left.tracker.checkpointEta?.arrivalUnix || 0)
          - (right.tracker.checkpointEta?.arrivalUnix || 0);
      });
    }

    function checkpointStatusText(
      checkpoint,
      now = Date.now() / 1000,
      omitEmpty = false
    ) {
      const entries = checkpointTrackerEntries(checkpoint, now);
      const stopped = entries.filter(entry => entry.stopped).length;
      const approaching = entries.filter(entry => entry.approaching).length;
      if (omitEmpty && stopped === 0 && approaching === 0) return "";
      return `${stopped} Cars, ${approaching} Approaching`;
    }

    function checkpointIsCentered(checkpoint) {
      return map.distance(map.getCenter(), checkpoint.position) <= 2;
    }

    function checkpointIsHighlighted(checkpoint) {
      return highlightedCheckpointTrackName === checkpoint.track.name
        || checkpointIsCentered(checkpoint);
    }

    function checkpointFocusZoom(checkpoint) {
      const entries = checkpointTrackerEntries(checkpoint);
      if (!entries.length) return 14;
      const center = checkpoint.position;
      const bounds = L.latLngBounds([center]);
      for (const { tracker } of entries) {
        const position = L.latLng(tracker.latitude, tracker.longitude);
        bounds.extend(position);
        bounds.extend([
          2 * center.lat - position.lat,
          2 * center.lng - position.lng
        ]);
      }
      return Math.min(14, map.getBoundsZoom(bounds, false, L.point(50, 50)));
    }

    function centerCheckpoint(checkpoint) {
      suppressMoveCancellation = true;
      try {
        map.setView(
          checkpoint.position,
          checkpointFocusZoom(checkpoint),
          { animate: false }
        );
      } finally {
        suppressMoveCancellation = false;
      }
    }

    function checkpointCompassButton(checkpoint, dialog) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "checkpoint-follow";
      button.title = `Center ${checkpoint.label} and show details`;
      button.setAttribute("aria-label", button.title);
      button.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
        <path d="M12 2v4M12 18v4M2 12h4M18 12h4"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>`;
      button.addEventListener("click", event => {
        event.stopPropagation();
        dialog.close();
        followedPeloton = null;
        highlightedCheckpointTrackName = checkpoint.track.name;
        relativeDistanceReference = {
          type: "checkpoint",
          id: checkpoint.track.name
        };
        if (followedPinId) setFollowedPin(null, false);
        if (followedSerial) setFollowedTracker(null, false, false);
        if (clientPositionFollowing) setClientPositionFollowing(false);
        updateSideRelativeDistances();
        centerCheckpoint(checkpoint);
        checkpoint.marker.openPopup();
      });
      return button;
    }

    function activateCheckpoint(checkpoint) {
      followedPeloton = null;
      highlightedCheckpointTrackName = checkpoint.track.name;
      relativeDistanceReference = {
        type: "checkpoint",
        id: checkpoint.track.name
      };
      if (followedPinId) setFollowedPin(null, false);
      if (followedSerial) setFollowedTracker(null, false, false);
      if (clientPositionFollowing) setClientPositionFollowing(false);
      updateSideRelativeDistances();
      const wasCentered = checkpointIsCentered(checkpoint);
      if (!wasCentered) {
        const hasApproachingCars = checkpointTrackerEntries(checkpoint)
          .some(entry => entry.approaching);
        centerCheckpoint(checkpoint);
        if (hasApproachingCars) checkpoint.marker.openPopup();
        else checkpoint.marker.closePopup();
        return;
      }
      centerCheckpoint(checkpoint);
      if (checkpoint.marker.isPopupOpen()) checkpoint.marker.closePopup();
      else checkpoint.marker.openPopup();
    }

    function checkpointRow(checkpoint) {
      const listLabel = checkpoint.label.replace(/\s*·\s*stage end$/i, "");
      const row = document.createElement("div");
      row.className = "tracker-row checkpoint-list-row";
      row.classList.toggle("stage-stop", checkpoint.markerKind === "stage");
      row.classList.toggle("finish-stop", checkpoint.markerKind === "finish");
      row.dataset.track = checkpoint.track.name;
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", `Center ${listLabel} or show its details`);
      const activate = () => activateCheckpoint(checkpoint);
      row.addEventListener("click", activate);
      row.addEventListener("keydown", event => {
        if (event.target === row && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          activate();
        }
      });
      const flag = document.createElement("span");
      flag.className = "checkpoint-list-flag";
      flag.setAttribute("aria-hidden", "true");
      const identity = document.createElement("div");
      identity.className = "tracker-identity";
      const name = document.createElement("div");
      name.className = "tracker-name";
      name.textContent = listLabel;
      const status = document.createElement("div");
      const relativeDistance = document.createElement("span");
      const crosshair = document.createElement("button");
      status.className = "tracker-meta checkpoint-list-status";
      status.textContent = checkpointStatusText(checkpoint);
      relativeDistance.className = "side-relative-distance";
      relativeDistance.dataset.relativeCheckpoint = checkpoint.track.name;
      relativeDistance.textContent = sideRelativeDistance(
        checkpoint.track.routeTailMeters,
        "checkpoint",
        checkpoint.track.name
      );
      const isFollowingCheckpoint =
        highlightedCheckpointTrackName === checkpoint.track.name;
      crosshair.type = "button";
      crosshair.className = "follow-button checkpoint-list-follow";
      crosshair.innerHTML = followCrosshairSvg;
      crosshair.setAttribute("aria-pressed", String(isFollowingCheckpoint));
      crosshair.title = `Center ${listLabel} and show details`;
      crosshair.setAttribute("aria-label", crosshair.title);
      crosshair.addEventListener("click", event => {
        event.stopPropagation();
        followedPeloton = null;
        highlightedCheckpointTrackName = checkpoint.track.name;
        relativeDistanceReference = {
          type: "checkpoint",
          id: checkpoint.track.name
        };
        if (followedPinId) setFollowedPin(null, false);
        if (followedSerial) setFollowedTracker(null, false, false);
        if (clientPositionFollowing) setClientPositionFollowing(false);
        centerCheckpoint(checkpoint);
        checkpoint.marker.openPopup();
        updateSideRelativeDistances();
      });
      identity.append(name, status);
      row.append(flag, identity, relativeDistance, crosshair);
      return row;
    }

    function activeSideDistanceReference() {
      if (followedPeloton) {
        return {
          type: "peloton",
          id: followedPeloton.key,
          distanceMeters: followedPeloton.averageDistanceMeters
        };
      }
      if (followedSerial && trackers.has(followedSerial)) {
        return {
          type: "tracker",
          id: followedSerial,
          distanceMeters: effectiveTrackerDistanceMeters(trackers.get(followedSerial))
        };
      }
      if (clientPositionFollowing && clientSummaryTracker) {
        return {
          type: "client",
          id: "__client_position__",
          distanceMeters: effectiveTrackerDistanceMeters(clientSummaryTracker)
        };
      }
      if (followedPinId && pins.has(followedPinId)) {
        const pin = pins.get(followedPinId);
        return {
          type: "pin",
          id: followedPinId,
          distanceMeters: pinRouteDistanceMeters(pin)
        };
      }
      if (highlightedCheckpointTrackName) {
        const checkpoint = checkpointMarkers.find(item =>
          item.track.name === highlightedCheckpointTrackName
        );
        if (checkpoint) {
          return {
            type: "checkpoint",
            id: checkpoint.track.name,
            distanceMeters: checkpoint.track.routeTailMeters
          };
        }
      }
      if (relativeDistanceReference?.type === "tracker") {
        const tracker = trackers.get(relativeDistanceReference.id);
        if (tracker) {
          return {
            ...relativeDistanceReference,
            distanceMeters: effectiveTrackerDistanceMeters(tracker)
          };
        }
      }
      if (relativeDistanceReference?.type === "client" && clientSummaryTracker) {
        return {
          ...relativeDistanceReference,
          distanceMeters: effectiveTrackerDistanceMeters(clientSummaryTracker)
        };
      }
      if (relativeDistanceReference?.type === "pin") {
        const pin = pins.get(relativeDistanceReference.id);
        if (pin) {
          return {
            ...relativeDistanceReference,
            distanceMeters: pinRouteDistanceMeters(pin)
          };
        }
      }
      if (relativeDistanceReference?.type === "checkpoint") {
        const checkpoint = checkpointMarkers.find(item =>
          item.track.name === relativeDistanceReference.id
        );
        if (checkpoint) {
          return {
            ...relativeDistanceReference,
            distanceMeters: checkpoint.track.routeTailMeters
          };
        }
      }
      if (relativeDistanceReference?.type === "peloton") {
        const peloton = detectedPelotons.find(item =>
          item.key === relativeDistanceReference.id
        );
        if (peloton) {
          return {
            ...relativeDistanceReference,
            distanceMeters: peloton.averageDistanceMeters
          };
        }
      }
      return null;
    }

    function sideRelativeDistance(distanceMeters, type, id) {
      const reference = activeSideDistanceReference();
      if (!reference || (reference.type === type && reference.id === id)
        || !Number.isFinite(reference.distanceMeters)
        || !Number.isFinite(distanceMeters)) return "";
      const relativeMiles = (reference.distanceMeters - distanceMeters) / 1609.344;
      const magnitude = Math.abs(relativeMiles);
      const formatted = magnitude < 10 ? magnitude.toFixed(1) : magnitude.toFixed(0);
      if (magnitude < 0.05) return "0.0 mi";
      return `${relativeMiles > 0 ? "+" : "−"}${formatted} mi`;
    }

    function updateSideRelativeDistances() {
      const reference = activeSideDistanceReference();
      const isReference = (type, id) =>
        reference?.type === type && reference.id === id;
      const followedPelotonMembers = new Set(followedPeloton?.serials || []);
      for (const element of groupsElement.querySelectorAll("[data-relative-serial]")) {
        const tracker = listTracker(element.dataset.relativeSerial);
        element.textContent = tracker
          ? sideRelativeDistance(
              effectiveTrackerDistanceMeters(tracker),
              tracker.client_tracker ? "client" : "tracker",
              tracker.serial
            )
          : "";
      }
      for (const element of groupsElement.querySelectorAll("[data-relative-checkpoint]")) {
        const checkpoint = checkpointMarkers.find(item =>
          item.track.name === element.dataset.relativeCheckpoint
        );
        element.textContent = checkpoint
          ? sideRelativeDistance(
              checkpoint.track.routeTailMeters,
              "checkpoint",
              checkpoint.track.name
            )
          : "";
      }
      for (const element of groupsElement.querySelectorAll("[data-relative-pin]")) {
        const pin = pins.get(element.dataset.relativePin);
        element.textContent = pin
          ? sideRelativeDistance(pinRouteDistanceMeters(pin), "pin", pin.id)
          : "";
      }
      for (const element of groupsElement.querySelectorAll("[data-relative-peloton]")) {
        const peloton = detectedPelotons.find(item =>
          item.key === element.dataset.relativePeloton
        );
        element.textContent = peloton
          ? sideRelativeDistance(
              peloton.averageDistanceMeters,
              "peloton",
              peloton.key
            )
          : "";
      }
      for (const row of groupsElement.querySelectorAll(".tracker-row[data-serial]")) {
        const tracker = listTracker(row.dataset.serial);
        const isRacePelotonMember =
          row.closest(".tracker-group")?.dataset.group === "race"
          && followedPelotonMembers.has(row.dataset.serial);
        row.classList.toggle(
          "relative-reference-row",
          isRacePelotonMember
          || Boolean(tracker) && isReference(
              tracker.client_tracker ? "client" : "tracker",
              tracker.serial
            )
        );
      }
      for (const row of groupsElement.querySelectorAll(".checkpoint-list-row[data-track]")) {
        const selected = isReference("checkpoint", row.dataset.track);
        const isFollowingCheckpoint =
          highlightedCheckpointTrackName === row.dataset.track;
        row.classList.toggle(
          "relative-reference-row",
          selected
        );
        row.querySelector(".checkpoint-list-follow")
          ?.setAttribute("aria-pressed", String(isFollowingCheckpoint));
      }
      for (const row of groupsElement.querySelectorAll(".pin-list-row[data-pin-id]")) {
        row.classList.toggle(
          "relative-reference-row",
          isReference("pin", row.dataset.pinId)
        );
      }
      for (const row of groupsElement.querySelectorAll(".peloton-row[data-peloton-key]")) {
        const selected = isReference("peloton", row.dataset.pelotonKey);
        row.classList.toggle(
          "relative-reference-row",
          selected
        );
        row.querySelector(".peloton-overall-follow")
          ?.setAttribute("aria-pressed", String(selected));
      }
    }

    function reorderTrackerRowsByDistance() {
      const list = groupsElement.querySelector(
        '.tracker-group[data-group="race"] > .tracker-list'
      );
      if (!list) return;
      const itemForRow = row => {
        if (row.dataset.pinId) return pins.get(row.dataset.pinId);
        if (row.dataset.track) {
          return checkpointMarkers.find(item => item.track.name === row.dataset.track);
        }
        return listTracker(row.dataset.serial);
      };
      const distanceForItem = item =>
        item?.id
          ? pinRouteDistanceMeters(item)
          : item?.track && !item.serial
            ? item.track.routeTailMeters
            : item ? effectiveTrackerDistanceMeters(item) : null;
      const nameForItem = item =>
        item?.message || item?.name || item?.label || item?.track?.name || "";
      const rows = [...list.querySelectorAll(
        ":scope > .tracker-row, :scope > .pin-list-row"
      )];
      rows.sort((leftRow, rightRow) => {
        const left = itemForRow(leftRow);
        const right = itemForRow(rightRow);
        const leftDistance = distanceForItem(left);
        const rightDistance = distanceForItem(right);
        if (Number.isFinite(leftDistance) && Number.isFinite(rightDistance)) {
          return leftDistance - rightDistance
            || nameForItem(left).localeCompare(nameForItem(right), undefined, {
              numeric: true,
              sensitivity: "base"
            });
        }
        if (Number.isFinite(leftDistance)) return -1;
        if (Number.isFinite(rightDistance)) return 1;
        return nameForItem(left).localeCompare(nameForItem(right), undefined, {
          numeric: true,
          sensitivity: "base"
        });
      });
      list.append(...rows);
    }

    function reorderSolarRowsByDistance() {
      if (!solarSortByDistance) return;
      const list = groupsElement.querySelector(
        '.tracker-group[data-group="solar"] > .tracker-list'
      );
      if (!list) return;
      const rows = [...list.querySelectorAll(":scope > .tracker-row[data-serial]")];
      rows.sort((leftRow, rightRow) => {
        const left = trackers.get(leftRow.dataset.serial);
        const right = trackers.get(rightRow.dataset.serial);
        const leftDistance = left ? effectiveTrackerDistanceMeters(left) : null;
        const rightDistance = right ? effectiveTrackerDistanceMeters(right) : null;
        if (Number.isFinite(leftDistance) && Number.isFinite(rightDistance)) {
          return leftDistance - rightDistance
            || (left.name || "").localeCompare(
              right.name || "",
              undefined,
              { numeric: true, sensitivity: "base" }
            );
        }
        if (Number.isFinite(leftDistance)) return -1;
        if (Number.isFinite(rightDistance)) return 1;
        return (left?.name || "").localeCompare(
          right?.name || "",
          undefined,
          { numeric: true, sensitivity: "base" }
        );
      });
      list.append(...rows);
    }

    function readCollapsedGroups() {
      try {
        const saved = window.localStorage.getItem(COLLAPSED_GROUPS_STORAGE_KEY);
        if (saved === null) return new Set(["staff", "solar", "pelotons"]);
        const value = JSON.parse(saved);
        return new Set(Array.isArray(value) ? value : []);
      } catch (error) {
        return new Set(["staff", "solar", "pelotons"]);
      }
    }

    const collapsedTrackerGroups = readCollapsedGroups();

    function addGroupCollapseControl(section, heading, groupName) {
      const button = document.createElement("button");
      const render = () => {
        const collapsed = collapsedTrackerGroups.has(groupName);
        section.classList.toggle("collapsed", collapsed);
        button.textContent = collapsed ? "▸" : "▾";
        button.setAttribute("aria-expanded", String(!collapsed));
        button.setAttribute(
          "aria-label",
          `${collapsed ? "Expand" : "Collapse"} ${groupName} group`
        );
      };
      button.type = "button";
      button.className = "group-collapse-button";
      button.addEventListener("pointerdown", event => event.stopPropagation());
      button.addEventListener("keydown", event => event.stopPropagation());
      button.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        if (collapsedTrackerGroups.has(groupName)) collapsedTrackerGroups.delete(groupName);
        else collapsedTrackerGroups.add(groupName);
        try {
          window.localStorage.setItem(
            COLLAPSED_GROUPS_STORAGE_KEY,
            JSON.stringify([...collapsedTrackerGroups])
          );
        } catch (error) {
          // Storage may be disabled.
        }
        render();
        if (!collapsedTrackerGroups.has(groupName)) {
          window.requestAnimationFrame(updateTrackerMetaTickers);
        }
      });
      heading.append(button);
      render();
    }

    function sidebarGroupShell(key, title, count) {
      const section = document.createElement("section");
      section.className = "tracker-group";
      section.dataset.group = key;
      const heading = document.createElement("h2");
      heading.textContent = `${title} (${count})`;
      const list = document.createElement("div");
      list.className = "tracker-list";
      return { section, heading, list };
    }

    function finishSidebarGroup({ section, heading, list }, key) {
      addGroupCollapseControl(section, heading, key);
      section.append(heading, list);
      return section;
    }

    function updateCheckpointListStatuses(now = Date.now() / 1000) {
      const checkpointsByTrack = new Map(
        checkpointMarkers.map(checkpoint => [checkpoint.track.name, checkpoint])
      );
      for (const row of groupsElement.querySelectorAll(".checkpoint-list-row")) {
        const checkpoint = checkpointsByTrack.get(row.dataset.track);
        const status = row.querySelector(".checkpoint-list-status");
        if (checkpoint && status) status.textContent = checkpointStatusText(checkpoint, now);
      }
    }

    function updateTrackerMetaTickers() {
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      for (const viewport of groupsElement.querySelectorAll(".tracker-meta-distances")) {
        const text = viewport.querySelector(".tracker-meta-distance-text");
        if (!text) continue;
        viewport.classList.remove("ticker-active");
        viewport.style.removeProperty("--ticker-distance");
        viewport.style.removeProperty("--ticker-duration");
        viewport.style.removeProperty("--ticker-delay");
        if (reduceMotion) continue;
        const textRange = document.createRange();
        textRange.selectNodeContents(text);
        const contentWidth = Math.max(
          text.scrollWidth,
          textRange.getBoundingClientRect().width
        );
        textRange.detach();
        const overflowPixels = Math.ceil(contentWidth - viewport.clientWidth);
        if (overflowPixels <= 2) continue;
        const durationSeconds = Math.max(10, overflowPixels / 6);
        const phaseSeconds = (performance.now() / 1000) % durationSeconds;
        viewport.style.setProperty("--ticker-distance", `${-overflowPixels}px`);
        viewport.style.setProperty("--ticker-duration", `${durationSeconds.toFixed(1)}s`);
        viewport.style.setProperty("--ticker-delay", `${-phaseSeconds.toFixed(3)}s`);
        viewport.classList.add("ticker-active");
      }
    }

    function trackerGroup(
      key,
      title,
      items,
      {
        staffGroup = false,
        summary = false,
        solarSort = false,
        trackerCount = items.length
      } = {}
    ) {
      const shell = sidebarGroupShell(key, title, trackerCount);
      const { section, heading, list } = shell;
      if (staffGroup) section.dataset.staffUnlocked = String(staffUnlocked);
      if (summary) {
        const summaryButton = document.createElement("button");
        summaryButton.type = "button";
        summaryButton.className = "group-summary-button";
        summaryButton.textContent = "Summary";
        summaryButton.setAttribute("aria-label", "Show race summary");
        summaryButton.addEventListener("click", openSolarSummary);
        heading.append(summaryButton);
      }
      if (solarSort) {
        section.dataset.solarSort = solarSortByDistance ? "distance" : "number";
        const sortButton = document.createElement("button");
        sortButton.type = "button";
        sortButton.className = "group-summary-button group-sort-button";
        sortButton.textContent =
          solarSortByDistance ? "Sorted by mi" : "Sorted by #";
        sortButton.setAttribute(
          "aria-label",
          solarSortByDistance
            ? "Currently sorted by distance remaining; switch to team number"
            : "Currently sorted by team number; switch to distance remaining"
        );
        sortButton.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          solarSortByDistance = !solarSortByDistance;
          try {
            window.localStorage.setItem(
              SOLAR_SORT_STORAGE_KEY,
              solarSortByDistance ? "distance" : "number"
            );
          } catch (error) {
            // Storage may be disabled.
          }
          renderTrackerList();
        });
        heading.append(sortButton);
      }
      if (staffGroup) {
        heading.classList.add("staff-unlock");
        heading.title = staffUnlocked ? "" : "Press and hold to unlock Event Staff trackers";
        if (!staffUnlocked) {
          heading.tabIndex = 0;
          heading.setAttribute("role", "button");
        }
        if (staffUnlocked) {
          const state = document.createElement("span");
          state.className = "staff-access-state";
          state.textContent = "unlocked";
          state.tabIndex = 0;
          state.setAttribute("role", "button");
          state.title = "Double-click to return to the public tracker view";
          const relockStaff = event => {
            event.preventDefault();
            event.stopPropagation();
            clearCachedStaffPassword();
            window.location.reload();
          };
          state.addEventListener("click", event => event.stopPropagation());
          state.addEventListener("dblclick", relockStaff);
          let previousKeyActivation = 0;
          state.addEventListener("keydown", event => {
            if (event.key !== "Enter" && event.key !== " ") return;
            event.preventDefault();
            event.stopPropagation();
            const now = performance.now();
            if (now - previousKeyActivation <= 500) relockStaff(event);
            else previousKeyActivation = now;
          });
          heading.append(state);
        }

        let holdTimer = null;
        const cancelHold = () => {
          window.clearTimeout(holdTimer);
          holdTimer = null;
          heading.classList.remove("holding");
        };
        const startHold = () => {
          if (staffUnlocked || holdTimer !== null) return;
          heading.classList.add("holding");
          holdTimer = window.setTimeout(() => {
            holdTimer = null;
            heading.classList.remove("holding");
            requestStaffAccess();
          }, STAFF_LONG_PRESS_MS);
        };
        heading.addEventListener("pointerdown", startHold);
        heading.addEventListener("pointerup", cancelHold);
        heading.addEventListener("pointercancel", cancelHold);
        heading.addEventListener("pointerleave", cancelHold);
        heading.addEventListener("contextmenu", event => event.preventDefault());
        heading.addEventListener("click", event => event.preventDefault());
        heading.addEventListener("keydown", event => {
          if (!event.repeat && (event.key === "Enter" || event.key === " ")) {
            event.preventDefault();
            startHold();
          }
        });
        heading.addEventListener("keyup", event => {
          if (event.key === "Enter" || event.key === " ") cancelHold();
        });
      }
      if (items.length) {
        for (const item of items) {
          list.append(
            item.id
              ? pinListRow(item)
              : item.track && !item.serial
                ? checkpointRow(item)
                : trackerRow(item)
          );
        }
      } else {
        const empty = document.createElement("p");
        empty.className = "empty-group";
        empty.textContent = "No trackers";
        list.append(empty);
      }
      return finishSidebarGroup(shell, key);
    }

    function renderTrackerList(dirtySerials = null) {
      refreshDetectedPelotons();
      const sorted = [...trackers.values()].sort((a, b) =>
        (a.name || "").localeCompare(b.name || "", undefined, { numeric: true, sensitivity: "base" })
      );
      const solarCars = sorted.filter(tracker =>
        (tracker.name || "").startsWith("#")
      );
      if (solarSortByDistance) {
        solarCars.sort((left, right) => {
          const leftDistance = effectiveTrackerDistanceMeters(left);
          const rightDistance = effectiveTrackerDistanceMeters(right);
          if (Number.isFinite(leftDistance) && Number.isFinite(rightDistance)) {
            return leftDistance - rightDistance
              || (left.name || "").localeCompare(
                right.name || "",
                undefined,
                { numeric: true, sensitivity: "base" }
              );
          }
          if (Number.isFinite(leftDistance)) return -1;
          if (Number.isFinite(rightDistance)) return 1;
          return (left.name || "").localeCompare(
            right.name || "",
            undefined,
            { numeric: true, sensitivity: "base" }
          );
        });
      }
      const eventStaff = sorted.filter(tracker =>
        !(tracker.name || "").startsWith("#")
      );
      const racePins = [...pins.values()].filter(pin => pin.approved || staffUnlocked);
      const raceItemDistance = item =>
        item.id
          ? pinRouteDistanceMeters(item)
          : item.track && !item.serial
            ? item.track.routeTailMeters
            : effectiveTrackerDistanceMeters(item);
      const raceItemName = item =>
        item.message || item.name || item.label || item.track?.name || "";
      const raceItems = [
        ...sorted,
        ...(clientSummaryTracker ? [clientSummaryTracker] : []),
        ...checkpointMarkers,
        ...racePins
      ].sort((left, right) => {
        const leftDistance = raceItemDistance(left);
        const rightDistance = raceItemDistance(right);
        if (Number.isFinite(leftDistance) && Number.isFinite(rightDistance)) {
          return leftDistance - rightDistance
            || raceItemName(left).localeCompare(
              raceItemName(right),
              undefined,
              { numeric: true, sensitivity: "base" }
            );
        }
        if (Number.isFinite(leftDistance)) return -1;
        if (Number.isFinite(rightDistance)) return 1;
        return raceItemName(left).localeCompare(
          raceItemName(right),
          undefined,
          { numeric: true, sensitivity: "base" }
        );
      });
      const desiredGroups = [
        { key: "staff", items: eventStaff },
        { key: "solar", items: solarCars },
        { key: "pelotons", items: detectedPelotons },
        { key: "race", items: raceItems }
      ];
      const groupItemKey = (_groupKey, item) =>
        item.key && item.serials
          ? `peloton:${item.key}`
          : item.id
          ? `pin:${item.id}`
          : item.track && !item.serial
            ? `checkpoint:${item.track.name}`
            : `tracker:${item.serial}`;
      const sections = [...groupsElement.querySelectorAll(":scope > .tracker-group")];
      const structureMatches = sections.length === desiredGroups.length
        && desiredGroups.every((group, index) => {
          const section = sections[index];
          const currentSerials = [...section.querySelectorAll(
            ".tracker-row, .pin-list-row, .peloton-row"
          )].map(row => row.dataset.pelotonKey
              ? `peloton:${row.dataset.pelotonKey}`
              : row.dataset.serial
              ? `tracker:${row.dataset.serial}`
              : row.dataset.pinId
                ? `pin:${row.dataset.pinId}`
                : `checkpoint:${row.dataset.track}`);
          const desiredSerials = group.items.map(item => groupItemKey(group.key, item));
          return section.dataset.group === group.key
            && (group.key !== "solar"
              || section.dataset.solarSort
                === (solarSortByDistance ? "distance" : "number"))
            && (group.key !== "staff"
              || section.dataset.staffUnlocked === String(staffUnlocked))
            && currentSerials.length === desiredSerials.length
            && currentSerials.every((serial, itemIndex) => serial === desiredSerials[itemIndex]);
        });
      if (!structureMatches) {
        groupsElement.replaceChildren(
          trackerGroup(
            "staff",
            "Event Staff",
            eventStaff,
            {
              staffGroup: true,
              trackerCount: eventStaff.length
            }
          ),
          trackerGroup(
            "solar",
            "Solar Cars",
            solarCars,
            { solarSort: true, trackerCount: solarCars.length }
          ),
          pelotonGroup(detectedPelotons),
          trackerGroup(
            "race",
            "Race",
            raceItems,
            {
              summary: true,
              trackerCount: raceItems.filter(item => !item.client_tracker).length
            }
          )
        );
      } else {
        const serialsToUpdate = dirtySerials || new Set(
          [...sorted, ...(clientSummaryTracker ? [clientSummaryTracker] : [])]
            .map(tracker => tracker.serial)
        );
        const rowsBySerial = new Map();
        for (const row of groupsElement.querySelectorAll(".tracker-row[data-serial]")) {
          if (!rowsBySerial.has(row.dataset.serial)) rowsBySerial.set(row.dataset.serial, []);
          rowsBySerial.get(row.dataset.serial).push(row);
        }
        for (const serial of serialsToUpdate) {
          const tracker = listTracker(serial);
          if (!tracker) continue;
          for (const row of rowsBySerial.get(serial) || []) {
            const fresh = trackerRow(tracker);
            row.className = fresh.className;
            row.setAttribute("aria-label", fresh.getAttribute("aria-label"));
            row.replaceChildren(...fresh.childNodes);
          }
        }
        for (const row of groupsElement.querySelectorAll(".pin-list-row[data-pin-id]")) {
          const pin = pins.get(row.dataset.pinId);
          if (!pin) continue;
          const fresh = pinListRow(pin);
          row.className = fresh.className;
          row.setAttribute("aria-label", fresh.getAttribute("aria-label"));
          row.replaceChildren(...fresh.childNodes);
        }
        for (const row of groupsElement.querySelectorAll(".peloton-row[data-peloton-key]")) {
          const peloton = detectedPelotons.find(item =>
            item.key === row.dataset.pelotonKey
          );
          if (!peloton) continue;
          const fresh = pelotonRow(peloton);
          row.className = fresh.className;
          row.setAttribute("aria-label", fresh.getAttribute("aria-label"));
          row.replaceChildren(...fresh.childNodes);
        }
        updateCheckpointListStatuses();
      }
      window.requestAnimationFrame(updateTrackerMetaTickers);
      updateSideRelativeDistances();
    }

    function removeTracker(serial, preserveUiState = false) {
      removeTrackerProjection(serial, false);
      trackers.delete(serial);
      const marker = markers.get(serial);
      if (marker) {
        marker.preservePopupState = preserveUiState && marker.isPopupOpen();
        if (marker.touchTarget) map.removeLayer(marker.touchTarget);
        map.removeLayer(marker);
      }
      markers.delete(serial);
      if (!preserveUiState) {
        if (followedSerial === serial) {
          followedSerial = null;
          exclusiveProjectionKey = null;
          persistFollowTarget(null);
          renderNavigationControl();
          updateNavigationAssist();
        }
        if (detailedSerial === serial) detailedSerial = null;
      }
    }

    function applyMessageData(message, dirtySerials) {
      if (message.type === "snapshot") {
        receivedSnapshot = true;
        for (const serial of [...trackers.keys()]) {
          if (!trackers.get(serial)?.demo_tracker && !(serial in message.trackers)) {
            removeTracker(serial, true);
          }
        }
      }
      for (const serial of message.removed || []) removeTracker(serial);
      for (const [serial, incoming] of Object.entries(message.trackers || {})) {
        const tracker = { ...incoming, serial };
        updateTrackerRouteDistances(tracker);
        trackers.set(serial, tracker);
        updateMarker(tracker);
        dirtySerials.add(serial);
      }
    }

    function flushTrackerMessages() {
      trackerMessageFrame = null;
      const dirtySerials = new Set();
      for (const message of pendingTrackerMessages.splice(0)) {
        applyMessageData(message, dirtySerials);
      }
      renderTrackerList(dirtySerials);
      if (!clientPositionEnabled && followedSerial) updateNavigationAssist();
      restorePersistedTrackerFollow();
      fitInitialView();
      schedulePersistTrackerState();
    }

    function queueTrackerMessage(message) {
      pendingTrackerMessages.push(message);
      if (trackerMessageFrame === null) {
        trackerMessageFrame = window.requestAnimationFrame(flushTrackerMessages);
      }
    }

    function fitInitialView() {
      if (hasFitInitialView || !tracksLoaded || !receivedSnapshot) return;
      const bounds = trackBounds.isValid() ? L.latLngBounds(trackBounds) : L.latLngBounds([]);
      for (const tracker of trackers.values()) {
        if (validPosition(tracker)) {
          bounds.extend([tracker.latitude, tracker.longitude]);
        }
      }
      if (bounds.isValid()) map.fitBounds(bounds.pad(0.03), { maxZoom: 12 });
      hasFitInitialView = true;
    }

    function refreshTrackerVisibility() {
      for (const tracker of trackers.values()) updateMarker(tracker);
      renderTrackerList();
    }

    function refreshDisplayedAges() {
      const now = Date.now() / 1000;
      refreshTrackerProjections(now);
      if (refreshDetectedPelotons()) renderTrackerList();
      reorderTrackerRowsByDistance();
      reorderSolarRowsByDistance();
      for (const row of groupsElement.querySelectorAll(".tracker-row")) {
        const tracker = listTracker(row.dataset.serial);
        if (!tracker) continue;
        const metaFixed = row.querySelector(".tracker-meta-fixed");
        if (metaFixed) metaFixed.textContent = trackerMetaParts(tracker, now).fixed;
        const marker = tracker.client_tracker ? null : markers.get(tracker.serial);
        if (marker?.isPopupOpen()) updateBoundPopup(marker, popupContent(tracker, now));
      }
      for (const member of groupsElement.querySelectorAll(".peloton-member[data-serial]")) {
        const tracker = trackers.get(member.dataset.serial);
        const meta = member.querySelector(".peloton-member-meta");
        if (!tracker || !meta) continue;
        meta.textContent = pelotonMemberMetaText(tracker, now);
        meta.title = meta.textContent;
      }
      for (const row of groupsElement.querySelectorAll(".pin-list-row[data-pin-id]")) {
        const pin = pins.get(row.dataset.pinId);
        const age = row.querySelector(".pin-list-age");
        if (pin && age) age.textContent = formatPinAge(pin, now);
      }
      for (const row of pinModerationContent.querySelectorAll(
        ".pin-moderation-row[data-pin-id]"
      )) {
        const pin = pins.get(row.dataset.pinId);
        const age = row.querySelector(".pin-moderation-age");
        if (pin && age) age.textContent = formatPinAge(pin, now);
      }
      for (const checkpoint of checkpointMarkers) {
        if (checkpoint.marker.isPopupOpen()) {
          updateBoundPopup(
            checkpoint.marker,
            checkpointPopupContent(checkpoint, now)
          );
        }
      }
      updateCheckpointListStatuses(now);
      updateSideRelativeDistances();
      if (solarSummaryDialog.open) renderSolarSummary(now);
      if (clientSummaryTracker) renderClientLocationControl();
    }

    function setConnectionStatus(text, className = "") {
      statusElement.textContent = text;
      statusElement.className = className;
      const disconnected = className !== "connected" && className !== "stale";
      solarSummaryDialog.classList.toggle("summary-disconnected", disconnected);
    }

    function formatByteCount(bytes) {
      if (bytes < 1024) return `${Math.round(bytes)}\u00a0B`;
      if (bytes < 1024 ** 2) return `${(bytes / 1024).toFixed(1)}\u00a0KiB`;
      return `${(bytes / 1024 ** 2).toFixed(2)}\u00a0MiB`;
    }

    function formatDuration(seconds) {
      if (!Number.isFinite(seconds)) return "unknown";
      if (seconds < 60) return `${Math.round(seconds)}\u00a0s`;
      if (seconds < 3600) {
        return `${Math.floor(seconds / 60)}\u00a0m ${Math.round(seconds % 60)}\u00a0s`;
      }
      if (seconds < 86400) {
        return `${Math.floor(seconds / 3600)}\u00a0h ` +
          `${Math.floor(seconds % 3600 / 60)}\u00a0m`;
      }
      return `${Math.floor(seconds / 86400)}\u00a0d ` +
        `${Math.floor(seconds % 86400 / 3600)}\u00a0h`;
    }

    function renderMetrics(element, metrics, firstGroup = false) {
      element.replaceChildren(...metrics.map((metric, index) => {
        const span = document.createElement("span");
        span.className = "connection-metric";
        if (firstGroup && index === 0) span.classList.add("connection-metric-first");
        span.textContent = metric;
        return span;
      }));
    }

    function scheduleConnectionMetricWrapUpdate() {
      if (connectionMetricLayoutFrame !== null) {
        window.cancelAnimationFrame(connectionMetricLayoutFrame);
      }
      connectionMetricLayoutFrame = window.requestAnimationFrame(() => {
        connectionMetricLayoutFrame = null;
        const metrics = [...statsElement.querySelectorAll(
          ":scope > div:not([hidden]) .connection-metric"
        )];
        for (const metric of metrics) metric.classList.remove("connection-metric-line-start");
        let previousTop = null;
        for (const metric of metrics) {
          const top = metric.offsetTop;
          if (previousTop !== null && top > previousTop + 1) {
            metric.classList.add("connection-metric-line-start");
          }
          previousTop = top;
        }
      });
    }

    function renderConnectionStats() {
      renderMetrics(receivedStatsElement, [
        `Received ${formatByteCount(trafficStats.receivedBytes)}`,
        `Receive average ${formatByteCount(trafficStats.receivedRate)}/s`
      ], true);
      renderMetrics(sentStatsElement, [
        `Sent ${formatByteCount(trafficStats.sentBytes)}`,
        `Send average ${formatByteCount(trafficStats.sentRate)}/s`
      ]);
      renderMetrics(messageStatsElement, [
        `Updates ${trafficStats.updates}`,
        `Heartbeats ${trafficStats.heartbeats}`
      ]);
      for (const element of [proxyConnectionsElement, proxyUpstreamElement, proxyLoadElement]) {
        element.hidden = !proxyStatus;
      }
      if (!proxyStatus) {
        scheduleConnectionMetricWrapUpdate();
        return;
      }
      const proxyBytes = Number.isFinite(proxyStatus.websocket_bytes_sent)
        ? formatByteCount(proxyStatus.websocket_bytes_sent)
        : "unknown";
      const proxyRate = Number.isFinite(
        proxyStatus.websocket_send_rate_bytes_per_second_1m
      )
        ? `${formatByteCount(proxyStatus.websocket_send_rate_bytes_per_second_1m)}/s`
        : "unknown";
      renderMetrics(proxyConnectionsElement, [
        `Proxy clients ${proxyStatus.websocket_connections}`,
        `Peak clients ${proxyStatus.peak_websocket_connections}`,
        `Trackers ${proxyStatus.trackers}`,
        `Proxy sent ${proxyBytes}`,
        `Proxy send average ${proxyRate}`
      ]);
      const upstreamState = proxyStatus.upstream_error ? "Upstream error" : "Upstream OK";
      const pollDuration = Number.isFinite(proxyStatus.last_poll_duration_ms)
        ? `${Math.round(proxyStatus.last_poll_duration_ms)}\u00a0ms`
        : "unknown";
      const cycleInterval = Number.isFinite(proxyStatus.last_poll_cycle_interval_ms)
        ? `${(proxyStatus.last_poll_cycle_interval_ms / 1000).toFixed(1)}\u00a0s cycle`
        : "cycle unknown";
      const cycleDuration = Number.isFinite(proxyStatus.last_poll_cycle_duration_ms)
        ? `${Math.round(proxyStatus.last_poll_cycle_duration_ms)}\u00a0ms work`
        : "work unknown";
      const cycleOverrun = Number.isFinite(proxyStatus.last_poll_cycle_overrun_ms)
        ? `${Math.round(proxyStatus.last_poll_cycle_overrun_ms)}\u00a0ms late`
        : "lateness unknown";
      renderMetrics(proxyUpstreamElement, [
        `Upstream ${upstreamState === "Upstream OK" ? "OK" : "error"}`,
        `Last success ${formatDuration(proxyStatus.last_poll_success_age_seconds)} ago`,
        `Poll time ${pollDuration}`,
        `Cycle work ${cycleDuration.replace(/ work$/, "")}`,
        `Cycle interval ${cycleInterval.replace(/ cycle$/, "")}`,
        `Cycle lateness ${cycleOverrun.replace(/ late$/, "")}`
      ]);
      const systemLoad = Number.isFinite(proxyStatus.system_load_percent)
        ? `${proxyStatus.system_load_percent.toFixed(1)}% load`
        : "load unknown";
      const systemMemory = Number.isFinite(proxyStatus.system_memory_used_percent)
        ? `${proxyStatus.system_memory_used_percent.toFixed(1)}% memory`
        : "memory unknown";
      renderMetrics(proxyLoadElement, [
        `System ${systemLoad}`,
        `System ${systemMemory}`,
        `Uptime ${formatDuration(proxyStatus.uptime_seconds)}`,
        `Polls ${proxyStatus.poll_successes}`,
        `Poll failures ${proxyStatus.poll_failures}`,
        `Messages sent ${proxyStatus.messages_sent}`,
        `Send failures ${proxyStatus.send_failures}`
      ]);
      scheduleConnectionMetricWrapUpdate();
    }

    function sampleTrafficRates() {
      const now = performance.now();
      const elapsedSeconds = Math.max((now - trafficStats.sampledAt) / 1000, 0.001);
      const alpha = 1 - Math.exp(-elapsedSeconds / 60);
      const receivedInstant = (trafficStats.receivedBytes - trafficStats.sampledReceivedBytes) / elapsedSeconds;
      const sentInstant = (trafficStats.sentBytes - trafficStats.sampledSentBytes) / elapsedSeconds;
      trafficStats.receivedRate += alpha * (receivedInstant - trafficStats.receivedRate);
      trafficStats.sentRate += alpha * (sentInstant - trafficStats.sentRate);
      trafficStats.sampledReceivedBytes = trafficStats.receivedBytes;
      trafficStats.sampledSentBytes = trafficStats.sentBytes;
      trafficStats.sampledAt = now;
      renderConnectionStats();
    }

    statusElement.addEventListener("click", () => {
      const show = statsElement.hidden;
      statsElement.hidden = !show;
      statusElement.setAttribute("aria-expanded", String(show));
      if (show) scheduleConnectionMetricWrapUpdate();
    });
    renderConnectionStats();

    function cancelScheduledReconnect() {
      window.clearTimeout(reconnectTimer);
      window.clearInterval(reconnectCountdown);
      reconnectTimer = null;
      reconnectCountdown = null;
    }

    function restoreSummaryAfterReconnect() {
      if (!summaryToRestoreAfterReconnect) return;
      renderSolarSummary();
      if (!solarSummaryDialog.open) {
        try {
          solarSummaryDialog.showModal();
        } catch (error) {
          console.warn("Could not restore the open summary after reconnect", error);
          return;
        }
      }
      summaryToRestoreAfterReconnect = null;
    }

    function connect(destination = currentWebsocketUrl || websocketUrl()) {
      cancelScheduledReconnect();
      summaryToRestoreAfterReconnect ||= solarSummaryDialog.open ? "race" : null;
      currentWebsocketUrl = destination;
      setConnectionStatus("Connecting");
      const socket = new WebSocket(destination);
      let redirectDestination = null;
      let staleTimer = null;
      let silenceTimer = null;
      const resetSilenceTimer = () => {
        lastSocketActivityAt = Date.now();
        window.clearTimeout(staleTimer);
        window.clearTimeout(silenceTimer);
        setConnectionStatus("Connected", "connected");
        staleTimer = window.setTimeout(() => {
          if (socket.readyState === WebSocket.OPEN) {
            setConnectionStatus("Connected", "stale");
          }
        }, SOCKET_STALE_WARNING_MS);
        silenceTimer = window.setTimeout(() => {
          if (socket.readyState === WebSocket.OPEN) {
            setConnectionStatus("Retry in 1s", "disconnected");
            socket.close(4000, "No data or heartbeat for 60 seconds");
            // If a broken connection never completes the close handshake,
            // replace it anyway. Browsers don't expose a force-close API.
            window.setTimeout(() => {
              if (activeSocket === socket) {
                activeSocket = null;
                clearLocalPendingPins();
                connect();
              }
            }, 1000);
          }
        }, SOCKET_SILENCE_TIMEOUT_MS);
      };
      activeSocket = socket;
      socket.addEventListener("open", () => {
        reconnectDelay = 1000;
        setConnectionStatus("Connected", "connected");
        resetSilenceTimer();
        staffUnlocked = false;
        const savedPassword = cachedStaffPassword();
        if (savedPassword) authenticateStaff(savedPassword, false);
        restoreSummaryAfterReconnect();
      });
      socket.addEventListener("message", event => {
        try {
          trafficStats.receivedBytes += typeof event.data === "string"
            ? textEncoder.encode(event.data).byteLength
            : event.data.byteLength ?? event.data.size ?? 0;
          const message = JSON.parse(event.data);
          if (message.type === "heartbeat") {
            trafficStats.heartbeats += 1;
            renderConnectionStats();
            resetSilenceTimer();
            return;
          }
          if (message.type === "redirect") {
            if (!validWebsocketUrl(message.url)) {
              throw new Error("Proxy supplied an invalid redirect URL");
            }
            redirectDestination = message.url;
            setConnectionStatus("Redirecting to overflow proxy…");
            socket.close();
            return;
          }
          if (message.type === "reload") {
            const delaySeconds = Number(message.delay_seconds);
            if (!Number.isFinite(delaySeconds) || delaySeconds < 0 || delaySeconds > 5) {
              throw new Error("Proxy supplied an invalid reload delay");
            }
            if (clientReloadTimer === null) {
              setConnectionStatus(`Reloading in ${Math.ceil(delaySeconds)}s`, "stale");
              clientReloadTimer = window.setTimeout(() => {
                window.location.reload();
              }, delaySeconds * 1000);
            }
            return;
          }
          if (message.type === "staff_authentication") {
            staffUnlocked = message.success === true;
            if (staffUnlocked && pendingStaffPassword) {
              cacheStaffPassword(pendingStaffPassword);
            } else if (!staffUnlocked) {
              clearCachedStaffPassword();
              if (manualStaffAuthentication) window.alert("Incorrect Event Staff password.");
            }
            pendingStaffPassword = null;
            manualStaffAuthentication = false;
            if (!staffUnlocked) proxyStatus = null;
            renderTrackerList();
            for (const pin of pins.values()) renderPin(pin, false);
            renderPinControl();
            if (pinModerationDialog.open) renderPinModeration();
            renderConnectionStats();
            return;
          }
          if (message.type === "pins_snapshot") {
            if (!Array.isArray(message.pins)) throw new Error("Invalid pin snapshot");
            reconcilePinsSnapshot(message.pins);
            resetSilenceTimer();
            return;
          }
          if (message.type === "pin_submission") {
            if (typeof message.client_id !== "string") {
              throw new Error("Invalid pin submission acknowledgement");
            }
            removePin(message.client_id);
            upsertPin({
              ...message.pin,
              local_pending: message.pin?.approved !== true
            }, false);
            resetSilenceTimer();
            return;
          }
          if (message.type === "pin_created" || message.type === "pin_approved") {
            upsertPin(
              { ...message.pin, local_pending: false },
              false
            );
            renderPinControl();
            resetSilenceTimer();
            return;
          }
          if (message.type === "pin_deleted") {
            if (typeof message.id === "string") removePin(message.id);
            renderPinControl();
            resetSilenceTimer();
            return;
          }
          if (message.type === "pin_rate_limited") {
            if (typeof message.client_id === "string") removePin(message.client_id);
            window.alert("This pin was discarded because too many pins were submitted recently.");
            resetSilenceTimer();
            return;
          }
          if (message.type === "pin_not_found") {
            if (typeof message.id === "string") removePin(message.id);
            resetSilenceTimer();
            return;
          }
          if (message.type === "proxy_status") {
            proxyStatus = message;
            resetSilenceTimer();
            renderConnectionStats();
            return;
          }
          if (message.type === "update") trafficStats.updates += 1;
          if (message.type === "snapshot" || message.type === "update") {
            queueTrackerMessage(message);
          }
          if (message.type === "snapshot" || message.type === "update") resetSilenceTimer();
          renderConnectionStats();
        } catch (error) {
          console.error("Invalid proxy message", error);
          setConnectionStatus("Invalid data from proxy", "disconnected");
        }
      });
      socket.addEventListener("close", () => {
        window.clearTimeout(staleTimer);
        window.clearTimeout(silenceTimer);
        // A timed-out socket may close after its replacement is connected.
        if (activeSocket !== socket) return;
        summaryToRestoreAfterReconnect = solarSummaryDialog.open ? "race" : null;
        activeSocket = null;
        clearLocalPendingPins();
        staffUnlocked = false;
        proxyStatus = null;
        renderTrackerList();
        renderConnectionStats();
        if (redirectDestination) {
          reconnectDelay = 1000;
          connect(redirectDestination);
          return;
        }
        const delay = Math.round(reconnectDelay * (
          RECONNECT_JITTER_MINIMUM + Math.random() * RECONNECT_JITTER_SPREAD
        ));
        let secondsRemaining = Math.ceil(delay / 1000);
        setConnectionStatus(`Retry in ${secondsRemaining}s`, "disconnected");
        reconnectCountdown = window.setInterval(() => {
          secondsRemaining -= 1;
          if (secondsRemaining > 0) {
            setConnectionStatus(`Retry in ${secondsRemaining}s`, "disconnected");
          } else {
            setConnectionStatus("Reconnecting…", "disconnected");
          }
        }, 1000);
        reconnectTimer = window.setTimeout(() => {
          window.clearInterval(reconnectCountdown);
          reconnectCountdown = null;
          reconnectTimer = null;
          connect();
        }, delay);
        reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX_DELAY_MS);
      });
      socket.addEventListener("error", () => socket.close());
    }

    function reconnectWhenForegrounded() {
      if (document.visibilityState === "hidden") return;
      const socketState = activeSocket?.readyState;
      const silentTooLong = socketState === WebSocket.OPEN
        && Date.now() - lastSocketActivityAt >= SOCKET_SILENCE_TIMEOUT_MS;
      if (socketState === WebSocket.CONNECTING || (socketState === WebSocket.OPEN && !silentTooLong)) {
        return;
      }

      cancelScheduledReconnect();
      const oldSocket = activeSocket;
      activeSocket = null;
      if (oldSocket?.readyState === WebSocket.OPEN) {
        oldSocket.close(4001, "Page resumed after connection became stale");
      }
      reconnectDelay = 1000;
      connect();
    }

    document.addEventListener("visibilitychange", reconnectWhenForegrounded);
    window.addEventListener("focus", reconnectWhenForegrounded);
    window.addEventListener("pageshow", reconnectWhenForegrounded);
    window.addEventListener("resize", () => {
      if (trackerTickerResizeFrame !== null) {
        window.cancelAnimationFrame(trackerTickerResizeFrame);
      }
      trackerTickerResizeFrame = window.requestAnimationFrame(() => {
        trackerTickerResizeFrame = null;
        updateTrackerMetaTickers();
        scheduleConnectionMetricWrapUpdate();
        scheduleTeamBadgeLayout();
      });
    });

    window.setInterval(refreshTrackerVisibility, 30000);
    window.setInterval(refreshDisplayedAges, 1000);
    window.setInterval(sampleTrafficRates, 1000);
    installBaseMapControl();
    setCloudOverlayEnabled(readPersistedCloudOverlayEnabled(), false);
    setRadarOverlayEnabled(readPersistedRadarOverlayEnabled(), false);
    projectionEnabled = readPersistedProjectionEnabled();
    installProjectionControl();
    installPinControl();
    installTeamBadgeControl();
    installClientLocationControl();
    if (pendingRestoredFollowTarget?.type === "client") {
      pendingRestoredFollowTarget = null;
      enableClientPosition(true);
    } else if (readPersistedClientPositionEnabled()) {
      enableClientPosition(false);
    }
    loadSurvivalMap();
    loadGpxTracks();
    restorePersistedTrackers().finally(connect);
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js")
          .then(async () => {
            const installedPwa = window.matchMedia("(display-mode: standalone)").matches
              || window.navigator.standalone === true;
            if (!installedPwa) return;
            const registration = await navigator.serviceWorker.ready;
            registration.active?.postMessage({ type: "prefetch-maplibre" });
          })
          .catch(error => {
            console.warn("Could not register the live-map service worker", error);
          });
      });
    }
  </script>
</body>
</html>

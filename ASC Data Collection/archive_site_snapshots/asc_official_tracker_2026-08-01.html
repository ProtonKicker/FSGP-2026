<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1457d9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ASC Trackers">
  <title>ASC Live Trackers</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="iosix-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --sidebar-width: 320px;
      --border: #d8dee8;
      --muted: #667085;
      --accent: #1457d9;
      --surface: #fff;
      --relative-distance-width: 52px;
    }

    * { box-sizing: border-box; }

    html, body, main { width: 100%; height: 100%; margin: 0; }

    body { background: #edf1f5; color: #172033; }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
      overflow: hidden;
    }

    #map { min-width: 0; height: 100%; }

    aside {
      z-index: 500;
      display: flex;
      min-width: 0;
      min-height: 0;
      height: 100%;
      flex-direction: column;
      overflow: hidden;
      border-left: 1px solid var(--border);
      background: var(--surface);
      box-shadow: -4px 0 18px rgb(28 39 57 / 10%);
    }

    .sidebar-header {
      flex: 0 0 auto;
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border);
    }

    .asc-header-link {
      display: block;
      width: 100%;
      margin-bottom: 14px;
    }

    .asc-header-link:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
    }

    .asc-header-logo { display: block; width: 100%; height: auto; }

    .sidebar-title-row {
      display: block;
    }

    .title-heading {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .qr-share-button {
      display: grid;
      flex: 0 0 auto;
      width: 27px;
      height: 27px;
      padding: 3px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: #344054;
      cursor: pointer;
      place-items: center;
    }
    .qr-share-button:hover { background: #edf2f8; }
    .qr-share-button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }
    .qr-share-button svg { display: block; width: 21px; height: 21px; }

    .qr-dialog {
      width: min(90vw, 520px);
      padding: 0;
      border: 0;
      border-radius: 14px;
      background: #fff;
      color: #172033;
      box-shadow: 0 18px 60px rgb(15 23 42 / 35%);
    }
    .qr-dialog::backdrop { background: rgb(15 23 42 / 58%); }
    .qr-dialog-inner {
      position: relative;
      padding: 28px;
      text-align: center;
    }
    .qr-dialog h2 { margin: 0 34px 18px; font-size: 1.2rem; }
    .qr-dialog-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #475467;
      font-size: 1.65rem;
      line-height: 1;
      cursor: pointer;
    }
    .qr-dialog-close:hover { background: #edf2f8; }
    .qr-code {
      display: grid;
      min-height: 280px;
      place-items: center;
    }
    .qr-code svg {
      display: block;
      width: min(72vw, 390px);
      height: auto;
    }
    .qr-url {
      display: block;
      margin-top: 16px;
      overflow-wrap: anywhere;
      color: #475467;
      font-size: .78rem;
      text-decoration: none;
    }

    .map-watermark {
      position: absolute;
      bottom: 18px;
      left: 14px;
      z-index: 450;
      display: block;
      width: 145px;
      opacity: .38;
      transition: opacity 150ms ease;
    }

    .map-watermark:hover,
    .map-watermark:focus-visible { opacity: .9; }
    .map-watermark img { display: block; width: 100%; height: auto; }

    .electrek-watermark {
      position: absolute;
      top: 14px;
      right: 14px;
      z-index: 450;
      display: block;
      width: 125px;
      opacity: .52;
      transition: opacity 150ms ease;
    }
    .electrek-watermark:hover,
    .electrek-watermark:focus-visible { opacity: .95; }
    .electrek-watermark img { display: block; width: 100%; height: auto; }

    h1 { margin: 0; font-size: 1.12rem; line-height: 1.2; white-space: nowrap; }
    h1 a { color: inherit; text-decoration-color: #98a2b3; text-underline-offset: 3px; }
    h1 a:hover { color: var(--accent); }

    #connection-status {
      display: inline-flex;
      justify-content: flex-start;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      color: var(--muted);
      font-size: .82rem;
      text-align: left;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      font-family: inherit;
    }

    #connection-status::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #e09b18;
      content: "";
    }

    #connection-status.connected::before { background: #1c9b55; }
    #connection-status.stale::before { background: #e09b18; }
    #connection-status.disconnected::before { background: #d83b3b; }

    .connection-block { min-width: 0; }
    #connection-stats {
      margin-top: 6px;
      color: var(--muted);
      font-size: 0;
      line-height: 1.45;
    }
    #connection-stats[hidden] { display: none; }
    #connection-stats > div { display: inline; }
    #connection-stats > div[hidden] { display: none; }
    .connection-metric {
      display: inline-block;
      margin-left: .42em;
      font-size: .68rem;
      white-space: nowrap;
    }
    .connection-metric::before {
      margin-right: .42em;
      content: "·";
    }
    .connection-metric.connection-metric-first::before,
    .connection-metric.connection-metric-line-start::before { visibility: hidden; }

    #tracker-groups {
      flex: 1 1 0;
      height: 0;
      min-height: 0;
      overflow-x: hidden;
      overflow-y: scroll;
      overscroll-behavior: contain;
      padding: 4px 14px 24px;
      scrollbar-gutter: stable;
      scrollbar-color: #a9b4c4 #eef1f5;
      scrollbar-width: thin;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    #tracker-groups::-webkit-scrollbar { width: 10px; }
    #tracker-groups::-webkit-scrollbar-track { background: #eef1f5; }
    #tracker-groups::-webkit-scrollbar-thumb {
      border: 2px solid #eef1f5;
      border-radius: 8px;
      background: #a9b4c4;
    }

    .tracker-group h2 {
      position: sticky;
      top: 0;
      z-index: 1;
      margin: 0;
      padding: 16px 2px 8px;
      background: linear-gradient(var(--surface) 80%, rgb(255 255 255 / 0%));
      color: #475467;
      font-size: .75rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .tracker-group h2.staff-unlock { cursor: pointer; user-select: none; }
    .group-summary-button {
      margin-left: 8px;
      padding: 2px 7px;
      border: 1px solid #b9c4d3;
      border-radius: 5px;
      background: #fff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: none;
    }
    .group-summary-button:hover,
    .group-summary-button:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
    }
    .tracker-group h2.staff-unlock:hover,
    .tracker-group h2.staff-unlock:focus-visible { color: var(--accent); }
    .tracker-group h2.staff-unlock.holding { color: var(--accent); text-decoration: underline; }
    .staff-access-state {
      margin-left: 5px;
      cursor: pointer;
      font-size: .66rem;
      font-weight: 600;
      letter-spacing: 0;
      touch-action: manipulation;
      text-transform: none;
    }
    .group-collapse-button {
      float: right;
      width: 24px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-size: 1rem;
      line-height: 1;
    }
    .group-collapse-button:hover,
    .group-collapse-button:focus-visible {
      background: #e8edf4;
      color: var(--accent);
    }

    .tracker-group,
    .tracker-list {
      width: 100%;
      min-width: 0;
    }

    .tracker-list {
      display: grid;
      align-content: start;
      gap: 7px;
    }
    .tracker-list > .tracker-row,
    .tracker-list > .pin-list-row {
      width: 100%;
      justify-self: stretch;
    }
    .tracker-group.collapsed .tracker-list { display: none; }

    .tracker-identity { min-width: 0; }

    .tracker-row {
      display: grid;
      grid-template-columns:
        18px minmax(0, 1fr) var(--relative-distance-width) 34px;
      align-items: center;
      gap: 8px;
      min-height: 49px;
      padding: 8px 8px 8px 10px;
      border: 1px solid #e4e8ef;
      border-radius: 9px;
      background: #fafbfc;
      cursor: pointer;
      scroll-margin-top: 44px;
    }

    .tracker-row:hover { border-color: #b9c4d3; background: #f4f7fb; }
    .tracker-row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .tracker-row.relative-reference-row,
    .pin-list-row.relative-reference-row {
      border-color: #a9ccef;
      background: #eef7ff;
      box-shadow: inset 3px 0 0 #217bda;
    }
    .tracker-row.relative-reference-row:hover,
    .pin-list-row.relative-reference-row:hover {
      border-color: #72aee6;
      background: #e1f1ff;
    }
    .checkpoint-list-row {
      grid-template-columns:
        18px minmax(0, 1fr) var(--relative-distance-width) 34px;
    }
    .checkpoint-list-flag {
      position: relative;
      align-self: center;
      width: 15px;
      height: 14px;
      border-left: 2px solid #344054;
    }
    .checkpoint-list-flag::before {
      position: absolute;
      top: 0;
      left: 1px;
      width: 11px;
      height: 7px;
      border: 1px solid #344054;
      background: #fff;
      content: "";
    }
    .checkpoint-list-row.stage-stop .checkpoint-list-flag::before,
    .solar-summary-checkpoint.stage-stop .checkpoint-list-flag::before,
    .checkpoint-summary-stop.stage-stop .checkpoint-list-flag::before {
      background: #f2b705;
    }
    .checkpoint-list-row.finish-stop .checkpoint-list-flag::before,
    .solar-summary-checkpoint.finish-stop .checkpoint-list-flag::before,
    .checkpoint-summary-stop.finish-stop .checkpoint-list-flag::before {
      background:
        conic-gradient(#111 25%, #fff 0 50%, #111 0 75%, #fff 0) 0 0 / 6px 6px;
    }
    .tracker-row.tracker-stale,
    .tracker-row.tracker-stale .tracker-meta {
      color: #8b919a;
    }

    .tracker-color {
      width: 12px;
      height: 12px;
      border: 2px solid rgb(255 255 255 / 90%);
      border-radius: 50%;
      box-shadow: 0 0 0 1px rgb(0 0 0 / 25%);
    }

    .tracker-color.tracker-list-arrow {
      width: 18px;
      height: 18px;
      border: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(0 1px 1px rgb(0 0 0 / 35%));
    }
    .tracker-color.client-location-swatch {
      width: 16px;
      height: 16px;
      border: 3px solid rgb(255 255 255 / 78%);
      background: rgb(33 123 218 / 50%);
      box-shadow:
        0 0 0 1px rgb(33 73 112 / 20%),
        0 0 0 4px rgb(33 123 218 / 14%);
    }
    .tracker-color.client-location-swatch.tracker-list-arrow {
      width: 20px;
      height: 20px;
      border: 0;
      background: transparent;
      box-shadow: none;
      filter: drop-shadow(0 2px 3px rgb(25 72 120 / 24%));
    }

    .tracker-list-arrow svg {
      display: block;
      overflow: visible;
      transform: rotate(var(--course));
      transform-origin: center;
    }

    .survival-city-label {
      color: #4f5968;
      font-size: 10px;
      font-weight: 650;
      text-shadow:
        -1px -1px 0 rgb(255 255 255 / 90%),
        1px -1px 0 rgb(255 255 255 / 90%),
        -1px 1px 0 rgb(255 255 255 / 90%),
        1px 1px 0 rgb(255 255 255 / 90%);
      background: transparent;
      border: 0;
      box-shadow: none;
    }

    .survival-city-label::before { display: none; }

    .tracker-name {
      display: flex;
      gap: 6px;
      align-items: baseline;
      overflow: hidden;
      font-size: .9rem;
      font-weight: 650;
      white-space: nowrap;
    }

    .tracker-name-label {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tracker-meta {
      display: flex;
      margin-top: 2px;
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: .72rem;
      white-space: nowrap;
    }
    .tracker-meta-fixed { flex: none; }
    .tracker-meta-distance-separator {
      flex: none;
      margin-left: .35em;
    }
    .tracker-meta-distances {
      flex: 1;
      min-width: 0;
      margin-left: .35em;
      overflow: hidden;
    }
    .tracker-meta-distance-text {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tracker-meta-distances.ticker-active .tracker-meta-distance-text {
      width: max-content;
      overflow: visible;
      text-overflow: clip;
      animation:
        tracker-meta-ticker var(--ticker-duration) linear var(--ticker-delay, 0s) infinite;
      will-change: transform;
    }
    @keyframes tracker-meta-ticker {
      0%, 12% { transform: translateX(0); }
      45%, 57% { transform: translateX(var(--ticker-distance)); }
      90%, 100% { transform: translateX(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .tracker-meta-distances.ticker-active .tracker-meta-distance-text {
        width: auto;
        overflow: hidden;
        text-overflow: ellipsis;
        animation: none;
      }
    }

    .follow-button {
      display: grid;
      width: 34px;
      height: 34px;
      min-width: 34px;
      padding: 7px;
      place-items: center;
      border: 1px solid #c8d0dc;
      border-radius: 7px;
      background: #fff;
      color: #344054;
      cursor: pointer;
      font: inherit;
      font-size: .75rem;
      font-weight: 700;
    }

    .follow-button svg { display: block; width: 18px; height: 18px; }

    .follow-button:hover { border-color: var(--accent); color: var(--accent); }

    .follow-button[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .tracker-actions {
      display: contents;
    }
    .side-relative-distance {
      display: block;
      width: var(--relative-distance-width);
      overflow: hidden;
      color: var(--accent);
      font-size: .68rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
      text-overflow: clip;
      white-space: nowrap;
    }

    .empty-group { margin: 8px 2px; color: var(--muted); font-size: .82rem; }

    .tracker-popup { width: 260px; min-width: 260px; }
    .tracker-popup dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
    .tracker-popup dt { color: var(--muted); font-size: .75rem; }
    .tracker-popup dd { margin: 0; text-align: right; font-size: .78rem; font-weight: 600; }
    .tracker-popup dd a { color: inherit; text-decoration: none; }

    .popup-follow-button {
      width: 100%;
      margin: 0 0 9px;
      padding: 7px 10px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: #fff;
      color: var(--accent);
      cursor: pointer;
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
    }

    .popup-follow-button[aria-pressed="true"] { background: var(--accent); color: #fff; }

    .leaflet-tooltip.tracker-projection-tooltip {
      padding: 6px 7px;
      line-height: 1.3;
    }
    .projection-tooltip-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .projection-tooltip-name { flex: 1; }
    .projection-tooltip-follow {
      display: grid;
      width: 24px;
      height: 24px;
      padding: 3px;
      place-items: center;
      border: 1px solid #aeb8c7;
      border-radius: 5px;
      background: #fff;
      color: #344054;
      cursor: pointer;
    }
    .projection-tooltip-follow svg { display: block; width: 16px; height: 16px; }
    .projection-tooltip-follow[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .projection-tooltip-detail {
      margin-top: 2px;
      color: #596579;
      font-size: .72rem;
      font-weight: 500;
    }

    .tracker-arrow-icon {
      border: 0;
      background: transparent;
    }

    .tracker-arrow {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 1px 2px rgb(0 0 0 / 45%));
      transform: rotate(var(--course));
      transform-origin: center;
    }
    .tracker-arrow.staff-tracker-marker,
    .staff-tracker-projection {
      overflow: visible;
      filter:
        drop-shadow(0 0 4px currentColor)
        drop-shadow(0 0 11px currentColor)
        drop-shadow(0 1px 2px rgb(0 0 0 / 45%));
    }
    .staff-tracker-circle {
      filter:
        drop-shadow(0 0 5px var(--staff-marker-color))
        drop-shadow(0 0 12px var(--staff-marker-color));
    }

    .tracker-arrow svg { display: block; overflow: visible; }

    .route-legend {
      padding: 7px 9px;
      border-radius: 5px;
      background: rgb(255 255 255 / 25%);
      box-shadow: 0 1px 5px rgb(0 0 0 / 28%);
      color: #344054;
      font-size: .7rem;
      line-height: 1.6;
    }
    .current-route-speed-limit {
      display: grid;
      min-width: 48px;
      padding: 4px 6px 5px;
      border: 3px solid #111;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 1px 5px rgb(0 0 0 / 32%);
      color: #111;
      line-height: 1;
      place-items: center;
    }
    .current-route-speed-limit[hidden] { display: none; }
    .current-route-speed-limit-label {
      font-size: .52rem;
      font-weight: 900;
      letter-spacing: -.02em;
    }
    .current-route-speed-limit-value {
      margin-top: 2px;
      font-size: 1.45rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }
    .current-route-speed-control {
      display: grid;
      justify-items: center;
      gap: 3px;
    }
    .current-route-step {
      color: #263244;
      font-size: 1.23rem;
      font-weight: 750;
      line-height: 1.1;
      text-shadow:
        0 0 2px #fff,
        0 0 4px #fff,
        0 1px 1px rgb(255 255 255 / 90%);
    }
    .current-route-step[hidden] { display: none; }
    .leaflet-control-scale-line {
      background: transparent;
    }

    .route-key { display: inline-block; width: 22px; margin-right: 6px; border-top: 3px solid; vertical-align: middle; }
    .route-key.segment { border-color: #bd5f64; }
    .route-key.loop { border-color: #5d7fa5; }
    .route-key.alternate { border-color: #b5a350; }
    .route-total {
      margin-top: 4px;
      padding-top: 4px;
      border-top: 1px solid rgb(52 64 84 / 22%);
      font-weight: 750;
      text-align: right;
    }
    .measurement-label {
      padding: 3px 7px;
      border: 1px solid rgb(31 41 55 / 75%);
      border-radius: 12px;
      background: rgb(255 249 196 / 96%);
      box-shadow: 0 1px 4px rgb(0 0 0 / 30%);
      color: #172033;
      font-size: .72rem;
      font-weight: 750;
      line-height: 1.2;
      text-align: center;
      white-space: nowrap;
    }
    .route-course-icon {
      border: 0;
      background: transparent;
    }
    .route-info-marker {
      cursor: pointer;
      touch-action: manipulation;
    }
    .route-info-marker::before {
      position: absolute;
      inset: -9px;
      content: "";
    }
    .route-direction-arrow {
      width: 15px;
      height: 15px;
      color: var(--route-arrow-color);
      transform: rotate(var(--route-heading));
      transform-origin: center;
    }
    .route-direction-arrow svg { display: block; overflow: visible; }
    .route-loop-start {
      width: 22px;
      height: 22px;
      filter:
        drop-shadow(0 0 1px rgb(255 255 255 / 100%))
        drop-shadow(0 1px 2px rgb(0 0 0 / 48%));
    }
    .route-loop-start svg { display: block; overflow: visible; }
    .route-checkpoint-marker {
      filter: drop-shadow(0 2px 2px rgb(0 0 0 / 42%));
      overflow: visible;
    }
    .route-checkpoint-marker svg { display: block; overflow: visible; }
    .checkpoint-popup-title {
      margin: 0 0 8px;
      font-weight: 750;
      text-align: center;
    }
    .checkpoint-eta-list {
      display: grid;
      width: min(330px, calc(100vw - 90px));
      min-width: 0;
      gap: 5px;
    }
    .checkpoint-eta-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 8px;
    }
    .checkpoint-summary-content .checkpoint-eta-row {
      grid-template-columns: 18px minmax(0, 1fr) auto auto;
      padding: 8px 8px 8px 14px;
    }
    .checkpoint-summary-content .checkpoint-eta-list {
      width: 100%;
      max-width: 100%;
    }
    .checkpoint-summary-content .checkpoint-eta-name {
      overflow: hidden;
      text-overflow: ellipsis;

  <script>
    "use strict";

    const currentYear = new Date().getFullYear();

    const PIN_COLOR_STORAGE_KEY = "asc-live-map-pin-color";
    const CLOSED_PIN_POPUPS_STORAGE_KEY = "asc-live-map-closed-pin-popups";
    let solarSortByDistance = (() => {
      try {
        return window.localStorage.getItem(SOLAR_SORT_STORAGE_KEY) !== "number";
      } catch (error) {
        return true;
      }
    })();
    const qrShareButton = document.querySelector("#qr-share-button");
    const qrDialog = document.querySelector("#qr-dialog");
    const qrCodeElement = document.querySelector("#qr-code");
    const qrUrlElement = document.querySelector("#qr-url");
    let qrLibraryPromise = null;

    function currentShareUrl() {
      const url = new URL(window.location.href);
      url.hash = "";
      return url.href;
    }

    function ensureQrLibraryLoaded() {
      if (window.qrcode) return Promise.resolve();
      if (!qrLibraryPromise) {
        qrLibraryPromise = loadScript("vendor/qrcode-generator/qrcode.js");
      }
      return qrLibraryPromise;
    }

    async function showQrCode() {
      const shareUrl = currentShareUrl();
      qrCodeElement.textContent = "Generating QR code…";
      qrUrlElement.href = shareUrl;
      qrUrlElement.textContent = shareUrl;
      qrDialog.showModal();
      try {
        await ensureQrLibraryLoaded();
        const code = window.qrcode(0, "M");
        code.addData(shareUrl);
        code.make();
        qrCodeElement.innerHTML = code.createSvgTag(8, 4);
        qrCodeElement.querySelector("svg")?.setAttribute("aria-label", `QR code for ${shareUrl}`);
      } catch (error) {
        console.warn("Could not generate the share QR code", error);
        qrCodeElement.textContent = "Could not generate the QR code.";
      }
    }

    qrShareButton.addEventListener("click", showQrCode);
    qrDialog.querySelector(".qr-dialog-close").addEventListener("click", () => qrDialog.close());
    qrDialog.addEventListener("click", event => {
      if (event.target === qrDialog) qrDialog.close();
    });

    function readPersistedMapView() {
      try {
        const value = JSON.parse(window.localStorage.getItem(MAP_VIEW_STORAGE_KEY));
        if (
          Number.isFinite(value?.latitude) && value.latitude >= -90 && value.latitude <= 90
          && Number.isFinite(value?.longitude) && value.longitude >= -180 && value.longitude <= 180
          && Number.isFinite(value?.zoom) && value.zoom >= 1 && value.zoom <= 24
        ) return value;
      } catch (error) {
        // Storage may be unavailable or contain data from an older format.
      }
      return null;
    }

    const persistedMapView = readPersistedMapView();
    const initialMapCenter = persistedMapView
      ? [persistedMapView.latitude, persistedMapView.longitude]
      : [39.5, -98.35];
    const initialMapZoom = persistedMapView?.zoom ?? 4;
    const map = L.map("map", { zoomControl: true, minZoom: 1 })
      .setView(initialMapCenter, initialMapZoom);
    const mapScale = L.control.scale({
      position: "bottomright",
      metric: true,
      imperial: true,
      maxWidth: 140
    });
    map.getContainer().append(document.querySelector(".map-watermark"));
    map.getContainer().append(document.querySelector(".electrek-watermark"));
    const navigationAssistElement = document.querySelector("#navigation-assist");
    const navigationTurnArrowElement =
      document.querySelector("#navigation-turn-arrow");
    const navigationInstructionElement =
      document.querySelector("#navigation-instruction");
    const navigationDistanceElement =
      document.querySelector("#navigation-distance");
    map.getContainer().append(navigationAssistElement);
    map.createPane("followedTrackerPane");
    map.getPane("followedTrackerPane").style.zIndex = "700";
    map.getPane("popupPane").style.zIndex = "800";
    map.getPane("tooltipPane").style.zIndex = "760";
    map.createPane("measurementPane");
    map.getPane("measurementPane").style.zIndex = "745";
    map.getPane("measurementPane").style.pointerEvents = "none";
    map.createPane("routeSegmentPane");
    map.getPane("routeSegmentPane").style.zIndex = "350";
    map.createPane("routeLoopPane");
    map.getPane("routeLoopPane").style.zIndex = "355";
    map.createPane("routeAlternatePane");
    map.getPane("routeAlternatePane").style.zIndex = "360";
    map.createPane("routeMarkerPane");
    map.getPane("routeMarkerPane").style.zIndex = "375";
    map.createPane("survivalPane");
    map.getPane("survivalPane").style.zIndex = "325";
    map.createPane("cloudPane");
    map.getPane("cloudPane").style.zIndex = "340";
    map.createPane("radarPane");
    map.getPane("radarPane").style.zIndex = "345";
    map.createPane("clientAccuracyPane");
    map.getPane("clientAccuracyPane").style.zIndex = "425";
    map.createPane("clientPositionPane");
    map.getPane("clientPositionPane").style.zIndex = "650";
    map.createPane("projectionLinePane");
    map.getPane("projectionLinePane").style.zIndex = "390";
    map.createPane("projectionPane");
    map.getPane("projectionPane").style.zIndex = "625";
    map.createPane("followedProjectionLinePane");
    map.getPane("followedProjectionLinePane").style.zIndex = "690";
    map.createPane("followedProjectionPane");
    map.getPane("followedProjectionPane").style.zIndex = "725";
    map.createPane("teamBadgeLinePane");
    map.getPane("teamBadgeLinePane").style.zIndex = "610";
    map.getPane("teamBadgeLinePane").style.pointerEvents = "none";
    map.createPane("teamBadgePane");
    map.getPane("teamBadgePane").style.zIndex = "735";
    let baseMapLayer = null;
    let baseMapButton = null;
    let baseMapEnabled = false;
    let baseMapLoading = false;
    let mapLibreLoadPromise = null;
    let cloudOverlayLayer = null;
    let cloudOverlayButton = null;
    let cloudOverlayEnabled = false;
    let cloudOverlayLayerName = null;
    let cloudOverlayRefreshTimer = null;
    let radarOverlayLayer = null;
    let radarOverlayButton = null;
    let radarOverlayEnabled = false;
    let radarOverlayRefreshTimer = null;
    const CLOUD_WMS_URL =
      "https://nowcoast.noaa.gov/geoserver/observations/satellite/ows";
    const CLOUD_REFRESH_INTERVAL_MS = 5 * 60 * 1000;
    const RADAR_WMS_URL =
      "https://nowcoast.noaa.gov/geoserver/observations/weather_radar/ows";
    const RADAR_REFRESH_INTERVAL_MS = 2 * 60 * 1000;

    function readPersistedBaseMapEnabled() {
      try {
        return window.localStorage.getItem(BASEMAP_STORAGE_KEY) === "true";
      } catch (error) {
        return false;
      }
    }

    function renderBaseMapControl() {
      if (!baseMapButton) return;
      baseMapButton.setAttribute("aria-pressed", String(baseMapEnabled));
      baseMapButton.title = baseMapEnabled ? "Turn map tiles off" : "Turn map tiles on";
      baseMapButton.setAttribute("aria-label", baseMapButton.title);
    }

    function readPersistedCloudOverlayEnabled() {
      try {
        return window.localStorage.getItem(CLOUD_OVERLAY_STORAGE_KEY) === "true";
      } catch (error) {
        return false;
      }
    }

    function visibleSatelliteIsUseful(date = new Date(), center = map.getCenter()) {
      const yearStart = Date.UTC(date.getUTCFullYear(), 0, 0);
      const dayOfYear = Math.floor((date.getTime() - yearStart) / 86400000);
      const declination = 23.44 * Math.PI / 180
        * Math.sin(2 * Math.PI * (284 + dayOfYear) / 365);
      const latitude = center.lat * Math.PI / 180;
      const utcHours = date.getUTCHours()
        + date.getUTCMinutes() / 60
        + date.getUTCSeconds() / 3600;
      const solarHours = (utcHours + center.lng / 15 + 24) % 24;
      const hourAngle = (solarHours - 12) * 15 * Math.PI / 180;
      const solarElevation = Math.asin(
        Math.sin(latitude) * Math.sin(declination)
          + Math.cos(latitude) * Math.cos(declination) * Math.cos(hourAngle)
      );
      return solarElevation > 5 * Math.PI / 180;
    }

    function desiredCloudOverlayLayerName() {
      return visibleSatelliteIsUseful()
        ? "goes_visible_imagery"
        : "goes_longwave_imagery";
    }

    function cloudOverlayDescription() {
      return cloudOverlayLayerName === "goes_visible_imagery"
        ? "visible satellite"
        : "infrared satellite";
    }

    function renderCloudOverlayControl() {
      if (!cloudOverlayButton) return;
      cloudOverlayButton.setAttribute("aria-pressed", String(cloudOverlayEnabled));
      cloudOverlayButton.title = cloudOverlayEnabled
        ? `Turn cloud overlay off (${cloudOverlayDescription()})`
        : "Show current cloud cover";
      cloudOverlayButton.setAttribute("aria-label", cloudOverlayButton.title);
    }

    function refreshCloudOverlay() {
      if (!cloudOverlayEnabled || !cloudOverlayLayer) return;
      const requestedLayer = desiredCloudOverlayLayerName();
      if (requestedLayer !== cloudOverlayLayerName) {
        cloudOverlayLayerName = requestedLayer;
        cloudOverlayLayer.setParams({ layers: cloudOverlayLayerName }, false);
      }
      cloudOverlayLayer.redraw();
      renderCloudOverlayControl();
    }

    function scheduleCloudOverlayRefresh() {
      window.clearInterval(cloudOverlayRefreshTimer);
      cloudOverlayRefreshTimer = null;
      if (!cloudOverlayEnabled) return;
      cloudOverlayRefreshTimer = window.setInterval(
        refreshCloudOverlay,
        CLOUD_REFRESH_INTERVAL_MS
      );
    }

    function setCloudOverlayEnabled(enabled, persist = true) {
      cloudOverlayEnabled = Boolean(enabled);
      if (cloudOverlayEnabled) {
        cloudOverlayLayerName = desiredCloudOverlayLayerName();
        if (!cloudOverlayLayer) {
          const ProcessedCloudWmsLayer = L.TileLayer.WMS.extend({
            createTile(coords, done) {
              const size = this.getTileSize();
              const canvas = document.createElement("canvas");
              const context = canvas.getContext("2d", { willReadFrequently: true });
              const image = new Image();
              canvas.width = size.x;
              canvas.height = size.y;
              image.crossOrigin = "anonymous";
              image.addEventListener("load", () => {
                try {
                  context.drawImage(image, 0, 0, size.x, size.y);
                  const pixels = context.getImageData(0, 0, size.x, size.y);
                  const data = pixels.data;
                  for (let offset = 0; offset < data.length; offset += 4) {
                    const sourceAlpha = data[offset + 3];
                    if (!sourceAlpha) continue;
                    const luminance =
                      0.2126 * data[offset]
                      + 0.7152 * data[offset + 1]
                      + 0.0722 * data[offset + 2];
                    const normalized = Math.max(
                      0,
                      Math.min(1, (luminance - 42) / 155)
                    );
                    const cloudOpacity = Math.pow(normalized, 0.9);
                    data[offset] = 255;
                    data[offset + 1] = 105;
                    data[offset + 2] = 215;
                    data[offset + 3] = Math.round(sourceAlpha * cloudOpacity);
                  }
                  context.putImageData(pixels, 0, 0);
                  done(null, canvas);
                } catch (error) {
                  done(error, canvas);
                }
              }, { once: true });
              image.addEventListener(
                "error",
                () => done(new Error("Could not load NOAA cloud tile"), canvas),
                { once: true }
              );
              image.src = this.getTileUrl(coords);
              return canvas;
            }
          });
          cloudOverlayLayer = new ProcessedCloudWmsLayer(CLOUD_WMS_URL, {
            layers: cloudOverlayLayerName,
            format: "image/png",
            transparent: true,
            version: "1.1.1",
            opacity: 0.95,
            pane: "cloudPane",
            maxNativeZoom: 10,
            maxZoom: 24,
            keepBuffer: 1,
            updateWhenIdle: true,
            attribution:
              'Satellite imagery: <a href="https://nowcoast.noaa.gov/" ' +
              'target="_blank" rel="noopener">NOAA nowCOAST</a>'
          });
        }
        if (!map.hasLayer(cloudOverlayLayer)) cloudOverlayLayer.addTo(map);
      } else if (cloudOverlayLayer && map.hasLayer(cloudOverlayLayer)) {
        map.removeLayer(cloudOverlayLayer);
      }
      if (persist) {
        try {
          window.localStorage.setItem(
            CLOUD_OVERLAY_STORAGE_KEY,
            String(cloudOverlayEnabled)
          );
        } catch (error) {
          // Storage may be unavailable.
        }
      }
      scheduleCloudOverlayRefresh();
      renderCloudOverlayControl();
    }

    function readPersistedRadarOverlayEnabled() {
      try {
        return window.localStorage.getItem(RADAR_OVERLAY_STORAGE_KEY) === "true";
      } catch (error) {
        return false;
      }
    }

    function loadScript(source) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.src = source;
        script.addEventListener("load", resolve, { once: true });
        script.addEventListener(
          "error",
          () => reject(new Error(`Could not load ${source}`)),
          { once: true }
        );
        document.head.append(script);
      });
    }

    function ensureMapLibreLoaded() {
      if (window.maplibregl && L.maplibreGL) return Promise.resolve();
      if (mapLibreLoadPromise) return mapLibreLoadPromise;
      const stylesheet = document.createElement("link");
      stylesheet.rel = "stylesheet";
      stylesheet.href = "vendor/maplibre-gl/maplibre-gl.css";
      const stylesheetLoaded = new Promise((resolve, reject) => {
        stylesheet.addEventListener("load", resolve, { once: true });
        stylesheet.addEventListener(
          "error",
          () => reject(new Error(`Could not load ${stylesheet.href}`)),
          { once: true }
        );
      });
      document.head.append(stylesheet);
      const scriptsLoaded = loadScript("vendor/maplibre-gl/maplibre-gl.js")
        .then(() => loadScript("vendor/maplibre-gl-leaflet/leaflet-maplibre-gl.js"));
      mapLibreLoadPromise = Promise.all([stylesheetLoaded, scriptsLoaded])
        .then(() => undefined);
      return mapLibreLoadPromise;
    }

        renderBaseMapControl();
        updateSurvivalCityLabels();
        try {
          if (!window.WebGL2RenderingContext) throw new Error("WebGL2 is unavailable");
          await ensureMapLibreLoaded();

          baseMapLayer = L.maplibreGL({
            style: "https://tiles.openfreemap.org/styles/liberty",

                'Data from <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
            }
          }).addTo(map);
        } catch (error) {
          baseMapLayer = null;

            window.localStorage.setItem(BASEMAP_STORAGE_KEY, "false");

    function ensureNavigationAudioContext() {
      if (!navigationAudioContext) {
        const AudioContextClass =
          window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) navigationAudioContext = new AudioContextClass();
      }
      navigationAudioContext?.resume().catch(() => {});
    }

    function playNavigationChime(kind) {
      if (!navigationAudioEnabled || !navigationAudioContext || document.hidden) return;
      navigationAudioContext.resume().then(() => {
        const now = navigationAudioContext.currentTime;
        const notes = kind === "imminent"
          ? [[880, 0], [1047, .11], [1319, .22]]
          : [[659, 0], [880, .17]];
        for (const [frequency, offset] of notes) {
          const oscillator = navigationAudioContext.createOscillator();
          const gain = navigationAudioContext.createGain();
          const start = now + offset;
          const duration = kind === "imminent" ? .15 : .24;
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(.0001, start);
          gain.gain.exponentialRampToValueAtTime(.14, start + .025);
          gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
          oscillator.connect(gain).connect(navigationAudioContext.destination);
          oscillator.start(start);
          oscillator.stop(start + duration + .02);
        }
      }).catch(() => {});
    }

    function navigationTurnClassification(changeDegrees) {
      const angle = Math.abs(changeDegrees);
      if (angle >= 110) return "sharp";
      if (angle <= 70) return "moderate";
      return "ordinary";
    }

    function navigationTurnPhrase(turn, kind) {
      const classification = navigationTurnClassification(turn.changeDegrees);
      const intensity = classification === "sharp"
        ? "Sharp "
        : classification === "moderate" ? "Moderate " : "";
      let instruction;
      const routeBookInstruction = String(turn.instruction || "")
        .replace(/\s+/g, " ")
        .replace(/[.!]+$/g, "");
      if (kind === "imminent") {
        instruction = routeBookInstruction || `Turn ${turn.direction}`;
        if (turn.followUp) {
          const followUpInstruction = String(turn.followUp.instruction || "")
            .replace(/\s+/g, " ")
            .replace(/[.!]+$/g, "")
            || `turn ${turn.followUp.direction}`;
          instruction += `, then ${followUpInstruction}`;
        }
      } else {
        const miles = turn.distanceMeters / 1609.344;
        const approximateDistance = miles >= .4
          ? "half mile"
          : miles >= .18 ? "quarter mile" : "soon";
        instruction = routeBookInstruction
          ? `${routeBookInstruction} in ${approximateDistance}`
          : `${intensity}${turn.direction} turn in ${approximateDistance}`;
      }
      if (!turn.routeQualifier) return instruction;
      return `For ${turn.routeQualifier}, ` +
        `${instruction.charAt(0).toLowerCase()}${instruction.slice(1)}`;
    }

    function renderNavigationTurnArrow(turn) {
      const classification = turn.direction === "straight"
        ? "straight"
        : navigationTurnClassification(turn.changeDegrees);
      if (navigationTurnArrowElement.dataset.classification === classification) {
        return;
      }
      navigationTurnArrowElement.dataset.classification = classification;
      const path = classification === "moderate"
        ? "M47 59V39q0-9-8-14L22 17"
        : classification === "sharp"
          ? "M47 59V32q0-14-13-14-9 0-14 9l-2 7"
          : classification === "straight"
            ? "M32 59V20"
          : "M47 59V32q0-14-14-14H21";
      navigationTurnArrowElement.innerHTML = `<svg viewBox="0 0 64 64"
          aria-hidden="true">
        <defs>
          <marker id="navigation-arrow-tip" viewBox="0 0 10 10"
                  refX="0" refY="5" markerWidth="19.5" markerHeight="19.5"
                  markerUnits="userSpaceOnUse"
                  orient="auto">
            <path d="M0 0 10 5 0 10Z" fill="currentColor"/>
          </marker>
        </defs>
        <path d="${path}" fill="none" stroke="currentColor" stroke-width="6.5"
              stroke-linecap="butt" stroke-linejoin="round"
              marker-end="url(#navigation-arrow-tip)"/>
      </svg>`;
    }

    function speakNavigationTurn(turn, kind) {
      if (!navigationAudioEnabled || document.hidden
        || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance =
        new SpeechSynthesisUtterance(navigationTurnPhrase(turn, kind));
      utterance.rate = .95;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function speakNavigationMessage(message) {
      if (!navigationAudioEnabled || document.hidden
        || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(message);
      utterance.rate = .95;
      utterance.pitch = 1;
      window.speechSynthesis.speak(utterance);
    }

    function announceNavigationTurn(turn, chimeKind) {
      playNavigationChime(chimeKind);
      window.setTimeout(() => {
        if (navigationEnabled && navigationAudioEnabled) {
          speakNavigationTurn(turn, chimeKind);
        }
      }, chimeKind === "imminent" ? 420 : 500);
    }

    function cancelPendingNavigationCue() {
      if (!navigationPendingCue) return;
      window.clearTimeout(navigationPendingCue.timer);
      navigationPendingCue = null;
    }

    function scheduleNavigationCue(turn, kind) {
      const cueKey = kind === "off-route"
        ? "off-route"
        : `${kind}:${turn.key}`;
      if (navigationPendingCue?.key === cueKey) return;
      cancelPendingNavigationCue();
      const timer = window.setTimeout(() => {
        navigationPendingCue = null;
        if (!navigationEnabled) return;
        const current = upcomingNavigationTurn();
        if (kind === "off-route") {
          if (!current?.offRoute || navigationOffRouteAnnounced
            || !navigationAudioEnabled) return;
          navigationOffRouteAnnounced = true;
          speakNavigationMessage("Off route");
          return;
        }
        if (!current || current.offRoute || current.key !== turn.key) return;
        const imminentMeters = 500 / 3.28084;
        if (kind === "imminent") {
          if (current.distanceMeters > imminentMeters
            || navigationImminentChimedKey === current.key) return;
          navigationHalfMileChimedKey = current.key;
          navigationImminentChimedKey = current.key;
          announceNavigationTurn(current, "imminent");
          if (current.followUp) {
            navigationHalfMileChimedKey = current.followUp.key;
          }
          return;
        }
        if (current.distanceMeters > .5 * 1609.344
          || current.distanceMeters <= imminentMeters
          || navigationHalfMileChimedKey === current.key) return;
        navigationHalfMileChimedKey = current.key;
        announceNavigationTurn(current, "half-mile");
      }, 2000);
      navigationPendingCue = { key: cueKey, timer };
    }

    function setNavigationAudioEnabled(enabled) {
      navigationAudioEnabled = Boolean(enabled);
      try {
        window.localStorage.setItem(
          NAVIGATION_AUDIO_STORAGE_KEY, String(navigationAudioEnabled)
        );
      } catch (error) {
        // Storage may be disabled.
      }
      if (navigationAudioEnabled && navigationEnabled) {
        ensureNavigationAudioContext();
      } else {
        window.speechSynthesis?.cancel();
      }
      renderNavigationControl();
      updateNavigationAssist();
    }

    function setNavigationEnabled(enabled) {
      navigationEnabled = Boolean(
        enabled && (clientPositionEnabled || followedSerial)
      );
      try {
        window.localStorage.setItem(
          NAVIGATION_STORAGE_KEY, String(navigationEnabled)
        );
      } catch (error) {
        // Storage may be disabled.
      }
      if (navigationEnabled && navigationAudioEnabled) ensureNavigationAudioContext();
      else {
        cancelPendingNavigationCue();
        navigationHalfMileChimedKey = null;
        navigationImminentChimedKey = null;
        navigationOffRouteAnnounced = false;
        window.speechSynthesis?.cancel();
      }
      renderNavigationControl();
      updateNavigationAssist();
    }

    function projectedNavigationDistances(tracker) {
      if (!projectionEnabled || clientPositionEnabled) return null;
      const projection = trackerProjections.get(tracker.serial);
      let targets = projection?.targets || [];
      if (exclusiveProjectionKey) {
        targets = targets.filter(target => target.key === exclusiveProjectionKey);
      }
      if (!targets.length) return null;
      const closest = { segment: null, loop: null, alternate: null };
      const applicable = { segment: false, loop: false, alternate: false };
      for (const target of targets) {
        const distances = routeDistancesAt(target.position, target.headingDegrees);
        if (!distances) continue;
        for (const kind of ["segment", "loop", "alternate"]) {
          if (!distances.applicable[kind] || !distances.closest[kind]) continue;
          const candidate = {
            ...distances.closest[kind],
            navigationHeadingDegrees: target.headingDegrees,
            navigationStopped: target.stopped
          };
          const current = closest[kind];
          if (!current
            || candidate.routeRemainingMeters < current.routeRemainingMeters) {
            closest[kind] = candidate;
          }
          applicable[kind] = true;
        }
      }
      return Object.values(closest).some(Boolean) ? { closest, applicable } : null;
    }

    function navigationLoopQualifier(trackName, kind) {
      const original = String(trackName || "").trim();
      const suffix = original
        .replace(/^(?:(?:alternate|alt)[\s_-]*)?loop[\s_-]*/i, "")
        || original;
      const spokenSuffix = suffix.replace(
        /[A-Z]{2,}/g,
        letters => [...letters].join(" ")
      );
      return `${kind === "alternate" ? "alternate loop" : "loop"} ${spokenSuffix}`;
    }

    function upcomingNavigationTurn() {
      const navigationTracker = clientPositionEnabled
        ? clientSummaryTracker
        : followedSerial ? trackers.get(followedSerial) : null;
      const distances = navigationTracker
        ? projectedNavigationDistances(navigationTracker)
          || navigationTracker.routeDistances
        : null;
      if (!distances) return null;
      // At an overlap, prefer a loop's instructions. Position and heading cannot
      // reveal intent while the geometries coincide, and selecting the segment
      // here would hide the maneuver needed to enter or remain on the loop.
      const kindPriority = { loop: 0, alternate: 1, segment: 2 };
      const matches = ["segment", "loop", "alternate"]
        .filter(kind => distances.applicable[kind] && distances.closest[kind])
        .map(kind => ({ ...distances.closest[kind], kind }))
        .filter(match => match.lineOfSightMeters <= ROUTE_MATCH_MARGIN_METERS)
        .sort((left, right) =>
          kindPriority[left.kind] - kindPriority[right.kind]
          || left.lineOfSightMeters - right.lineOfSightMeters
        );
      if (!matches.length) return { offRoute: true };
      for (const match of matches) {
        const currentProgressMeters =
          match.edge.progressFromStartMeters
          + match.fraction * match.edge.lengthMeters;
        const sourceCourse = Number.isFinite(match.navigationHeadingDegrees)
          ? match.navigationHeadingDegrees
          : Number(navigationTracker.course_deg);
        const sourceIsStopped = typeof match.navigationStopped === "boolean"
          ? match.navigationStopped
          : !trackerIsMoving(navigationTracker);
        const turn = match.track.navigationTurns?.find(candidate => {
          const aheadMeters = candidate.progressMeters - currentProgressMeters;
          if (aheadMeters <= 0) return false;
          if (!sourceIsStopped || aheadMeters > 200
            || !Number.isFinite(sourceCourse)) return true;
          const incomingDifference = headingDifference(
            sourceCourse, candidate.incomingHeadingDegrees
          );
          const outgoingDifference = headingDifference(
            sourceCourse, candidate.outgoingHeadingDegrees
          );
          // The smoothed turn point can land slightly past the physical
          // intersection. A stopped source whose retained course clearly
          // matches the outbound leg has already completed this turn.
          return outgoingDifference + 20 >= incomingDifference;
        });
        if (!turn) continue;
        const distanceMeters = turn.progressMeters - currentProgressMeters
          + match.lineOfSightMeters;
        const followingTurn = match.track.navigationTurns?.find(candidate =>
          candidate.progressMeters > turn.progressMeters
        );
        const followUpDistanceMeters = followingTurn
          ? followingTurn.progressMeters - turn.progressMeters
          : Infinity;
        return {
          ...turn,
          distanceMeters,
          key: `${match.track.name}:${Math.round(turn.progressMeters)}`,
          routeQualifier: matches.length > 1 && match.kind !== "segment"
            ? navigationLoopQualifier(match.track.name, match.kind)
            : null,
          followUp: followUpDistanceMeters <= .5 * 1609.344
            ? {
                ...followingTurn,
                distanceMeters: followUpDistanceMeters,
                key: `${match.track.name}:${Math.round(followingTurn.progressMeters)}`
              }
            : null
        };
      }
      return null;
    }

    function formatNavigationDistance(meters) {
      const miles = meters / 1609.344;
      if (miles >= .1) return `${miles.toFixed(1)} mi`;
      const feet = meters * 3.28084;
      return `${Math.max(50, Math.round(feet / 50) * 50)} ft`;
    }

    function updateNavigationAssist() {
      const turn = navigationEnabled ? upcomingNavigationTurn() : null;
      navigationAssistElement.hidden = !turn;
      navigationAssistElement.classList.toggle("off-route", Boolean(turn?.offRoute));
      if (!turn) {
        cancelPendingNavigationCue();
        navigationOffRouteAnnounced = false;
        return;
      }
      if (turn.offRoute) {
        navigationAssistElement.classList.remove("distant");
        navigationInstructionElement.textContent = "";
        navigationDistanceElement.textContent = "Off Route";
        if (!navigationOffRouteAnnounced && navigationAudioEnabled) {
          scheduleNavigationCue(turn, "off-route");
        } else {
          cancelPendingNavigationCue();
        }
        return;
      }
      navigationOffRouteAnnounced = false;
      navigationAssistElement.classList.toggle(
        "distant", turn.distanceMeters > 2 * 1609.344
      );
      navigationTurnArrowElement.classList.toggle(
        "right", turn.direction === "right"
      );
      renderNavigationTurnArrow(turn);
      navigationInstructionElement.textContent =
        turn.stepLabel
          ? `${turn.stepLabel} · ${turn.instruction}`
          : turn.instruction || "";
      navigationDistanceElement.textContent =
        formatNavigationDistance(turn.distanceMeters);
      const imminentMeters = 500 / 3.28084;
      if (turn.distanceMeters <= imminentMeters) {
        if (navigationImminentChimedKey !== turn.key) {
          scheduleNavigationCue(turn, "imminent");
        } else {
          cancelPendingNavigationCue();
        }
      } else if (
        turn.distanceMeters <= .5 * 1609.344
        && navigationHalfMileChimedKey !== turn.key
      ) {
        scheduleNavigationCue(turn, "half-mile");
      } else {
        cancelPendingNavigationCue();
      }
    }

    const HEADING_MATCH_MARGIN_METERS = ROUTE_MATCH_MARGIN_METERS;

    function routeGridCoordinate(value) {
      return Math.floor(value / ROUTE_GRID_DEGREES);
    }

    function routeGridKey(x, y) {
      return `${x},${y}`;
    }

    function indexTrack(track) {
      const index = routeSpatialIndexes[track.kind];
      for (const edge of track.edges) {
        edge.track = track;
        routeEdgesByKind[track.kind].push(edge);
        const minimumX = routeGridCoordinate(Math.min(edge.start[1], edge.end[1]));
        const maximumX = routeGridCoordinate(Math.max(edge.start[1], edge.end[1]));
        const minimumY = routeGridCoordinate(Math.min(edge.start[0], edge.end[0]));
        const maximumY = routeGridCoordinate(Math.max(edge.start[0], edge.end[0]));
        for (let x = minimumX; x <= maximumX; x += 1) {
          for (let y = minimumY; y <= maximumY; y += 1) {
            const key = routeGridKey(x, y);
            if (!index.has(key)) index.set(key, []);
            index.get(key).push(edge);
          }
        }
      }
    }

    function bearingDegrees(start, end) {
      const startLatitude = start.lat ?? start[0];
      const startLongitude = start.lng ?? start[1];
      const endLatitude = end.lat ?? end[0];
      const endLongitude = end.lng ?? end[1];
      const startRadians = startLatitude * Math.PI / 180;
      const endRadians = endLatitude * Math.PI / 180;
      const longitudeDelta = (endLongitude - startLongitude) * Math.PI / 180;
      const y = Math.sin(longitudeDelta) * Math.cos(endRadians);
      const x = Math.cos(startRadians) * Math.sin(endRadians)
        - Math.sin(startRadians) * Math.cos(endRadians) * Math.cos(longitudeDelta);
      return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
    }

    function headingDifference(left, right) {
      return Math.abs(((left - right + 540) % 360) - 180);
    }

    function trackKind(filename) {
      if (filename.startsWith("Seg")) return "segment";
      if (filename.replace(/\.gpx$/i, "").endsWith("X")) return "alternate";
      return "loop";
    }

    function parseGpx(xmlText, filename) {
      const documentNode = new DOMParser().parseFromString(xmlText, "application/xml");
      if (documentNode.querySelector("parsererror")) throw new Error(`Invalid GPX XML in ${filename}`);
      return [...documentNode.getElementsByTagNameNS("*", "trkseg")]
        .map(segment => [...segment.getElementsByTagNameNS("*", "trkpt")]
          .map(point => [Number(point.getAttribute("lat")), Number(point.getAttribute("lon"))])
          .filter(([latitude, longitude]) => Number.isFinite(latitude) && Number.isFinite(longitude)))
        .filter(segment => segment.length > 0);
    }

    function renderGpxTrack(filename, xmlText) {
      const segments = parseGpx(xmlText, filename);
      const kind = trackKind(filename);
      const name = filename.replace(/\.gpx$/i, "");
      const line = L.polyline(segments, {
        ...trackStyles[kind],
        pane: trackPanes[kind],
        renderer: trackRenderers[kind],
        smoothFactor: 1
      }).addTo(map);
      line.bindTooltip(name, { sticky: true });
      trackBounds.extend(line.getBounds());
      const track = precomputeTrackDistances(name, kind, segments);
      routeTracks.push(track);
      indexTrack(track);
    }

    function precomputeTrackDistances(name, kind, segments) {
      let remainingMeters = 0;
      const edges = [];
      const pointRemainingMeters = segments.map(segment => Array(segment.length).fill(0));
      for (let segmentIndex = segments.length - 1; segmentIndex >= 0; segmentIndex -= 1) {
        const points = segments[segmentIndex];
        if (points.length) pointRemainingMeters[segmentIndex][points.length - 1] = remainingMeters;
        for (let pointIndex = points.length - 2; pointIndex >= 0; pointIndex -= 1) {
          const start = points[pointIndex];
          const end = points[pointIndex + 1];
          const lengthMeters = map.distance(start, end);
          edges.push({
            start,
            end,
            lengthMeters,
            headingDegrees: bearingDegrees(start, end),
            remainingFromEndMeters: remainingMeters
          });
          remainingMeters += lengthMeters;
          pointRemainingMeters[segmentIndex][pointIndex] = remainingMeters;
        }
      }
      const forwardEdges = edges.slice().reverse();
      let progressFromStartMeters = 0;
      for (const edge of forwardEdges) {
        edge.progressFromStartMeters = progressFromStartMeters;
        progressFromStartMeters += edge.lengthMeters;
      }
      const track = {
        name,
        kind,
        segments,
        edges,
        forwardEdges,
        pointRemainingMeters,
        pointRouteRemainingMeters: null,
        totalMeters: remainingMeters,
        routeTailMeters: 0
      };
      track.navigationTurns = [];
      return track;
    }

    function positionAtTrackProgress(track, progressMeters) {
      const target = Math.max(0, Math.min(track.totalMeters, progressMeters));
      const edge = track.forwardEdges.find(candidate =>
        target <= candidate.progressFromStartMeters + candidate.lengthMeters
      ) || track.forwardEdges.at(-1);
      if (!edge) return null;
      const fraction = edge.lengthMeters > 0
        ? Math.max(0, Math.min(
            1,
            (target - edge.progressFromStartMeters) / edge.lengthMeters
          ))
        : 0;
      return L.latLng(
        edge.start[0] + fraction * (edge.end[0] - edge.start[0]),
        edge.start[1] + fraction * (edge.end[1] - edge.start[1])
      );
    }

    function signedHeadingChange(fromDegrees, toDegrees) {
      return ((toDegrees - fromDegrees + 540) % 360) - 180;
    }

    const ROUTE_BOOK_CODES = [
      "1A", "1B", "1C", "2D", "2E", "3F", "3G", "4H",
      "AL", "BL", "CL", "DL", "EL", "FL", "GL",
      "BX", "EX", "FX", "GX"
    ];

    function routeBookCodeForTrack(track) {
      const segment = track.name.match(/^Seg(?:ment)?[\s_-]*(\d+[A-Z])$/i);
      if (segment) return segment[1].toUpperCase();
      const loop = track.name.match(/^Loop[\s_-]*([A-Z])(X)?$/i);
      if (!loop) return null;
      return loop[2]
        ? `${loop[1].toUpperCase()}X`
        : `${loop[1].toUpperCase()}L`;
    }

    async function loadRouteBooks() {
      const entries = await Promise.all(ROUTE_BOOK_CODES.map(async code => {
        try {
          const response = await fetch(`./route-book/${code}.json`);
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const rows = await response.json();
          return [code, Array.isArray(rows) ? rows : []];
        } catch (error) {
          console.warn(`Could not load route book ${code}`, error);
          return [code, []];
        }
      }));
      return new Map(entries);
    }

    function routeBookStepProgress(track, row) {
      const latitude = Number(row.lat);
      const longitude = Number(row.lon);
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return null;
      const estimatedProgressMeters = Number(row.Trip) * 1609.344;
      const searchRadiusMeters = 5000;
      let edges = Number.isFinite(estimatedProgressMeters)
        ? track.forwardEdges.filter(edge =>
            edge.progressFromStartMeters + edge.lengthMeters
              >= estimatedProgressMeters - searchRadiusMeters
            && edge.progressFromStartMeters
              <= estimatedProgressMeters + searchRadiusMeters
          )
        : track.forwardEdges;
      if (!edges.length) edges = track.forwardEdges;
      const latitudeScale = Math.cos(latitude * Math.PI / 180);
      const centerX = longitude * latitudeScale;
      const findBest = candidates => {
        let best = null;
        for (const edge of candidates) {
          const projection = edgeProjection(
            centerX, latitude, latitudeScale, edge
          );
          if (!best || projection.distanceSquared < best.distanceSquared) {
            best = { edge, ...projection };
          }
        }
        return best;
      };
      let best = findBest(edges);
      if (
        best
        && Math.sqrt(best.distanceSquared) * 111320 > 500
        && edges !== track.forwardEdges
      ) {
        best = findBest(track.forwardEdges);
      }
      if (!best || Math.sqrt(best.distanceSquared) * 111320 > 1000) {
        return null;
      }
      return best.edge.progressFromStartMeters
        + best.fraction * best.edge.lengthMeters;
    }

    function routeBookDirection(instruction, changeDegrees) {
      const command = String(instruction || "");
      const left = command.search(
        /\b(?:turn|curve|bear|keep|exit|take|stay|use)[^.\n]{0,60}\bleft\b/i
      );
      const right = command.search(
        /\b(?:turn|curve|bear|keep|exit|take|stay|use)[^.\n]{0,60}\bright\b/i
      );
      if (left >= 0 && (right < 0 || left < right)) return "left";
      if (right >= 0) return "right";
      if (Math.abs(changeDegrees) < 25) return "straight";
      return changeDegrees < 0 ? "left" : "right";
    }

    function routeBookNavigationTurns(track, rows) {
      const headingWindowMeters = 60;
      return rows.flatMap(row => {
        const instruction = String(row["Major Turns/Instructions"] || "")
          .replace(/\s+/g, " ")
          .trim();
        if (!instruction) return [];
        const progressMeters = Number.isFinite(row.navigationProgressMeters)
          ? row.navigationProgressMeters
          : routeBookStepProgress(track, row);
        if (!Number.isFinite(progressMeters)) return [];
        const before = positionAtTrackProgress(
          track, progressMeters - headingWindowMeters
        );
        const junction = positionAtTrackProgress(track, progressMeters);
        const after = positionAtTrackProgress(
          track, progressMeters + headingWindowMeters
        );
        if (!before || !junction || !after) return [];
        const incomingHeadingDegrees = bearingDegrees(before, junction);
        const outgoingHeadingDegrees = bearingDegrees(junction, after);
        const changeDegrees = signedHeadingChange(
          incomingHeadingDegrees, outgoingHeadingDegrees
        );
        return [{
          progressMeters,
          remainingMeters: track.totalMeters - progressMeters,
          direction: routeBookDirection(instruction, changeDegrees),
          changeDegrees,
          incomingHeadingDegrees,
          outgoingHeadingDegrees,
          instruction,
          stepLabel: String(row.Step || "").trim()
        }];
      }).sort((left, right) => left.progressMeters - right.progressMeters);
    }

    function routeBookSpeedLimits(rows) {
      return rows.flatMap(row => {
        const speedLimitMph = Number.parseInt(String(row.Spd || ""), 10);
        if (!Number.isFinite(row.navigationProgressMeters)
          || !Number.isFinite(speedLimitMph)) return [];
        return [{
          progressMeters: row.navigationProgressMeters,
          speedLimitMph
        }];
      }).sort((left, right) => left.progressMeters - right.progressMeters);
    }

    function speedLimitAtTrackProgress(track, progressMeters) {
      const limits = track.navigationSpeedLimits || [];
      let active = null;
      for (const limit of limits) {
        if (limit.progressMeters > progressMeters) break;
        active = limit;
      }
      return active?.speedLimitMph ?? null;
    }

    function routeBookStepAtTrackProgress(track, progressMeters) {
      let active = null;
      for (const step of track.routeBookSteps || []) {
        if (step.progressMeters > progressMeters) break;
        active = step;
      }
      return active;
    }

    function attachRouteBookNavigation(routeBooks) {
      for (const track of routeTracks) {
        const code = routeBookCodeForTrack(track);
        const rows = code ? routeBooks.get(code) || [] : [];
        const mappedRows = rows.map(row => ({
          ...row,
          navigationProgressMeters: routeBookStepProgress(track, row)
        }));
        track.navigationTurns = routeBookNavigationTurns(track, mappedRows);
        track.navigationSpeedLimits = routeBookSpeedLimits(mappedRows);
        track.routeBookSteps = mappedRows
          .filter(row => Number.isFinite(row.navigationProgressMeters))
          .map(row => ({
            progressMeters: row.navigationProgressMeters,
            label: String(row.Step || "").trim()
          }))
          .filter(step => step.label)
          .sort((left, right) => left.progressMeters - right.progressMeters);
      }
    }

    function segmentIdentity(track) {
      const match = track.name.match(/^Seg(?:ment)?[\s_-]*0*(\d+)[\s_-]*([A-Z])(?:\b|[_-])/i);
      return match ? { stage: Number(match[1]), checkpoint: match[2].toUpperCase() } : null;
    }

    function segmentOrder(track) {
      const identity = segmentIdentity(track);
      return identity
        ? [identity.stage, identity.checkpoint]
        : [Number.MAX_SAFE_INTEGER, track.name];
    }

    function bindRouteMarkerInfo(marker, content, options = {}) {
      marker.bindTooltip(content, {
        direction: "top",
        opacity: 0.96,
        ...options
      });
      marker.on("click", event => {
        if (event.originalEvent) L.DomEvent.stopPropagation(event.originalEvent);
        if (activeRouteInfoMarker === marker && marker.isTooltipOpen()) {
          marker.closeTooltip();
          activeRouteInfoMarker = null;
          return;
        }
        if (activeRouteInfoMarker && activeRouteInfoMarker !== marker) {
          activeRouteInfoMarker.closeTooltip();
        }
        activeRouteInfoMarker = marker;
        marker.openTooltip();
      });
      marker.on("tooltipclose", () => {
        if (activeRouteInfoMarker === marker) activeRouteInfoMarker = null;
      });
      return marker;
    }

    function morphStableDom(current, fresh) {
      if (
        current.nodeType !== fresh.nodeType
        || (current.nodeType === Node.ELEMENT_NODE
          && current.tagName !== fresh.tagName)
      ) {
        current.replaceWith(fresh);
        return fresh;
      }
      if (current.nodeType === Node.TEXT_NODE) {
        if (current.data !== fresh.data) current.data = fresh.data;
        return current;
      }
      if (current.nodeType !== Node.ELEMENT_NODE) return current;
      for (const attribute of [...current.attributes]) {
        if (!fresh.hasAttribute(attribute.name)) current.removeAttribute(attribute.name);
      }
      for (const attribute of [...fresh.attributes]) {
        if (current.getAttribute(attribute.name) !== attribute.value) {
          current.setAttribute(attribute.name, attribute.value);
        }
      }
      if (
        current.classList.contains("checkpoint-eta-list")
        && fresh.classList.contains("checkpoint-eta-list")
      ) {
        reconcileKeyedChildren(
          current,
          [...fresh.children],
          element => element.dataset.trackerSerial || "empty"
        );
        return current;
      }
      const currentChildren = [...current.childNodes];
      const freshChildren = [...fresh.childNodes];
      const commonLength = Math.min(currentChildren.length, freshChildren.length);
      for (let index = 0; index < commonLength; index += 1) {
        morphStableDom(currentChildren[index], freshChildren[index]);
      }
      while (current.childNodes.length > freshChildren.length) {
        current.lastChild.remove();
      }
      for (let index = commonLength; index < freshChildren.length; index += 1) {
        current.append(freshChildren[index]);
      }
      return current;
    }

    function reconcileKeyedChildren(container, freshChildren, keyFor) {
      const existingByKey = new Map(
        [...container.children].map(child => [keyFor(child), child])
      );
      const desired = freshChildren.map(fresh => {
        const key = keyFor(fresh);
        const existing = existingByKey.get(key);
        if (!existing) return fresh;
        existingByKey.delete(key);
        return morphStableDom(existing, fresh);
      });
      for (const stale of existingByKey.values()) stale.remove();
      desired.forEach((node, index) => {
        const current = container.children[index];
        if (current !== node) container.insertBefore(node, current || null);
      });
    }

    function updateBoundPopup(marker, freshContent) {
      const popup = marker?.getPopup();
      const current = popup?.getContent();
      if (current instanceof Element) {
        morphStableDom(current, freshContent);
        popup.update();
      } else {
        marker?.setPopupContent(freshContent);
      }
    }

    function nearestCheckpointForTracker(tracker) {
      if (!validPosition(tracker) || !checkpointMarkers.length) return null;
      const position = L.latLng(tracker.latitude, tracker.longitude);
      let nearest = null;
      for (const checkpoint of checkpointMarkers) {
        const distanceMeters = map.distance(position, checkpoint.position);
        if (!nearest || distanceMeters < nearest.distanceMeters) {
          nearest = { checkpoint, distanceMeters };
        }
      }
      return nearest;
    }

    function compactDistanceLeft(meters) {
      if (!Number.isFinite(meters)) return "";
      const miles = meters / 1609.344;
      return `${miles < 10 ? miles.toFixed(1) : miles.toFixed(0)} mi left`;
    }

    function trackerRouteByName(tracker, trackName) {
      return Object.values(tracker.routeDistances?.closest || {})
        .find(route => route?.track.name === trackName) || null;
    }

    function checkpointDistanceSuffix(tracker, trackName) {
      const distance = compactDistanceLeft(
        trackerRouteByName(tracker, trackName)?.trackRemainingMeters
      );
      return distance ? ` · ${distance}` : "";
    }

    function solarCarStatus(tracker, now = Date.now() / 1000) {
      const knownStopped = trackerIsKnownStopped(tracker);
      if (!validPosition(tracker)) return knownStopped ? "Stopped" : "";
      const moving = trackerIsMoving(tracker);
      const stale = moving && Number.isFinite(tracker.sample_unix)
        && now - tracker.sample_unix > STALE_MOVING_TRACKER_AGE_SECONDS;
      const nearestCheckpoint = nearestCheckpointForTracker(tracker);
      let status = "";
      if (knownStopped && nearestCheckpoint?.distanceMeters <= ROUTE_MATCH_MARGIN_METERS) {
        status = `Stopped at ${nearestCheckpoint.checkpoint.label
          .replace(/\s*·\s*stage end$/i, "")}`;
      } else if (tracker.checkpointEta) {
        const checkpoint = checkpointMarkers.find(item =>
          item.track.name === tracker.checkpointEta.trackName
        );
        if (checkpoint && formatCheckpointEta(tracker, now)) {
          status = `Approaching ${checkpoint.label.replace(/\s*·\s*stage end$/i, "")}` +
            checkpointDistanceSuffix(tracker, checkpoint.track.name);
        }
      }
      if (!status && nearestCheckpoint?.distanceMeters <= ROUTE_MATCH_MARGIN_METERS) {
        status = `Near ${nearestCheckpoint.checkpoint.label
          .replace(/\s*·\s*stage end$/i, "")}`;
      }
      const distances = tracker.routeDistances;
      const matchedRoutes = ["segment", "loop", "alternate"]
        .filter(kind => distances?.applicable[kind]
          && distances.closest[kind]?.lineOfSightMeters <= ROUTE_MATCH_MARGIN_METERS)
        .map(kind => distances.closest[kind]);
      if (!status && matchedRoutes.length) {
        const descriptions = matchedRoutes.map(route => {
          const distance = compactDistanceLeft(route.trackRemainingMeters);
          return `${route.track.name}${distance ? ` (${distance})` : ""}`;
        });
        status = `${moving ? "Driving on" : knownStopped ? "Stopped on" : "On"}` +
          ` ${descriptions.join(" and ")}`;
      }
      if (!status && distances) {
        const nearestRoute = Object.values(distances.closest)
          .filter(Boolean)
          .sort((left, right) => left.lineOfSightMeters - right.lineOfSightMeters)[0];
        if (nearestRoute) {
          status = knownStopped
            ? `Stopped off course near ${nearestRoute.track.name}`
            : `Off course near ${nearestRoute.track.name}`;
        }
      }
      if (!status && knownStopped) status = "Stopped";
      if (stale && status) status = `Last known: ${status}`;
      return status;
    }

    function renderSolarSummary(now = Date.now() / 1000) {

          const leftDistance = left.distanceMeters;
          const rightDistance = right.distanceMeters;
          if (Number.isFinite(leftDistance) && Number.isFinite(rightDistance)) {
            const distanceOrder = leftDistance - rightDistance;
            if (distanceOrder) return distanceOrder;
            if (left.type !== right.type) {
              const typeOrder = { checkpoint: 0, pin: 1, car: 2 };
              return typeOrder[left.type] - typeOrder[right.type];

            const leftName = left.tracker?.name || left.checkpoint?.label
              || left.pin?.message || "";
            const rightName = right.tracker?.name || right.checkpoint?.label
              || right.pin?.message || "";
            return leftName.localeCompare(rightName, undefined, {
              numeric: true,
              sensitivity: "base"
            });
          }
          if (Number.isFinite(leftDistance)) return -1;
          if (Number.isFinite(rightDistance)) return 1;
          const leftName = left.tracker?.name || left.checkpoint?.label
            || left.pin?.message || "";
          const rightName = right.tracker?.name || right.checkpoint?.label

        row.append(

        return row;
      });
      if (!rows.length) {

        empty.className = "checkpoint-eta-empty";
        empty.textContent = "No race entries";
        empty.dataset.summaryKey = "empty";

      reconcileKeyedChildren(

    function mapClickStartedInOverlay(event) {
      const originalEvent = event.originalEvent;
      const eventPath = typeof originalEvent?.composedPath === "function"
        ? originalEvent.composedPath()
        : [originalEvent?.target];
      return eventPath.some(node =>
        node instanceof Element
        && node.matches(
          ".leaflet-popup, .leaflet-tooltip, .leaflet-control, " +
          ".leaflet-marker-icon, .tracker-circle-marker, .tracker-touch-target"
        )
      );

    map.on("click", event => {
      // Leaflet can retarget or even rebuild an overlay during a click. Use
      // the browser's frozen event path so interaction inside popup content
      // never masquerades as a click on the map background.
      if (mapClickStartedInOverlay(event)) return;
      if (activeRouteInfoMarker) {
        activeRouteInfoMarker.closeTooltip();
        activeRouteInfoMarker = null;
      }
      if (detailedSerial) {
        markers.get(detailedSerial)?.closePopup();
      }
    });

    function pointAlongTrack(track, targetMeters) {
      let traversedMeters = 0;
      for (const points of track.segments) {
        for (let index = 0; index < points.length - 1; index += 1) {
          const start = points[index];
          const end = points[index + 1];
          const lengthMeters = map.distance(start, end);
          if (traversedMeters + lengthMeters >= targetMeters) {
            const fraction = lengthMeters
              ? (targetMeters - traversedMeters) / lengthMeters
              : 0;
            return {
              position: [
                start[0] + (end[0] - start[0]) * fraction,
                start[1] + (end[1] - start[1]) * fraction
              ],
              headingDegrees: bearingDegrees(start, end)
            };
          }
          traversedMeters += lengthMeters;
        }
      }
      return null;
    }

    function randomPointOnTrack(track) {
      if (!track || track.totalMeters <= 0) return null;
      return pointAlongTrack(track, Math.random() * track.totalMeters);
    }

    function findRouteOverlap(requiredKinds, excludedKinds = [], avoidPositions = []) {
      const sourceKind = requiredKinds.includes("alternate")
        ? "alternate"
        : requiredKinds.includes("loop") ? "loop" : "segment";
      const edges = routeEdgesByKind[sourceKind];
      if (!edges.length) return null;
      const startIndex = Math.floor(Math.random() * edges.length);
      let relaxedCandidate = null;
      for (let offset = 0; offset < edges.length; offset += 1) {
        const edge = edges[(startIndex + offset) % edges.length];
        for (const fraction of [0.5, 0, 1]) {
          const position = [
            edge.start[0] + fraction * (edge.end[0] - edge.start[0]),
            edge.start[1] + fraction * (edge.end[1] - edge.start[1])
          ];
          if (avoidPositions.some(existing => map.distance(existing, position) < 500)) continue;
          const center = L.latLng(position);
          const distances = Object.fromEntries(
            [...new Set([...requiredKinds, ...excludedKinds])].map(kind => [
              kind,
              closestTrack(center, kind)?.lineOfSightMeters ?? Infinity
            ])
          );
          if (!requiredKinds.every(kind => distances[kind] <= ROUTE_MATCH_MARGIN_METERS)) continue;
          const candidate = { position, headingDegrees: edge.headingDegrees };
          if (excludedKinds.every(kind => distances[kind] > ROUTE_MATCH_MARGIN_METERS)) {
            return candidate;
          }
          relaxedCandidate ||= candidate;
        }
      }
      return relaxedCandidate;
    }

    function addDemoTrackers() {
      if (!DEMO_MODE || !routeTracks.length) return;
      const placements = [];
      const usedPositions = [];
      function addPlacement(point) {
        if (!point) return false;
        placements.push(point);
        usedPositions.push(point.position);
        return true;
      }
      function fallbackToKind(kind) {
        const candidates = routeTracks.filter(track => track.kind === kind && track.totalMeters > 0);
        return randomPointOnTrack(candidates[Math.floor(Math.random() * candidates.length)]);
      }

      addPlacement(
        findRouteOverlap(["segment", "loop", "alternate"], [], usedPositions)
        || fallbackToKind("alternate")
      );
      addPlacement(
        findRouteOverlap(["loop", "alternate"], ["segment"], usedPositions)
        || findRouteOverlap(["loop", "alternate"], [], usedPositions)
        || findRouteOverlap(["loop", "alternate"])
        || fallbackToKind("loop")
      );
      addPlacement(fallbackToKind("loop"));
      addPlacement(fallbackToKind("alternate"));

      const usableTracks = routeTracks.filter(track => track.totalMeters > 0);
      while (placements.length < 12 && usableTracks.length) {
        const track = usableTracks[Math.floor(Math.random() * usableTracks.length)];
        addPlacement(randomPointOnTrack(track));
      }

      const colors = [
        "#d7191c", "#f58220", "#f5c400", "#43a047", "#00a6a6", "#1976d2",
        "#5e35b1", "#8e44ad", "#ec407a", "#795548", "#455a64", "#111111"
      ];
      const now = Date.now() / 1000;
      placements.slice(0, 12).forEach((point, index) => {
        const serial = `demo-solar-${String(index + 1).padStart(2, "0")}`;
        const tracker = {
          serial,
          serial_hex: serial,
          name: `#Demo Solar ${String(index + 1).padStart(2, "0")}`,

          latitude: point.position[0],
          longitude: point.position[1],
          altitude_m: 250 + Math.random() * 900,
          speed_kph: 35 + Math.random() * 65,
          course_deg: point.headingDegrees,
          pdop: 0.8 + Math.random() * 1.2,
          satellites: 9 + Math.floor(Math.random() * 8),
          fix_mode: 3,
          sample_unix: now - Math.floor(Math.random() * 45),
          sample_time: new Date(now * 1000).toISOString(),
          color: colors[index],
          demo_tracker: true
        };
        updateTrackerRouteDistances(tracker);
        trackers.set(serial, tracker);
        updateMarker(tracker);
      });
      console.info(`Demo mode added ${Math.min(placements.length, 12)} fake solar trackers`);
    }

    function interleavedLoopArrows(loopTracks) {
      const plans = loopTracks
        .slice()
        .filter(track => track.totalMeters > 0)
        .sort((left, right) => left.name.localeCompare(right.name))
        .map(track => {
          const startDistanceMeters = Math.min(100, track.totalMeters * 0.1);
          const slots = [];
          for (
            let distance = startDistanceMeters;
            distance < track.totalMeters && slots.length < 500;
            distance += 2000
          ) {
            const offsets = slots.length
              ? [0, 170, -170, 340, -340, 510, -510, 680, -680]
              : [0, 100, 200, 300, 400];
            slots.push(offsets
              .map(offset => distance + offset)
              .filter(candidate => candidate > 0 && candidate < track.totalMeters));
          }
          return { track, slots, cursor: 0, selected: [] };
        });
      const selectedPoints = [];
      while (plans.some(plan => plan.cursor < plan.slots.length)) {
        for (const plan of plans) {
          if (plan.cursor >= plan.slots.length) continue;
          const candidates = plan.slots[plan.cursor++];
          for (const distanceMeters of candidates) {
            const point = pointAlongTrack(plan.track, distanceMeters);
            if (!point) continue;
            if (selectedPoints.some(selected =>
              map.distance(selected.position, point.position) < 100
            )) continue;
            plan.selected.push(point);
            selectedPoints.push(point);
            break;
          }
        }
      }
      return plans;
    }

    function renderLoopStartMarkers(loopTracks) {
      const starts = loopTracks
        .map(track => ({
          track,
          position: track.segments.find(points => points.length)?.[0]
        }))
        .filter(item => item.position)
        .sort((left, right) => left.track.name.localeCompare(right.track.name));
      const clusters = [];
      for (const item of starts) {
        const cluster = clusters.find(candidate =>
          candidate.items.some(existing =>
            map.distance(existing.position, item.position) <= ROUTE_MATCH_MARGIN_METERS
          )
        );
        if (cluster) cluster.items.push(item);
        else clusters.push({ items: [item] });
      }
      for (const cluster of clusters) {
        const position = [
          cluster.items.reduce((sum, item) => sum + item.position[0], 0) / cluster.items.length,
          cluster.items.reduce((sum, item) => sum + item.position[1], 0) / cluster.items.length
        ];
        const names = cluster.items.map(item => item.track.name);
        const details = document.createElement("div");
        const title = document.createElement("strong");
        title.textContent = names.length > 1 ? "Loop starts" : "Loop start";
        details.append(title);
        for (const name of names) {
          const line = document.createElement("div");
          line.textContent = name;
          details.append(line);
        }
        const marker = L.marker(position, {
          pane: "routeMarkerPane",
          icon: loopStartIcon(),
          keyboard: false,
          riseOnHover: true,
          bubblingMouseEvents: false
        });
        bindRouteMarkerInfo(marker, details, { offset: [0, -12] }).addTo(map);
      }
    }

    function renderRouteCourseMarkers() {
      const mainSegments = routeTracks
        .filter(track => track.kind === "segment" && segmentIdentity(track))
        .sort((left, right) => {
          const [leftStage, leftCheckpoint] = segmentOrder(left);
          const [rightStage, rightCheckpoint] = segmentOrder(right);
          return leftStage - rightStage || leftCheckpoint.localeCompare(rightCheckpoint);
        });
      const lastCheckpointByStage = new Map();
      for (const track of mainSegments) {
        const identity = segmentIdentity(track);
        const current = lastCheckpointByStage.get(identity.stage);
        if (!current || identity.checkpoint.localeCompare(segmentIdentity(current).checkpoint) > 0) {
          lastCheckpointByStage.set(identity.stage, track);
        }
      }
      const finishTrack = mainSegments.at(-1);
      for (const track of mainSegments) {
        const identity = segmentIdentity(track);
        const points = track.segments.at(-1);
        const endpoint = points?.at(-1);
        if (!endpoint) continue;
        const markerKind = track === finishTrack
          ? "finish"
          : lastCheckpointByStage.get(identity.stage) === track ? "stage" : "checkpoint";
        const label = markerKind === "finish"
          ? `Finish · Stage ${identity.stage}${identity.checkpoint}`
          : `Stage ${identity.stage}, checkpoint ${identity.checkpoint}`;
        const marker = L.marker(endpoint, {
          pane: "routeMarkerPane",
          icon: checkpointIcon(markerKind),
          keyboard: false,
          riseOnHover: true,
          bubblingMouseEvents: false
        });
        const checkpoint = {
          marker,
          track,
          label,
          markerKind,
          position: L.latLng(endpoint)
        };
        marker.bindPopup(() => checkpointPopupContent(checkpoint), {
          offset: [8, -25],
          autoPan: false,
          maxWidth: 380
        });
        checkpointMarkers.push(checkpoint);
        marker.addTo(map);
      }

      const loopTracks = routeTracks.filter(track => track.kind !== "segment");
      renderLoopStartMarkers(loopTracks);

      for (const { track, selected } of interleavedLoopArrows(loopTracks)) {
        for (const point of selected) {
          const marker = L.marker(point.position, {
            pane: "routeMarkerPane",
            icon: directionArrowIcon(point.headingDegrees, track.kind),
            interactive: false,
            keyboard: false
          });
          loopDirectionArrows.push({ position: L.latLng(point.position), marker });
        }
      }
      updateLoopDirectionArrowVisibility();
    }

    function finalizeRouteDistances() {
      const mainSegments = routeTracks
        .filter(track => track.kind === "segment")
        .sort((left, right) => {
          const [leftStage, leftCheckpoint] = segmentOrder(left);
          const [rightStage, rightCheckpoint] = segmentOrder(right);
          return leftStage - rightStage || leftCheckpoint.localeCompare(rightCheckpoint);
        });
      let remainingMainMeters = 0;
      for (let index = mainSegments.length - 1; index >= 0; index -= 1) {
        mainSegments[index].routeTailMeters = remainingMainMeters;
        remainingMainMeters += mainSegments[index].totalMeters;
      }
      for (const track of routeTracks) {
        if (track.kind !== "segment") {
          const checkpoint = track.name.match(/^Loop([A-Z])/i)?.[1]?.toUpperCase();
          const precedingSegment = mainSegments.find(segment =>
            segment.name.toUpperCase().endsWith(checkpoint || "\0")
          );
          track.routeTailMeters = precedingSegment?.routeTailMeters ?? 0;
        }
        track.pointRouteRemainingMeters = track.pointRemainingMeters.map(segment =>
          segment.map(distance => distance + track.routeTailMeters)
        );
      }
    }

    function edgeProjection(centerX, centerY, latitudeScale, edge) {
      const startX = edge.start[1] * latitudeScale;
      const startY = edge.start[0];
      const deltaX = (edge.end[1] - edge.start[1]) * latitudeScale;
      const deltaY = edge.end[0] - edge.start[0];
      const lengthSquared = deltaX * deltaX + deltaY * deltaY;
      const fraction = lengthSquared === 0 ? 0 : Math.max(0, Math.min(1,
        ((centerX - startX) * deltaX + (centerY - startY) * deltaY) / lengthSquared
      ));
      const distanceX = centerX - startX - fraction * deltaX;
      const distanceY = centerY - startY - fraction * deltaY;
      return { fraction, distanceSquared: distanceX * distanceX + distanceY * distanceY };
    }

    function edgeDistanceSquared(centerX, centerY, latitudeScale, edge) {
      const startX = edge.start[1] * latitudeScale;
      const startY = edge.start[0];
      const deltaX = (edge.end[1] - edge.start[1]) * latitudeScale;
      const deltaY = edge.end[0] - edge.start[0];
      const lengthSquared = deltaX * deltaX + deltaY * deltaY;
      const fraction = lengthSquared === 0 ? 0 : Math.max(0, Math.min(1,
        ((centerX - startX) * deltaX + (centerY - startY) * deltaY) / lengthSquared
      ));
      const distanceX = centerX - startX - fraction * deltaX;
      const distanceY = centerY - startY - fraction * deltaY;
      return distanceX * distanceX + distanceY * distanceY;
    }

    function spatialEdgesNear(center, kind) {
      const index = routeSpatialIndexes[kind];
      const centerCellX = routeGridCoordinate(center.lng);
      const centerCellY = routeGridCoordinate(center.lat);
      const latitudeScale = Math.cos(center.lat * Math.PI / 180);
      const centerX = center.lng * latitudeScale;
      const edges = new Set();
      let bestDistanceSquared = Infinity;
      for (let ring = 0; ring <= 24; ring += 1) {
        for (let x = centerCellX - ring; x <= centerCellX + ring; x += 1) {
          for (let y = centerCellY - ring; y <= centerCellY + ring; y += 1) {
            if (ring && x > centerCellX - ring && x < centerCellX + ring
              && y > centerCellY - ring && y < centerCellY + ring) continue;
            for (const edge of index.get(routeGridKey(x, y)) || []) {
              if (edges.has(edge)) continue;
              edges.add(edge);
              bestDistanceSquared = Math.min(bestDistanceSquared,
                edgeDistanceSquared(centerX, center.lat, latitudeScale, edge));
            }
          }
        }
        if (Number.isFinite(bestDistanceSquared)) {
          const west = (center.lng - (centerCellX - ring) * ROUTE_GRID_DEGREES) * latitudeScale;
          const east = ((centerCellX + ring + 1) * ROUTE_GRID_DEGREES - center.lng) * latitudeScale;
          const south = center.lat - (centerCellY - ring) * ROUTE_GRID_DEGREES;
          const north = (centerCellY + ring + 1) * ROUTE_GRID_DEGREES - center.lat;
          const boundaryMeters = Math.min(west, east, south, north) * 111320;
          if (boundaryMeters > Math.sqrt(bestDistanceSquared) * 111320
            + HEADING_MATCH_MARGIN_METERS) return [...edges];
        }
      }
      return routeEdgesByKind[kind];
    }

    function closestTrack(center, kind, headingDegrees = null) {
      const edges = spatialEdgesNear(center, kind);
      if (!edges.length) return null;
      const latitudeScale = Math.cos(center.lat * Math.PI / 180);
      const centerX = center.lng * latitudeScale;
      let nearestEdge = null;
      let nearestDistanceSquared = Infinity;
      for (const edge of edges) {
        const distanceSquared = edgeDistanceSquared(centerX, center.lat, latitudeScale, edge);
        if (distanceSquared < nearestDistanceSquared) {
          nearestEdge = edge;
          nearestDistanceSquared = distanceSquared;
        }
      }
      let bestEdge = nearestEdge;
      if (Number.isFinite(headingDegrees)) {
        const maximumDistanceMeters = Math.sqrt(nearestDistanceSquared) * 111320
          + HEADING_MATCH_MARGIN_METERS;
        let bestDirectionalEdge = null;
        let bestDirectionalDistanceSquared = Infinity;
        let bestDirectionalHeadingDifference = Infinity;
        for (const edge of edges) {
          if (edge.track !== nearestEdge.track) continue;
          const distanceSquared = edgeDistanceSquared(centerX, center.lat, latitudeScale, edge);
          if (Math.sqrt(distanceSquared) * 111320 > maximumDistanceMeters) continue;
          const difference = headingDifference(headingDegrees, edge.headingDegrees);
          if (difference > MAX_ROUTE_HEADING_DIFFERENCE_DEGREES) continue;
          if (
            distanceSquared < bestDirectionalDistanceSquared
            || (distanceSquared === bestDirectionalDistanceSquared
              && difference < bestDirectionalHeadingDifference)
          ) {
            bestDirectionalEdge = edge;
            bestDirectionalDistanceSquared = distanceSquared;
            bestDirectionalHeadingDifference = difference;
          }
        }
        // Heading disambiguates opposite-direction portions of a track, but
        // spatial proximity remains the primary match criterion. Previously,
        // a slightly better heading could select an edge up to 250 m farther
        // away and make route-book values oscillate.
        if (bestDirectionalEdge) bestEdge = bestDirectionalEdge;
      }
      const projection = edgeProjection(centerX, center.lat, latitudeScale, bestEdge);
      const latitude = bestEdge.start[0]
        + projection.fraction * (bestEdge.end[0] - bestEdge.start[0]);
      const longitude = bestEdge.start[1]
        + projection.fraction * (bestEdge.end[1] - bestEdge.start[1]);
      const lineOfSightMeters = map.distance(center, [latitude, longitude]);
      const trackRemainingMeters = (1 - projection.fraction) * bestEdge.lengthMeters
        + bestEdge.remainingFromEndMeters;
      return {
        track: bestEdge.track,
        edge: bestEdge,
        fraction: projection.fraction,
        position: L.latLng(latitude, longitude),
        trackHeadingDegrees: bestEdge.headingDegrees,
        lineOfSightMeters,
        trackRemainingMeters: trackRemainingMeters + lineOfSightMeters,
        routeRemainingMeters: trackRemainingMeters + bestEdge.track.routeTailMeters + lineOfSightMeters
      };
    }

    function measurementRouteMatchMeters(position) {
      const screenPoint = map.latLngToContainerPoint(position);
      const onePixelAway = map.containerPointToLatLng(
        screenPoint.add(L.point(1, 0))
      );
      const metersPerPixel = map.distance(position, onePixelAway);
      return Math.max(
        MEASUREMENT_ROUTE_MATCH_MIN_METERS,
        Math.min(
          MEASUREMENT_ROUTE_MATCH_MAX_METERS,
          metersPerPixel * MEASUREMENT_ROUTE_MATCH_PIXELS
        )
      );
    }

    function measurementTrackMatches(position) {
      const latitudeScale = Math.cos(position.lat * Math.PI / 180);
      const centerX = position.lng * latitudeScale;
      const matchDistanceMeters = measurementRouteMatchMeters(position);
      const matches = [];
      for (const kind of ["segment", "loop", "alternate"]) {
        const bestByTrack = new Map();
        for (const edge of spatialEdgesNear(position, kind)) {
          const projection = edgeProjection(centerX, position.lat, latitudeScale, edge);
          const distanceMeters = Math.sqrt(projection.distanceSquared) * 111320;
          const current = bestByTrack.get(edge.track);
          if (!current || distanceMeters < current.distanceMeters) {
            bestByTrack.set(edge.track, {
              track: edge.track,
              edge,
              fraction: projection.fraction,
              distanceMeters
            });
          }
        }
        for (const match of bestByTrack.values()) {
          if (match.distanceMeters > matchDistanceMeters) continue;
          match.position = L.latLng(
            match.edge.start[0] + match.fraction * (match.edge.end[0] - match.edge.start[0]),
            match.edge.start[1] + match.fraction * (match.edge.end[1] - match.edge.start[1])
          );
          match.trackRemainingMeters = (1 - match.fraction) * match.edge.lengthMeters
            + match.edge.remainingFromEndMeters;
          match.routeRemainingMeters = match.trackRemainingMeters + match.track.routeTailMeters;
          matches.push(match);
        }
      }
      return matches;
    }

    function positionAtTrackRemaining(track, remainingMeters) {
      const target = Math.max(0, Math.min(track.totalMeters, remainingMeters));
      for (const edge of track.forwardEdges) {
        const edgeStartRemaining = edge.remainingFromEndMeters + edge.lengthMeters;
        if (target > edgeStartRemaining || target < edge.remainingFromEndMeters) continue;
        const fraction = edge.lengthMeters > 0
          ? (edgeStartRemaining - target) / edge.lengthMeters
          : 0;
        return L.latLng(
          edge.start[0] + fraction * (edge.end[0] - edge.start[0]),
          edge.start[1] + fraction * (edge.end[1] - edge.start[1])
        );
      }
      const points = track.segments.flat();
      return L.latLng(target >= track.totalMeters ? points[0] : points.at(-1));
    }

    function pathAlongTrack(track, startRemainingMeters, endRemainingMeters) {
      if (startRemainingMeters < endRemainingMeters) {
        return pathAlongTrack(track, endRemainingMeters, startRemainingMeters).reverse();
      }
      const path = [positionAtTrackRemaining(track, startRemainingMeters)];
      for (const edge of track.forwardEdges) {
        const edgeStartRemaining = edge.remainingFromEndMeters + edge.lengthMeters;
        if (edge.remainingFromEndMeters >= startRemainingMeters) continue;
        if (edgeStartRemaining <= endRemainingMeters) break;
        if (edge.remainingFromEndMeters > endRemainingMeters) {
          path.push(L.latLng(edge.end));
        }
      }
      path.push(positionAtTrackRemaining(track, endRemainingMeters));
      return path.filter((point, index) =>
        index === 0 || map.distance(point, path[index - 1]) > 0.05
      );
    }

    function mainRoutePath(startRouteRemaining, endRouteRemaining) {
      if (startRouteRemaining < endRouteRemaining) {
        return mainRoutePath(endRouteRemaining, startRouteRemaining).reverse();
      }
      const path = [];
      const mainSegments = routeTracks
        .filter(track => track.kind === "segment")
        .sort((left, right) =>
          (right.routeTailMeters + right.totalMeters)
          - (left.routeTailMeters + left.totalMeters)
        );
      for (const track of mainSegments) {
        const trackStart = track.routeTailMeters + track.totalMeters;
        const trackEnd = track.routeTailMeters;
        const overlapStart = Math.min(startRouteRemaining, trackStart);
        const overlapEnd = Math.max(endRouteRemaining, trackEnd);
        if (overlapStart < overlapEnd) continue;
        const part = pathAlongTrack(
          track,
          overlapStart - track.routeTailMeters,
          overlapEnd - track.routeTailMeters
        );
        if (path.length && part.length && map.distance(path.at(-1), part[0]) < 1) part.shift();
        path.push(...part);
      }
      return path;
    }

    function measurementRoutePath(start, end, startMatch, endMatch) {
      let routePath = [];
      if (startMatch.track.kind === "segment" && endMatch.track.kind === "segment") {
        routePath = mainRoutePath(
          startMatch.routeRemainingMeters,
          endMatch.routeRemainingMeters
        );
      } else if (startMatch.track === endMatch.track) {
        routePath = pathAlongTrack(
          startMatch.track,
          startMatch.trackRemainingMeters,
          endMatch.trackRemainingMeters
        );
      } else {
        routePath = pathAlongTrack(startMatch.track, startMatch.trackRemainingMeters, 0);
        const mainPart = mainRoutePath(
          startMatch.track.routeTailMeters,
          endMatch.routeRemainingMeters
        );
        if (routePath.length && mainPart.length
          && map.distance(routePath.at(-1), mainPart[0]) < 1) mainPart.shift();
        routePath.push(...mainPart);
      }
      return [start, startMatch.position, ...routePath, endMatch.position, end]
        .filter((point, index, points) =>
          index === 0 || map.distance(point, points[index - 1]) > 0.05
        );
    }

    function measurementDistance(start, end) {
      const directMeters = map.distance(start, end);
      const startMatches = measurementTrackMatches(start);
      const endMatches = measurementTrackMatches(end);
      let bestRouteMeters = Infinity;
      let bestPair = null;
      for (const startMatch of startMatches) {
        for (const endMatch of endMatches) {
          let alongMeters = Infinity;
          if (startMatch.track.kind === "segment" && endMatch.track.kind === "segment") {
            alongMeters = Math.abs(
              startMatch.routeRemainingMeters - endMatch.routeRemainingMeters
            );
          } else if (startMatch.track.kind !== "segment") {
            if (startMatch.track === endMatch.track) {
              alongMeters = Math.abs(
                startMatch.trackRemainingMeters - endMatch.trackRemainingMeters
              );
            } else if (
              endMatch.track.kind === "segment"
              && endMatch.routeRemainingMeters <= startMatch.track.routeTailMeters
            ) {
              alongMeters = startMatch.trackRemainingMeters
                + startMatch.track.routeTailMeters
                - endMatch.routeRemainingMeters;
            }
          }
          if (Number.isFinite(alongMeters)) {
            const routeMeters = alongMeters
              + startMatch.distanceMeters + endMatch.distanceMeters;
            if (routeMeters < bestRouteMeters) {
              bestRouteMeters = routeMeters;
              bestPair = { startMatch, endMatch };
            }
          }
        }
      }
      return Number.isFinite(bestRouteMeters)
        ? {
            meters: bestRouteMeters,
            followsRoute: true,
            path: measurementRoutePath(
              start,
              end,
              bestPair.startMatch,
              bestPair.endMatch
            )
          }
        : { meters: directMeters, followsRoute: false, path: [start, end] };
    }

    function niceGraduationMeters(targetMeters) {
      if (!(targetMeters > 0)) return 1;
      const magnitude = 10 ** Math.floor(Math.log10(targetMeters));
      const normalized = targetMeters / magnitude;
      const step = normalized <= 1 ? 1 : normalized <= 2 ? 2 : normalized <= 5 ? 5 : 10;
      return step * magnitude;
    }

    function formatMeasurementDistance(meters) {
      const feet = meters * 3.28084;
      const miles = meters / 1609.344;
      if (miles >= 0.1) return `${miles < 10 ? miles.toFixed(2) : miles.toFixed(1)} mi`;
      return `${Math.round(feet)} ft`;
    }

    const measurementLayers = L.layerGroup();
    let measurementGesture = null;
    let suppressMeasurementClickUntil = 0;

    function clearMeasurement() {
      if (!measurementGesture) return;
      window.clearTimeout(measurementGesture.holdTimer);
      if (measurementGesture.active) {
        measurementLayers.clearLayers();
        map.removeLayer(measurementLayers);
        if (measurementGesture.mapDraggingWasEnabled) map.dragging.enable();
      }
      measurementGesture = null;
    }

    function renderMeasurement(end) {
      if (!measurementGesture?.active) return;
      const start = measurementGesture.start;
      const measurement = measurementDistance(start, end);
      const path = measurement.path;
      const screenPoints = path.map(point => map.latLngToContainerPoint(point));
      const pathSections = [];
      let pathMeters = 0;
      let pixelLength = 0;
      for (let index = 1; index < path.length; index += 1) {
        const meters = map.distance(path[index - 1], path[index]);
        const pixels = screenPoints[index - 1].distanceTo(screenPoints[index]);
        if (!(meters > 0) || !(pixels > 0)) continue;
        pathSections.push({
          start: screenPoints[index - 1],
          end: screenPoints[index],
          meters,
          startMeters: pathMeters
        });
        pathMeters += meters;
        pixelLength += pixels;
      }
      const pointAndNormalAtMeters = targetMeters => {
        const section = pathSections.find(candidate =>
          targetMeters <= candidate.startMeters + candidate.meters
        ) || pathSections.at(-1);
        if (!section) return null;
        const fraction = Math.max(0, Math.min(1,
          (targetMeters - section.startMeters) / section.meters
        ));
        const dx = section.end.x - section.start.x;
        const dy = section.end.y - section.start.y;
        const length = Math.hypot(dx, dy) || 1;
        return {
          point: L.point(section.start.x + dx * fraction, section.start.y + dy * fraction),
          normalX: -dy / length,
          normalY: dx / length
        };
      };
      measurementLayers.clearLayers();
      L.polyline(path, {
        pane: "measurementPane",
        color: "#202938",
        weight: 7,
        opacity: 0.78,
        interactive: false
      }).addTo(measurementLayers);
      L.polyline(path, {
        pane: "measurementPane",
        color: "#ffd84d",
        weight: 4,
        opacity: 1,
        interactive: false
      }).addTo(measurementLayers);

      if (pixelLength >= 12 && pathMeters > 0) {
        const intervalMeters = niceGraduationMeters(measurement.meters * 42 / pixelLength);
        const graduationCount = Math.min(60, Math.floor(pathMeters / intervalMeters));
        for (let index = 1; index < graduationCount; index += 1) {
          const graduation = pointAndNormalAtMeters(index * intervalMeters);
          if (!graduation) continue;
          const { point: center, normalX, normalY } = graduation;
          const halfLength = index % 5 === 0 ? 7 : 4;
          L.polyline([
            map.containerPointToLatLng(L.point(
              center.x - normalX * halfLength,
              center.y - normalY * halfLength
            )),
            map.containerPointToLatLng(L.point(
              center.x + normalX * halfLength,
              center.y + normalY * halfLength
            ))
          ], {
            pane: "measurementPane",
            color: "#202938",
            weight: 2,
            opacity: 0.9,
            interactive: false
          }).addTo(measurementLayers);
        }
      }

      const midpointOnPath = pointAndNormalAtMeters(pathMeters / 2);
      const midpoint = midpointOnPath
        ? map.containerPointToLatLng(midpointOnPath.point)
        : start;
      L.marker(midpoint, {
        pane: "measurementPane",
        interactive: false,
        icon: L.divIcon({
          className: "",
          html: `<div class="measurement-label">${formatMeasurementDistance(measurement.meters)}</div>`,
          iconSize: [100, 24],
          iconAnchor: [50, 12]
        })
      }).addTo(measurementLayers);
    }

    function installMeasurementGesture() {
      const container = map.getContainer();
      const eventPoint = event => map.mouseEventToContainerPoint(event);
      const eventLatLng = event => map.containerPointToLatLng(eventPoint(event));
      const isMapBackground = target =>
        !target.closest(
          ".leaflet-control, .leaflet-marker-icon, .tracker-circle-marker, .leaflet-popup"
        );

      container.addEventListener("pointerdown", event => {
        if (!event.isPrimary || event.button !== 0 || !isMapBackground(event.target)) return;
        if (measurementGesture) clearMeasurement();
        const downPoint = eventPoint(event);
        measurementGesture = {
          pointerId: event.pointerId,
          downPoint,
          start: eventLatLng(event),
          active: false,
          mapDraggingWasEnabled: map.dragging.enabled(),
          holdTimer: window.setTimeout(() => {
            if (!measurementGesture || measurementGesture.pointerId !== event.pointerId) return;
            measurementGesture.active = true;
            map.dragging.disable();
            measurementLayers.addTo(map);
            renderMeasurement(measurementGesture.start);
            if (container.setPointerCapture) {
              try { container.setPointerCapture(event.pointerId); } catch (error) {}
            }
          }, 550)
        };
      }, true);

      container.addEventListener("pointermove", event => {
        if (!measurementGesture || event.pointerId !== measurementGesture.pointerId) return;
        if (!measurementGesture.active) {
          if (eventPoint(event).distanceTo(measurementGesture.downPoint) > 10) clearMeasurement();
          return;
        }
        event.preventDefault();
        event.stopImmediatePropagation();
        renderMeasurement(eventLatLng(event));
      }, true);

      const finish = event => {
        if (!measurementGesture || event.pointerId !== measurementGesture.pointerId) return;
        if (measurementGesture.active) {
          suppressMeasurementClickUntil = Date.now() + 500;
          event.preventDefault();
          event.stopImmediatePropagation();
        }
        clearMeasurement();
      };
      container.addEventListener("pointerup", finish, true);
      container.addEventListener("pointercancel", finish, true);
      container.addEventListener("contextmenu", event => {
        if (measurementGesture) event.preventDefault();
      }, true);
      container.addEventListener("click", event => {
        if (Date.now() < suppressMeasurementClickUntil) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    }

    installMeasurementGesture();

    function projectionMatchesAt(position, headingDegrees) {
      const latitudeScale = Math.cos(position.lat * Math.PI / 180);
      const centerX = position.lng * latitudeScale;
      const matches = [];
      for (const kind of ["segment", "loop", "alternate"]) {
        const bestByTrack = new Map();
        for (const edge of spatialEdgesNear(position, kind)) {
          if (Number.isFinite(headingDegrees)
            && headingDifference(headingDegrees, edge.headingDegrees)
              > MAX_ROUTE_HEADING_DIFFERENCE_DEGREES) continue;
          const projection = edgeProjection(centerX, position.lat, latitudeScale, edge);
          const distanceMeters = Math.sqrt(projection.distanceSquared) * 111320;
          const current = bestByTrack.get(edge.track);
          if (!current || distanceMeters < current.distanceMeters) {
            bestByTrack.set(edge.track, { edge, fraction: projection.fraction, distanceMeters });
          }
        }
        for (const match of bestByTrack.values()) {
          if (match.distanceMeters > PROJECTION_MATCH_MARGIN_METERS) continue;
          const { edge, fraction } = match;
          match.position = L.latLng(
            edge.start[0] + fraction * (edge.end[0] - edge.start[0]),
            edge.start[1] + fraction * (edge.end[1] - edge.start[1])
          );
          matches.push(match);
        }
      }
      return matches;
    }

    function lookAheadHeadingChange(edges, edgeIndex, lookAheadMeters = 350) {
      const edge = edges[edgeIndex];
      if (lookAheadMeters === 350 && Number.isFinite(edge?.lookAheadHeadingChange350)) {
        return edge.lookAheadHeadingChange350;
      }
      const initialHeading = edge?.headingDegrees;
      if (!Number.isFinite(initialHeading)) return 0;
      let distanceMeters = 0;
      let maximumChange = 0;
      for (let index = edgeIndex + 1; index < edges.length; index += 1) {
        distanceMeters += edges[index - 1].lengthMeters;
        maximumChange = Math.max(
          maximumChange,
          headingDifference(initialHeading, edges[index].headingDegrees)
        );
        if (distanceMeters >= lookAheadMeters) break;
      }
      if (lookAheadMeters === 350) edge.lookAheadHeadingChange350 = maximumChange;
      return maximumChange;
    }

    function turnTravelProfile(edges, edgeIndex, baseSpeedMps) {
      const edge = edges[edgeIndex];
      const nextEdge = edges[edgeIndex + 1];
      if (!nextEdge) return { approachMeters: 0, approachSpeedMps: baseSpeedMps, dwellSeconds: 0 };
      const turn = headingDifference(edge.headingDegrees, nextEdge.headingDegrees);
      const immediateSeverity = Math.min(1, Math.max(0, (turn - 8) / 82));
      const sustainedHeadingChange = lookAheadHeadingChange(edges, edgeIndex);
      // Replay against one-second race telemetry showed that cars retain most
      // of their reported speed through ordinary curves. Keep hard turns
      // meaningful without allowing dense GPX geometry to over-brake them.
      const curveSeverity = 0.5 * Math.min(
        1,
        Math.max(0, (sustainedHeadingChange - 12) / 78)
      );
      const severity = Math.max(immediateSeverity, curveSeverity);
      return {
        approachMeters: Math.min(edge.lengthMeters, 25 + 125 * severity),
        approachSpeedMps: baseSpeedMps * (1 - 0.65 * severity),
        dwellSeconds: turn >= 75 ? Math.min(6, 1 + (turn - 75) * 0.1) : 0
      };
    }

    function edgeTravelSections(edges, edgeIndex, fraction, baseSpeedMps) {
      const edge = edges[edgeIndex];
      const available = Math.max(0, (1 - fraction) * edge.lengthMeters);
      const profile = turnTravelProfile(edges, edgeIndex, baseSpeedMps);
      const approachAvailable = Math.min(available, profile.approachMeters);
      return [
        { meters: available - approachAvailable, speedMps: baseSpeedMps },
        { meters: approachAvailable, speedMps: Math.max(0.2, profile.approachSpeedMps) }
      ].filter(section => section.meters > 0);
    }

    function trackTravelSeconds(match, baseSpeedMps) {
      if (!(baseSpeedMps > 0)) return Infinity;
      const edges = match.edge.track.forwardEdges;
      let edgeIndex = edges.indexOf(match.edge);
      if (edgeIndex < 0) return Infinity;
      let seconds = 0;
      for (; edgeIndex < edges.length; edgeIndex += 1) {
        const fraction = edgeIndex === edges.indexOf(match.edge) ? match.fraction : 0;
        for (const section of edgeTravelSections(edges, edgeIndex, fraction, baseSpeedMps)) {
          seconds += section.meters / section.speedMps;
        }
        seconds += turnTravelProfile(edges, edgeIndex, baseSpeedMps).dwellSeconds;
      }
      return seconds;
    }

    function advanceProjection(match, elapsedSeconds, baseSpeedMps, originalPosition) {
      const edges = match.edge.track.forwardEdges;
      let edgeIndex = edges.indexOf(match.edge);
      if (edgeIndex < 0) return null;
      const lineOfSightMeters = Number.isFinite(match.distanceMeters)
        ? match.distanceMeters
        : map.distance(originalPosition, match.position);
      let edge = match.edge;
      let fraction = match.fraction;
      let remainingSeconds = Math.max(0, elapsedSeconds);
      const approachRouteRemainingMeters =
        (1 - fraction) * edge.lengthMeters
        + edge.remainingFromEndMeters
        + edge.track.routeTailMeters;
      if (lineOfSightMeters > 0 && baseSpeedMps > 0) {
        const approachSeconds = lineOfSightMeters / baseSpeedMps;
        if (remainingSeconds < approachSeconds) {
          const approachFraction = remainingSeconds / approachSeconds;
          const position = L.latLng(
            originalPosition.lat
              + approachFraction * (match.position.lat - originalPosition.lat),
            originalPosition.lng
              + approachFraction * (match.position.lng - originalPosition.lng)
          );
          return {
            position,
            headingDegrees: bearingDegrees(originalPosition, match.position),
            stopped: false,
            path: [originalPosition, position],
            track: edge.track,
            routeRemainingMeters:
              (1 - approachFraction) * lineOfSightMeters
              + approachRouteRemainingMeters
          };
        }
        remainingSeconds -= approachSeconds;
      }
      const path = [originalPosition, match.position];
      while (true) {
        for (const section of edgeTravelSections(edges, edgeIndex, fraction, baseSpeedMps)) {
          const sectionSeconds = section.meters / section.speedMps;
          if (remainingSeconds < sectionSeconds) {
            const traveled = remainingSeconds * section.speedMps;
            const projectedFraction = fraction
              + (edge.lengthMeters > 0 ? traveled / edge.lengthMeters : 0);
            const position = L.latLng(
              edge.start[0] + projectedFraction * (edge.end[0] - edge.start[0]),
              edge.start[1] + projectedFraction * (edge.end[1] - edge.start[1])
            );
            path.push(position);
            return {
              position,
              headingDegrees: edge.headingDegrees,
              stopped: section.speedMps < 0.5,
              path,
              track: edge.track,
              routeRemainingMeters:
                (1 - projectedFraction) * edge.lengthMeters
                + edge.remainingFromEndMeters
                + edge.track.routeTailMeters
            };
          }
          remainingSeconds -= sectionSeconds;
          fraction += edge.lengthMeters > 0 ? section.meters / edge.lengthMeters : 0;
        }
        path.push(L.latLng(edge.end));
        const dwellSeconds = turnTravelProfile(edges, edgeIndex, baseSpeedMps).dwellSeconds;
        if (remainingSeconds < dwellSeconds) {
          return {
            position: L.latLng(edge.end),
            headingDegrees: edge.headingDegrees,
            stopped: true,
            path,
            track: edge.track,
            routeRemainingMeters:
              edge.remainingFromEndMeters + edge.track.routeTailMeters
          };
        }
        remainingSeconds -= dwellSeconds;
        edgeIndex += 1;
        if (edgeIndex >= edges.length) {
          return {
            position: L.latLng(edge.end),
            headingDegrees: edge.headingDegrees,
            stopped: true,
            path,
            track: edge.track,
            routeRemainingMeters: edge.track.routeTailMeters
          };
        }
        edge = edges[edgeIndex];
        fraction = 0;
        if (!path.at(-1).equals(L.latLng(edge.start))) path.push(L.latLng(edge.start));
      }
    }

    function mergeProjectionResults(results) {
      const groups = [];
      for (const result of results) {
        let group = groups.find(candidate =>
          map.distance(candidate.position, result.position) <= PROJECTION_MERGE_DISTANCE_METERS
          && ((candidate.stopped && result.stopped)
            || headingDifference(candidate.headingDegrees, result.headingDegrees)
              <= PROJECTION_MERGE_HEADING_DEGREES)
        );
        if (!group) {
          group = {
            position: result.position,
            headingDegrees: result.headingDegrees,
            stopped: result.stopped,
            results: []
          };
          groups.push(group);
        }
        group.results.push(result);
        group.position = L.latLng(
          group.results.reduce((sum, item) => sum + item.position.lat, 0) / group.results.length,
          group.results.reduce((sum, item) => sum + item.position.lng, 0) / group.results.length
        );
        group.stopped = group.results.every(item => item.stopped);
      }
      return groups;
    }

    function projectedTrackerIcon(tracker, projection, isFollowTarget) {
      const color = trackerMarkerColor(tracker);
      const size = isFollowTarget ? 39 : 26;
      const staffClass = isStaffTracker(tracker) ? " staff-tracker-projection" : "";
      if (projection.stopped) {
        return L.divIcon({
          className: "tracker-projection-icon",
          iconSize: [size, size],
          iconAnchor: [size / 2, size / 2],
          html: `<svg class="${staffClass}" style="color:${color}" viewBox="0 0 26 26" width="${size}" height="${size}" aria-hidden="true">
            <circle cx="13" cy="13" r="8" fill="${color}" stroke="white" stroke-width="2"/>
          </svg>`
        });
      }
      return L.divIcon({
        className: "tracker-arrow-icon tracker-projection-icon",
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        html: `<div class="tracker-arrow${staffClass}" style="--course:${projection.headingDegrees}deg;color:${color};width:${size}px;height:${size}px">
          <svg viewBox="0 0 26 26" width="${size}" height="${size}" aria-hidden="true">
            <path d="M13 1 L23 23 L13 18 L3 23 Z" fill="currentColor" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>`
      });
    }

    function removeTrackerProjection(serial, updateOriginal = true) {
      const projection = trackerProjections.get(serial);
      if (!projection) return;
      for (const marker of projection.markers) map.removeLayer(marker);
      for (const line of projection.lines) map.removeLayer(line);
      for (const circle of projection.uncertaintyCircles || []) map.removeLayer(circle);
      trackerProjections.delete(serial);
      if (updateOriginal && trackers.has(serial)) updateMarker(trackers.get(serial));
      scheduleTeamBadgeLayout();
    }

    function removeProjectionGroup(groupState) {
      map.removeLayer(groupState.marker);
      map.removeLayer(groupState.uncertaintyCircle);
      for (const line of groupState.lines.values()) map.removeLayer(line);
    }

    function setProjectionTooltipsVisible(serial, visible) {
      for (const marker of trackerProjections.get(serial)?.markers || []) {
        if (visible && !marker.isTooltipOpen()) marker.openTooltip();
        else if (!visible && marker.isTooltipOpen()) marker.closeTooltip();
      }
    }

    const pendingDetailVisibilitySyncs = new Set();
    let detailVisibilitySyncFrame = null;

    function scheduleDetailVisibilitySync(serial) {
      if (serial) pendingDetailVisibilitySyncs.add(serial);
      if (detailVisibilitySyncFrame !== null) return;
      detailVisibilitySyncFrame = window.requestAnimationFrame(() => {
        detailVisibilitySyncFrame = null;
        for (const pendingSerial of pendingDetailVisibilitySyncs) {
          const detailIsOpen =
            detailedSerial === pendingSerial
            && markers.get(pendingSerial)?.isPopupOpen() === true;
          setProjectionTooltipsVisible(pendingSerial, detailIsOpen);
        }
        pendingDetailVisibilitySyncs.clear();
      });
    }

    function toggleTrackerDetail(serial) {
      const marker = markers.get(serial);
      if (!marker) return;
      if (marker.isPopupOpen()) marker.closePopup();
      else marker.openPopup();
      scheduleDetailVisibilitySync(serial);
    }

    function projectionViewRadiusMeters() {
      const center = map.getCenter();
      const bounds = map.getBounds();
      return Math.max(
        map.distance(center, bounds.getNorthWest()),
        map.distance(center, bounds.getNorthEast()),
        map.distance(center, bounds.getSouthWest()),
        map.distance(center, bounds.getSouthEast())
      );
    }

    function trackerCouldProjectIntoView(tracker, ageSeconds, viewRadiusMeters) {
      const forwardMeters = tracker.speed_kph / 3.6 * ageSeconds;
      return map.distance(map.getCenter(), [tracker.latitude, tracker.longitude])
        <= viewRadiusMeters + forwardMeters + PROJECTION_MATCH_MARGIN_METERS;
    }

    function persistTrackerFollowExclusivity() {
      if (!followedSerial) return;
      persistFollowTarget({
        type: "tracker",
        serial: followedSerial,
        ...(exclusiveProjectionKey ? { exclusiveProjectionKey } : {})
      });
    }

    function toggleProjectionExclusivity(tracker, trackKey, position) {
      if (followedSerial !== tracker.serial) {
        setFollowedTracker(
          tracker.serial,
          false,
          !map.getBounds().contains(position),
          trackKey
        );
        return;
      }
      exclusiveProjectionKey = exclusiveProjectionKey === trackKey ? null : trackKey;
      persistTrackerFollowExclusivity();
      refreshTrackerProjections(Date.now() / 1000, false);
      centerOnTracker(tracker, false);
    }

    function projectionPathCells(path) {
      const cells = new Set();
      for (let index = 1; index < path.length; index += 1) {
        const start = L.latLng(path[index - 1]);
        const end = L.latLng(path[index]);
        const samples = Math.max(
          1,
          Math.ceil(map.distance(start, end) / PROJECTION_OVERLAP_GRID_METERS)
        );
        for (let sample = 0; sample <= samples; sample += 1) {
          const fraction = sample / samples;
          const latitude = start.lat + fraction * (end.lat - start.lat);
          const longitude = start.lng + fraction * (end.lng - start.lng);
          const latitudeCell = Math.round(
            latitude * 111320 / PROJECTION_OVERLAP_GRID_METERS
          );
          const longitudeCell = Math.round(
            longitude * 111320 * Math.cos(latitude * Math.PI / 180)
              / PROJECTION_OVERLAP_GRID_METERS
          );
          cells.add(`${latitudeCell},${longitudeCell}`);
        }
      }
      return cells;
    }

    function assignProjectionLineWidths(models) {
      const lines = [];
      for (const model of models) {
        for (const group of model.groups) {
          for (const result of group.results) {
            const path = result.path.slice();
            path[path.length - 1] = group.position;
            result.renderPath = path;
            lines.push({
              serial: model.tracker.serial,
              result,
              cells: projectionPathCells(path)
            });
          }
        }
      }
      const laterTrackersByCell = new Map();
      for (let index = lines.length - 1; index >= 0; index -= 1) {
        const line = lines[index];
        const overlappingLaterTrackers = new Set();
        for (const cell of line.cells) {
          for (const serial of laterTrackersByCell.get(cell) || []) {
            if (serial !== line.serial) overlappingLaterTrackers.add(serial);
          }
        }
        line.result.lineWeight = Math.min(
          PROJECTION_LINE_MAX_WIDTH,
          PROJECTION_LINE_BASE_WIDTH
            + PROJECTION_LINE_WIDTH_STEP * overlappingLaterTrackers.size
        );
        for (const cell of line.cells) {
          if (!laterTrackersByCell.has(cell)) laterTrackersByCell.set(cell, new Set());
          laterTrackersByCell.get(cell).add(line.serial);
        }
      }
    }

    function projectionFollowIcon(trackerFollowing, exclusiveThisProjection) {
      if (!trackerFollowing) {
        return `<svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="2" fill="currentColor"/>
          <path d="M12 2v4M12 18v4M2 12h4M18 12h4"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>`;
      }
      if (exclusiveThisProjection) {
        return `<svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
        </svg>`;
      }
      return `<svg viewBox="0 0 24 24" aria-hidden="true">
        <rect x="5" y="10" width="14" height="11" rx="2" fill="currentColor"/>
        <path d="M8 10V7a4 4 0 0 1 7.5-2" fill="none"
              stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>`;
    }

    function createProjectionGroupState(tracker, group, pane, linePane, color) {
      const marker = L.marker(group.position, {
        pane,
        icon: projectedTrackerIcon(tracker, group, false),
        keyboard: false,
        bubblingMouseEvents: false
      }).addTo(map);
      const tooltipContent = document.createElement("div");
      const tooltipHeader = document.createElement("div");
      const tooltipName = document.createElement("span");
      const followButton = document.createElement("button");
      const tooltipDetail = document.createElement("div");
      tooltipHeader.className = "projection-tooltip-header";
      tooltipName.className = "projection-tooltip-name";
      followButton.type = "button";
      followButton.className = "projection-tooltip-follow";
      tooltipDetail.className = "projection-tooltip-detail";
      tooltipHeader.append(tooltipName, followButton);
      tooltipContent.append(tooltipHeader, tooltipDetail);
      L.DomEvent.disableClickPropagation(tooltipContent);
      L.DomEvent.disableScrollPropagation(tooltipContent);
      marker.bindTooltip(tooltipContent, {
        direction: "top",
        offset: [0, -12],
        interactive: true,
        // Visibility is coupled to the original tracker detail popup. Avoid
        // Leaflet's non-permanent hover/touch lifecycle, which can interpret
        // moving from the marker into this interactive tooltip as mouseout
        // and close it while its contents are being clicked.
        permanent: true,
        className: "tracker-projection-tooltip"
      });
      // On touch devices Leaflet may independently toggle a non-permanent
      // tooltip as part of the synthesized click sequence. The original
      // tracker popup owns detail visibility, so reconcile after Leaflet
      // finishes processing that event.
      marker.on("tooltipopen tooltipclose", () => {
        scheduleDetailVisibilitySync(tracker.serial);
      });
      const state = {
        marker,
        uncertaintyCircle: L.circle(group.position, {
          pane: linePane,
          radius: 8,
          color,
          weight: 1,
          opacity: 0.13,
          fillColor: color,
          fillOpacity: 0.05,
          interactive: false
        }).addTo(map),
        lines: new Map(),
        pane,
        linePane,
        position: group.position,
        trackKey: group.trackKey,
        tooltipName,
        followButton,
        tooltipDetail,
        visualStopped: null,
        visualFollowTarget: null,
        visualColor: null,
        followMode: null
      };
      followButton.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        const currentTracker = trackers.get(tracker.serial);
        if (currentTracker) {
          toggleProjectionExclusivity(currentTracker, state.trackKey, state.position);
        }
      });
      for (const eventName of ["pointerdown", "touchstart"]) {
        followButton.addEventListener(eventName, event => {
          event.stopPropagation();
        }, { passive: true });
      }
      marker.on("click", event => {
        if (event.originalEvent) L.DomEvent.stop(event.originalEvent);
        toggleTrackerDetail(tracker.serial);
      });
      return state;
    }

    function renderTrackerProjection(tracker, groups, now) {
      const color = trackerMarkerColor(tracker);
      const projectionAgeSeconds = Math.max(0, now - tracker.sample_unix);
      const speedMps = Math.max(0, Number(tracker.speed_kph) / 3.6 || 0);
      const uncertaintyRadiusMeters =
        projectionUncertaintyRadius(projectionAgeSeconds, speedMps);
      let projection = trackerProjections.get(tracker.serial);
      if (!projection) {
        projection = { groups: new Map(), markers: [], lines: [], uncertaintyCircles: [] };
        trackerProjections.set(tracker.serial, projection);
      }
      Object.assign(projection, {
        minimumRouteRemainingMeters: Math.min(
          ...groups.flatMap(group =>
            group.results.map(result => result.routeRemainingMeters)
          ).filter(Number.isFinite)
        ),
        positions: groups.map(group => group.position),
        targets: groups.map(group => ({
          key: group.trackKey,
          position: group.position,
          stopped: group.stopped,
          headingDegrees: group.headingDegrees
        }))
      });
      const wantedGroups = new Set();
      for (const group of groups) {
        wantedGroups.add(group.trackKey);
        const trackerFollowing = followedSerial === tracker.serial;
        const exclusiveThisProjection = trackerFollowing
          && exclusiveProjectionKey === group.trackKey;
        const isFollowTarget = trackerFollowing
          && (!exclusiveProjectionKey || exclusiveThisProjection);
        const pane = isFollowTarget ? "followedProjectionPane" : "projectionPane";
        const linePane =
          isFollowTarget ? "followedProjectionLinePane" : "projectionLinePane";
        let state = projection.groups.get(group.trackKey);
        if (state && (state.pane !== pane || state.linePane !== linePane)) {
          removeProjectionGroup(state);
          projection.groups.delete(group.trackKey);
          state = null;
        }
        if (!state) {
          state = createProjectionGroupState(tracker, group, pane, linePane, color);
          projection.groups.set(group.trackKey, state);
        }
        state.position = group.position;
        state.trackKey = group.trackKey;
        state.marker.setLatLng(group.position);
        if (
          state.visualStopped !== group.stopped
          || state.visualFollowTarget !== isFollowTarget
          || state.visualColor !== color
        ) {
          state.marker.setIcon(projectedTrackerIcon(tracker, group, isFollowTarget));
          state.visualStopped = group.stopped;
          state.visualFollowTarget = isFollowTarget;
          state.visualColor = color;
        } else if (!group.stopped) {
          state.marker.getElement()
            ?.querySelector(".tracker-arrow")
            ?.style.setProperty("--course", `${group.headingDegrees}deg`);
        }
        state.marker.setOpacity(1);
        state.marker.projectionTrackNames = group.trackNames;
        state.uncertaintyCircle.setLatLng(group.position);
        state.uncertaintyCircle.setRadius(uncertaintyRadiusMeters);
        state.uncertaintyCircle.setStyle({ color, fillColor: color });
        const wantedLines = new Set();
        for (const result of group.results) {
          const lineKey = result.track.name;
          wantedLines.add(lineKey);
          let line = state.lines.get(lineKey);
          if (!line) {
            line = L.polyline([], {
              pane: linePane,
              color,
              weight: result.lineWeight || PROJECTION_LINE_BASE_WIDTH,
              opacity: 0.9,
              interactive: false
            }).addTo(map);
            state.lines.set(lineKey, line);
          }
          line.setLatLngs(result.renderPath || result.path);
          line.setStyle({
            color,
            weight: result.lineWeight || PROJECTION_LINE_BASE_WIDTH
          });
        }
        for (const [lineKey, line] of state.lines) {
          if (!wantedLines.has(lineKey)) {
            map.removeLayer(line);
            state.lines.delete(lineKey);
          }
        }
        state.tooltipName.textContent = tracker.name || tracker.serial_hex;
        const followMode = !trackerFollowing
          ? "not-following"
          : exclusiveThisProjection ? "exclusive" : "all";
        if (state.followMode !== followMode) {
          state.followButton.innerHTML =
            projectionFollowIcon(trackerFollowing, exclusiveThisProjection);
          state.followMode = followMode;
        }
        state.followButton.setAttribute("aria-pressed", String(exclusiveThisProjection));
        state.followButton.setAttribute(
          "aria-label",
          !trackerFollowing
            ? `Follow only this projection of ${tracker.name || tracker.serial_hex}`
            : exclusiveThisProjection
              ? `Use all projections of ${tracker.name || tracker.serial_hex}`
              : `Follow only this projection of ${tracker.name || tracker.serial_hex}`
        );
        state.followButton.title = !trackerFollowing
          ? "Follow only this projection"
          : exclusiveThisProjection ? "Use all projections" : "Follow only this projection";
        state.tooltipDetail.textContent =
          `Projected on ${group.trackNames.join(", ")} · ${formatSampleAge(tracker, now)}`;
      }
      for (const [trackKey, state] of projection.groups) {
        if (!wantedGroups.has(trackKey)) {
          removeProjectionGroup(state);
          projection.groups.delete(trackKey);
        }
      }
      projection.markers = [...projection.groups.values()].map(state => state.marker);
      projection.lines = [...projection.groups.values()]
        .flatMap(state => [...state.lines.values()]);
      projection.uncertaintyCircles = [...projection.groups.values()]
        .map(state => state.uncertaintyCircle);
      scheduleDetailVisibilitySync(tracker.serial);
      updateMarker(tracker);
      if (
        navigationEnabled
        && !clientPositionEnabled
        && followedSerial === tracker.serial
      ) {
        updateNavigationAssist();
      }
    }

    function projectionUncertaintyRadius(ageSeconds, speedMps) {
      const minimumRadiusMeters = 8;
      // Low reported speeds are less predictable because the car may be
      // accelerating again; race telemetry showed the opposite relationship
      // from the old speed-proportional ceiling. This bounds approximately
      // 90% of the observed 30–180 second along-route projection errors.
      const maximumRadiusMeters = Math.max(
        800,
        Math.min(2200, 2500 - Math.max(0, speedMps) * 45)
      );
      const elapsedAfterTightPeriod = Math.max(0, ageSeconds - 5);
      const weibullScaleSeconds = 115;
      const weibullShape = 1.7;
      const uncertainty = 1 - Math.exp(
        -Math.pow(elapsedAfterTightPeriod / weibullScaleSeconds, weibullShape)
      );
      return minimumRadiusMeters
        + (maximumRadiusMeters - minimumRadiusMeters) * uncertainty;
    }

    function refreshTrackerProjections(now = Date.now() / 1000, centerFollow = true) {
      if (zoomInProgress) return;
      if (!projectionEnabled || !routeTracks.length) {
        for (const serial of [...trackerProjections.keys()]) removeTrackerProjection(serial);
        return;
      }
      const previousSuppressFollowCentering = suppressFollowCentering;
      suppressFollowCentering = true;
      const wanted = new Set();
      const models = [];
      const viewRadiusMeters = projectionViewRadiusMeters();
      try {
        for (const tracker of trackers.values()) {
          if (!validPosition(tracker) || !trackerIsMoving(tracker) || trackerIsStale(tracker)
            || !Number.isFinite(tracker.sample_unix)) continue;
          const ageSeconds = Math.max(0, now - tracker.sample_unix);
          if (!trackerCouldProjectIntoView(tracker, ageSeconds, viewRadiusMeters)) continue;
          const originalPosition = L.latLng(tracker.latitude, tracker.longitude);
          const speedMps = tracker.speed_kph / 3.6;
          const groups = mergeProjectionResults(
            projectionMatchesAt(originalPosition, tracker.course_deg)
              .map(match => advanceProjection(match, ageSeconds, speedMps, originalPosition))
              .filter(Boolean)
          );
          if (!groups.length) continue;
          for (const group of groups) {
            group.trackNames = [...new Set(group.results.map(result => result.track.name))];
            group.trackKey = group.trackNames.join("\0");
          }
          wanted.add(tracker.serial);
          models.push({ tracker, groups });
        }
        assignProjectionLineWidths(models);
        for (const model of models) {
          renderTrackerProjection(model.tracker, model.groups, now);
        }
        for (const serial of [...trackerProjections.keys()]) {
          if (!wanted.has(serial)) removeTrackerProjection(serial);
        }
      } finally {
        suppressFollowCentering = previousSuppressFollowCentering;
      }
      if (centerFollow && followedSerial && trackers.has(followedSerial)) {
        centerOnTracker(trackers.get(followedSerial), false);
      }
      scheduleTeamBadgeLayout();
    }

    function formatRouteDistance(meters) {
      const miles = meters / 1609.344;
      return `${miles < 10 ? miles.toFixed(1) : miles.toFixed(0)} mi left`;
    }

    function routeDistancesAt(center, headingDegrees = null) {
      if (!routeTracks.length) return null;
      const closest = {
        segment: closestTrack(center, "segment", headingDegrees),
        loop: closestTrack(center, "loop", headingDegrees),
        alternate: closestTrack(center, "alternate", headingDegrees)
      };
      const loops = [closest.loop, closest.alternate].filter(Boolean);
      const nearestLoopDistance = Math.min(...loops.map(item => item.lineOfSightMeters));
      const showLoops = loops.length && closest.segment
        && nearestLoopDistance <= closest.segment.lineOfSightMeters + ROUTE_MATCH_MARGIN_METERS;
      const applicable = { segment: false, loop: false, alternate: false };
      let applicableRoutes = [];
      if (showLoops) {
        for (const loop of loops) {
          if (loop.lineOfSightMeters <= nearestLoopDistance + ROUTE_MATCH_MARGIN_METERS) {
            applicableRoutes.push(loop);
          }
        }
        if (closest.segment.lineOfSightMeters <= nearestLoopDistance + ROUTE_MATCH_MARGIN_METERS) {
          applicableRoutes.push(closest.segment);
        }
      } else if (closest.segment) {
        applicableRoutes.push(closest.segment);
      }
      if (applicableRoutes.length > 1 && Number.isFinite(headingDegrees)) {
        const headingMatches = applicableRoutes.filter(route =>
          headingDifference(headingDegrees, route.trackHeadingDegrees)
            <= MAX_ROUTE_HEADING_DIFFERENCE_DEGREES
        );
        if (headingMatches.length) applicableRoutes = headingMatches;
      }
      for (const route of applicableRoutes) applicable[route.track.kind] = true;
      return {
        closest,
        applicable,
        totalMeters: applicableRoutes.length
          ? Math.min(...applicableRoutes.map(route => route.routeRemainingMeters))
          : null
      };
    }

    function updateRouteLegend() {
      if (!routeLegendLabels.segment) return;
      const distances = routeDistancesAt(map.getCenter(), mapCenterHeadingDegrees);
      updateMapCenterSpeedLimit(distances);
      if (!distances) return;
      for (const kind of Object.keys(routeLegendLabels)) {
        const route = distances.closest[kind];
        routeLegendLabels[kind].textContent = route?.track.name || "None nearby";
        if (route && distances.applicable[kind]) {
          routeLegendLabels[kind].textContent += ` · ${formatRouteDistance(route.trackRemainingMeters)}`;
        }
      }
      routeLegendDistanceToEnd.textContent = Number.isFinite(distances.totalMeters)
        ? formatRouteDistance(distances.totalMeters)
        : "—";
    }

    function updateMapCenterSpeedLimit(distances = null) {
      if (!currentRouteSpeedLimitElement) return;
      const routeDistances = distances
        || routeDistancesAt(map.getCenter(), mapCenterHeadingDegrees);
      const kindPriority = { segment: 0, loop: 1, alternate: 2 };
      const match = ["segment", "loop", "alternate"]
        .filter(kind =>
          routeDistances?.applicable[kind] && routeDistances.closest[kind]
        )
        .map(kind => ({ ...routeDistances.closest[kind], kind }))
        .filter(route =>
          route.lineOfSightMeters <= ROUTE_MATCH_MARGIN_METERS
        )
        .sort((left, right) =>
          left.lineOfSightMeters - right.lineOfSightMeters
          || kindPriority[left.kind] - kindPriority[right.kind]
        )[0];
      if (!match) {
        currentRouteSpeedLimitElement.hidden = true;
        currentRouteStepElement.hidden = true;
        return;
      }
      let progressMeters = match.edge.progressFromStartMeters
        + match.fraction * match.edge.lengthMeters;
      if (
        clientPositionFollowing
        && clientSpeedRouteMatch?.track === match.track
        && clientPositionTarget
        && map.distance(map.getCenter(), clientPositionTarget)
          <= Math.max(100, clientSpeedRouteMatch.accuracyMeters * 2)
      ) {
        progressMeters = clientSpeedRouteMatch.progressMeters;
      }
      const speedLimitMph = speedLimitAtTrackProgress(
        match.track, progressMeters
      );
      currentRouteSpeedLimitElement.hidden =
        !Number.isFinite(speedLimitMph);
      if (Number.isFinite(speedLimitMph)) {
        currentRouteSpeedLimitValueElement.textContent =
          String(speedLimitMph);
      }
      const routeStep = routeBookStepAtTrackProgress(
        match.track, progressMeters
      );
      currentRouteStepElement.hidden = !routeStep;
      if (routeStep) currentRouteStepElement.textContent = routeStep.label;
    }

    async function loadGpxArchive() {
      const routeBooksPromise = loadRouteBooks();
      const response = await fetch(GPX_ZIP_URL);
      if (!response.ok) throw new Error(`GPX archive: HTTP ${response.status}`);
      const archive = fflate.unzipSync(new Uint8Array(await response.arrayBuffer()), {
        filter(file) {
          return file.name.toLowerCase().endsWith(".gpx") && file.originalSize <= 2_000_000;
        }
      });
      const files = Object.entries(archive).filter(([path]) => path.toLowerCase().endsWith(".gpx"));
      if (!files.length) throw new Error("GPX archive contains no GPX files");
      for (const [path, contents] of files) {
        const filename = path.split("/").pop();
        renderGpxTrack(filename, fflate.strFromU8(contents));
      }
      const routeBooks = await routeBooksPromise;
      attachRouteBookNavigation(routeBooks);
      finalizeRouteDistances();
      renderRouteCourseMarkers();
      addDemoTrackers();
      for (const tracker of trackers.values()) {
        updateTrackerRouteDistances(tracker);
        updateBoundPopup(markers.get(tracker.serial), popupContent(tracker));
      }
      if (clientSummaryTracker) updateTrackerRouteDistances(clientSummaryTracker);
      updateNavigationAssist();
      renderTrackerList();
      refreshTrackerProjections();
      updateRouteLegend();
      const navigationStepCount = routeTracks.reduce(
        (sum, track) => sum + track.navigationTurns.length, 0
      );
      console.info(
        `Loaded ${files.length} GPX tracks and ${navigationStepCount} route-book navigation steps`
      );
    }

    async function loadGpxTracks() {
      try {
        await loadGpxArchive();
      } catch (archiveError) {
        console.error("Could not load the ASC GPX archive", archiveError);
      } finally {
        tracksLoaded = true;
        fitInitialView();
      }
    }

    const routeLegendLabels = {};
    let routeLegendDistanceToEnd = null;
    let currentRouteSpeedLimitElement = null;
    let currentRouteSpeedLimitValueElement = null;
    let currentRouteStepElement = null;
    const legend = L.control({ position: "bottomright" });
    legend.onAdd = () => {
      const element = L.DomUtil.create("div", "route-legend");
      for (const kind of ["segment", "loop", "alternate"]) {
        const row = document.createElement("div");
        const key = document.createElement("span");
        const label = document.createElement("span");
        key.className = `route-key ${kind}`;
        label.textContent = "Loading routes…";
        routeLegendLabels[kind] = label;
        row.append(key, label);
        element.append(row);
      }
      routeLegendDistanceToEnd = document.createElement("div");
      routeLegendDistanceToEnd.className = "route-total";
      routeLegendDistanceToEnd.textContent = "Loading routes…";
      element.append(routeLegendDistanceToEnd);
      return element;
    };
    const speedLimitControl = L.control({ position: "bottomright" });
    speedLimitControl.onAdd = () => {
      const root = L.DomUtil.create("div", "current-route-speed-control");
      currentRouteSpeedLimitElement = L.DomUtil.create(
        "div", "current-route-speed-limit", root
      );
      currentRouteSpeedLimitElement.hidden = true;
      const speedLabel = document.createElement("span");
      speedLabel.className = "current-route-speed-limit-label";
      speedLabel.textContent = "SPEED LIMIT";
      currentRouteSpeedLimitValueElement = document.createElement("span");
      currentRouteSpeedLimitValueElement.className =
        "current-route-speed-limit-value";
      currentRouteSpeedLimitElement.append(
        speedLabel, currentRouteSpeedLimitValueElement
      );
      currentRouteStepElement = L.DomUtil.create(
        "div", "current-route-step", root
      );
      currentRouteStepElement.hidden = true;
      return root;
    };
    legend.addTo(map);
    mapScale.addTo(map);
    speedLimitControl.addTo(map);
    let mapCenterHeadingDegrees = null;
    let previousSettledMapCenter = map.getCenter();
    map.on("moveend", () => {
      const center = map.getCenter();
      // A meter-scale correction during smooth following isn't a reliable
      // direction measurement and can point backward on alternating updates.
      if (map.distance(previousSettledMapCenter, center) >= 10) {
        mapCenterHeadingDegrees = bearingDegrees(previousSettledMapCenter, center);
      }
      previousSettledMapCenter = center;
      updateRouteLegend();
      updateLoopDirectionArrowVisibility();
      scheduleTeamBadgeLayout();
      if (!followedSerial) refreshTrackerProjections(Date.now() / 1000, false);
      try {
        window.localStorage.setItem(MAP_VIEW_STORAGE_KEY, JSON.stringify({
          latitude: center.lat,
          longitude: center.lng,
          zoom: map.getZoom()
        }));
      } catch (error) {
        // Storage may be disabled.
      }
    });

    const trackers = new Map();
    const markers = new Map();
    const trackerProjections = new Map();
    const teamBadgeLayers = new Map();
    let teamBadgesEnabled = (() => {
      try {
        return window.localStorage.getItem(TEAM_BADGES_STORAGE_KEY) !== "false";
      } catch (error) {
        return true;
      }
    })();
    let teamBadgeButton = null;
    let teamBadgeLayoutFrame = null;

    function trackerTeamNumber(tracker) {
      const match = String(tracker?.name || "").match(/^#\s*(\d+[A-Za-z]?)/);
      return match ? `#${match[1]}` : null;
    }

    function teamBadgeSeedAngle(tracker) {
      const seed = String(tracker?.name || tracker?.serial || "");
      let hash = 0x811c9dc5;
      for (let index = 0; index < seed.length; index += 1) {
        hash ^= seed.charCodeAt(index);
        hash = Math.imul(hash, 0x01000193);
      }
      return ((hash >>> 0) % 360) * Math.PI / 180;
    }

    function removeTeamBadge(serial) {
      const state = teamBadgeLayers.get(serial);
      if (!state) return;
      map.removeLayer(state.marker);
      for (const line of state.lines) map.removeLayer(line);
      teamBadgeLayers.delete(serial);
    }

    function clearTeamBadges() {
      for (const serial of [...teamBadgeLayers.keys()]) removeTeamBadge(serial);
    }

    function badgeTargetsForTracker(tracker) {
      const projectedPositions = trackerProjections.get(tracker.serial)?.positions;
      if (projectionEnabled && projectedPositions?.length) {
        return [
          L.latLng(tracker.latitude, tracker.longitude),
          ...projectedPositions.map(position => L.latLng(position))
        ];
      }
      return validPosition(tracker)
        ? [L.latLng(tracker.latitude, tracker.longitude)]
        : [];
    }

    function rectanglesOverlap(left, right) {
      return left.left < right.right && left.right > right.left
        && left.top < right.bottom && left.bottom > right.top;
    }

    function layoutTeamBadges() {
      teamBadgeLayoutFrame = null;
      if (!teamBadgesEnabled) {
        clearTeamBadges();
        return;
      }
      const paddedBounds = map.getBounds().pad(0.15);
      const mapSize = map.getSize();
      const occupied = [];
      const markerObstacles = [];
      const addMarkerObstacle = (
        position,
        radius = 14,
        serial = null,
        role = null
      ) => {
        if (!position || !paddedBounds.contains(position)) return;
        const point = map.latLngToContainerPoint(position);
        markerObstacles.push({
          left: point.x - radius,
          right: point.x + radius,
          top: point.y - radius,
          bottom: point.y + radius,
          serial,
          role
        });
      };
      for (const tracker of trackers.values()) {
        if (validPosition(tracker)) {
          addMarkerObstacle(
            L.latLng(tracker.latitude, tracker.longitude),
            followedSerial === tracker.serial ? 20 : 14,
            tracker.serial,
            "original"
          );
        }
        for (const position of trackerProjections.get(tracker.serial)?.positions || []) {
          addMarkerObstacle(
            L.latLng(position),
            followedSerial === tracker.serial ? 20 : 14,
            tracker.serial,
            "projection"
          );
        }
      }
      for (const checkpoint of checkpointMarkers) {
        addMarkerObstacle(L.latLng(checkpoint.position), 16);
      }
      for (const pin of pins.values()) {
        addMarkerObstacle(L.latLng(pin.latitude, pin.longitude), 15);
      }
      const wanted = new Set();
      const candidates = [...trackers.values()]
        .map(tracker => ({
          tracker,
          label: trackerTeamNumber(tracker),
          targets: badgeTargetsForTracker(tracker),
          projectionTargets:
            projectionEnabled
              ? (trackerProjections.get(tracker.serial)?.positions || [])
                .map(position => L.latLng(position))
              : []
        }))
        .filter(item =>
          item.label && item.targets.length
          && item.targets.some(position => paddedBounds.contains(position))
        )
        .sort((left, right) =>
          left.label.localeCompare(right.label, undefined, { numeric: true })
          || String(left.tracker.serial).localeCompare(String(right.tracker.serial))
        );

      for (const item of candidates) {
        const visibleProjectionTargets = item.projectionTargets.filter(position =>
          paddedBounds.contains(position)
        );
        const anchorTargets = visibleProjectionTargets.length
          ? visibleProjectionTargets
          : item.projectionTargets.length
            ? item.projectionTargets
            : item.targets;
        const targetPoints = anchorTargets.map(position =>
          map.latLngToContainerPoint(position)
        );
        const anchor = L.point(
          targetPoints.reduce((sum, point) => sum + point.x, 0) / targetPoints.length,
          targetPoints.reduce((sum, point) => sum + point.y, 0) / targetPoints.length
        );
        const width = Math.max(28, 12 + item.label.length * 6);
        const height = 21;
        const seedAngle = teamBadgeSeedAngle(item.tracker);
        let placement = null;
        if (item.projectionTargets.length <= 1 && item.targets.length) {
          const directTarget = item.projectionTargets[0]
            || L.latLng(item.tracker.latitude, item.tracker.longitude);
          const projectionPoint = map.latLngToContainerPoint(
            directTarget
          );
          const markerClearance =
            followedSerial === item.tracker.serial ? 30 : 25;
          for (const verticalDirection of [-1, 1]) {
            const center = L.point(
              projectionPoint.x,
              projectionPoint.y + verticalDirection * markerClearance
            );
            const rectangle = {
              left: center.x - width / 2 - 1,
              right: center.x + width / 2 + 1,
              top: center.y - height / 2 - 1,
              bottom: center.y + height / 2 + 1
            };
            if (
              rectangle.left >= 4 && rectangle.top >= 4
              && rectangle.right <= mapSize.x - 4
              && rectangle.bottom <= mapSize.y - 4
              && !occupied.some(other => rectanglesOverlap(rectangle, other))
              && !markerObstacles.some(other =>
                other.serial !== item.tracker.serial
                && rectanglesOverlap(rectangle, other)
              )
            ) {
              placement = { center, rectangle, direct: true };
              break;
            }
          }
        }
        for (const avoidMarkers of placement ? [] : [true, false]) {
          for (let attempt = 0; attempt < 240; attempt += 1) {
            const ring = Math.floor(attempt / 16);
            const slot = attempt % 16;
            const radius = 29 + ring * 13;
            const angle = seedAngle + slot * Math.PI * 2 / 16 + ring * 0.37;
            const center = L.point(
              anchor.x + Math.cos(angle) * radius,
              anchor.y + Math.sin(angle) * radius
            );
            const rectangle = {
              left: center.x - width / 2 - 1,
              right: center.x + width / 2 + 1,
              top: center.y - height / 2 - 1,
              bottom: center.y + height / 2 + 1
            };
            if (
              rectangle.left < 4 || rectangle.top < 4
              || rectangle.right > mapSize.x - 4
              || rectangle.bottom > mapSize.y - 4
              || occupied.some(other => rectanglesOverlap(rectangle, other))
              || avoidMarkers
                && markerObstacles.some(other =>
                  rectanglesOverlap(rectangle, other)
                )
            ) continue;
            placement = { center, rectangle };
            break;
          }
          if (placement) break;
        }
        // In an impossibly crowded viewport, omit a badge rather than allow
        // ambiguous overlapping labels.
        if (!placement) continue;
        occupied.push(placement.rectangle);
        wanted.add(item.tracker.serial);
        const badgePosition = map.containerPointToLatLng(placement.center);
        const color = trackerMarkerColor(item.tracker);
        let state = teamBadgeLayers.get(item.tracker.serial);
        if (!state) {
          state = {
            marker: L.marker(badgePosition, {
              pane: "teamBadgePane",
              interactive: true,
              keyboard: true,

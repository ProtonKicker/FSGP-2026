        const request = window.indexedDB.open(TRACKER_CACHE_DATABASE, 1);
        request.addEventListener("upgradeneeded", () => {
          if (!request.result.objectStoreNames.contains(TRACKER_CACHE_STORE)) {
            request.result.createObjectStore(TRACKER_CACHE_STORE);
          }
        });
        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
      });
      return trackerCacheDatabasePromise;
    }

    async function readPersistedTrackers() {
      const database = await trackerCacheDatabase();
      return new Promise((resolve, reject) => {
        const request = database
          .transaction(TRACKER_CACHE_STORE, "readonly")
          .objectStore(TRACKER_CACHE_STORE)
          .get(TRACKER_CACHE_KEY);
        request.addEventListener("success", () => resolve(request.result || null));
        request.addEventListener("error", () => reject(request.error));
      });
    }

    async function writePersistedTrackers() {
      const persisted = {};
      for (const [serial, tracker] of trackers) {
        if (tracker.demo_tracker) continue;
        const value = {};
        for (const field of PERSISTED_TRACKER_FIELDS) value[field] = tracker[field] ?? null;
        persisted[serial] = value;
      }
      const database = await trackerCacheDatabase();
      await new Promise((resolve, reject) => {
        const request = database
          .transaction(TRACKER_CACHE_STORE, "readwrite")
          .objectStore(TRACKER_CACHE_STORE)
          .put({ saved_at: Date.now(), trackers: persisted }, TRACKER_CACHE_KEY);
        request.addEventListener("success", resolve);
        request.addEventListener("error", () => reject(request.error));
      });
    }

    function trackerMarkerColor(tracker) {
      const baseColor = markerColor(tracker?.color);
      if (!supportsTrackerColorMix || tracker?.client_tracker) return baseColor;
      const colorSeed = String(
        tracker?.name || tracker?.serial || tracker?.serial_hex || ""
      );
      const cacheKey = `${colorSeed}\0${baseColor}`;
      if (trackerMarkerColorCache.has(cacheKey)) {
        return trackerMarkerColorCache.get(cacheKey);
      }
      // FNV-1a gives similar names unrelated, stable offsets. Keep the
      // configured team color dominant while coincident markers remain easy
      // to tell apart.
      let hash = 0x811c9dc5;
      for (let index = 0; index < colorSeed.length; index += 1) {
        hash ^= colorSeed.charCodeAt(index);
        hash = Math.imul(hash, 0x01000193);
      }
      hash >>>= 0;
      const hue = hash % 360;
      const accentPercent = 27 + ((hash >>> 9) % 10);
      const mixedColor =
        `color-mix(in srgb, ${baseColor} ${100 - accentPercent}%, ` +
        `hsl(${hue} 78% 52%))`;
      trackerMarkerColorCache.set(cacheKey, mixedColor);
      return mixedColor;
    }

      pins.set(pin.id, pin);

      renderPinControl();
      schedulePinListRender();
      if (pinModerationDialog.open) renderPinModeration();
      if (solarSummaryDialog.open) renderSolarSummary();
    }

    function reconcilePinsSnapshot(serverPins) {
      const received = new Set(serverPins.map(pin => pin.id));
      for (const [id, pin] of pins) {
        if (!pin.local_pending && !received.has(id)) removePin(id);
      }
      for (const pin of serverPins) upsertPin(pin, false);
      let closedStateChanged = false;
      for (const id of [...closedPinPopupIds]) {
        if (!received.has(id) && !pins.get(id)?.local_pending) {
          closedPinPopupIds.delete(id);
          closedStateChanged = true;
        }
      }
      if (closedStateChanged) persistClosedPinPopups();
      renderPinControl();
    }

    function renderPinControl() {
      if (!pinPlacementButton) return;
      pinPlacementButton.innerHTML = pinPlacementActive
        ? approvePinSvg
        : pinSvg("#344054");
      pinPlacementButton.title = pinPlacementActive ? "Confirm pin position" : "Add a map pin";
      pinPlacementButton.setAttribute("aria-label", pinPlacementButton.title);
      pinPlacementCancelButton.hidden = !pinPlacementActive;
      pinControlRoot?.classList.toggle("pin-drop-active", pinPlacementActive);
      if (pinModerationButton) {
        const pendingCount = [...pins.values()]
          .filter(pin => !pin.approved && !pin.local_pending).length;
        pinModerationButton.hidden = false;
        pinModerationButton.classList.toggle("has-pending", pendingCount > 0);
        const badge = pinModerationButton.querySelector(".pin-pending-badge");
        if (badge) {
          badge.hidden = pendingCount === 0;
          badge.textContent = pendingCount > 99 ? "99+" : String(pendingCount);
        }
        pinModerationButton.title = staffUnlocked
          ? `Moderate map pins${pendingCount ? ` (${pendingCount} pending)` : ""}`
          : "Show map pins";
        pinModerationButton.setAttribute("aria-label", pinModerationButton.title);
        pinControlRoot?.classList.add("staff-controls");
      }
    }

    function stopPinPlacement() {
      pinPlacementActive = false;
      pinPlacementPosition = null;
      if (pinPlacementMarker) map.removeLayer(pinPlacementMarker);
      pinPlacementMarker = null;
      renderPinControl();
    }

    function startPinPlacement() {
      pinPlacementActive = true;
      pinPlacementPosition = map.getCenter();
      pinPlacementMarker = L.marker(pinPlacementPosition, {
        icon: pinIcon({ color: selectedPinColor }, true),
        interactive: false,
        keyboard: false,
        pane: "tooltipPane"
      }).addTo(map);
      renderPinControl();
    }

    function installPinControl() {
      const control = L.control({ position: "topright" });
      control.onAdd = () => {
        const root = L.DomUtil.create("div", "pin-placement-control");
        pinControlRoot = root;
        pinModerationButton = L.DomUtil.create(
          "button", "pin-control-button pin-moderation-control", root
        );
        pinModerationButton.type = "button";
        pinModerationButton.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 4.5 9.5 12M12 2.5V11M18 4.5 14.5 12"
                fill="none" stroke="currentColor" stroke-width="1.6"
                stroke-linecap="round"/>
          <circle cx="5.5" cy="3.5" r="1.5" fill="currentColor"/>
          <circle cx="12" cy="2.5" r="1.5" fill="currentColor"/>
          <circle cx="18.5" cy="3.5" r="1.5" fill="currentColor"/>
          <path d="M4.5 15c0-3.2 3.4-5.2 7.5-5.2s7.5 2 7.5 5.2
                   c0 3.5-3.3 5.8-7.5 5.8S4.5 18.5 4.5 15Z"
                fill="currentColor" fill-opacity=".18"
                stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 10v10.4" fill="none" stroke="currentColor"
                stroke-width="1.2" stroke-opacity=".55"/>
        </svg><span class="pin-pending-badge" hidden></span>`;
        pinModerationButton.addEventListener("click", () => {
          renderPinModeration();
          pinModerationDialog.showModal();
        });
        pinPlacementCancelButton = L.DomUtil.create(
          "button", "pin-control-button pin-control-cancel", root
        );
        pinPlacementCancelButton.type = "button";
        pinPlacementCancelButton.title = "Cancel pin placement";
        pinPlacementCancelButton.setAttribute("aria-label", pinPlacementCancelButton.title);
        pinPlacementCancelButton.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4"
                stroke-linecap="round"/>
        </svg>`;
        pinPlacementCancelButton.addEventListener("click", stopPinPlacement);
        pinPlacementButton = L.DomUtil.create("button", "pin-control-button", root);
        pinPlacementButton.classList.add("pin-placement-main");
        pinPlacementButton.type = "button";
        pinPlacementButton.addEventListener("click", () => {
          if (!pinPlacementActive) startPinPlacement();
          else {
            pinPlacementPosition = map.getCenter();
            pinComposeDialog.showModal();
            pinMessageInput.focus();
          }
        });
        L.DomEvent.disableClickPropagation(root);
        L.DomEvent.disableScrollPropagation(root);
        renderPinControl();
        return root;
      };
      control.addTo(map);
      map.on("move", () => {
        if (!pinPlacementActive || !pinPlacementMarker) return;
        pinPlacementPosition = map.getCenter();
        pinPlacementMarker.setLatLng(pinPlacementPosition);
      });
    }

    function focusPin(pin, openPopup = true) {
      if (followedPinId && followedPinId !== pin.id) setFollowedPin(null, false);
      if (followedSerial) setFollowedTracker(null, false, false);
      if (clientPositionFollowing) setClientPositionFollowing(false);
      highlightedCheckpointTrackName = null;
      suppressMoveCancellation = true;
      try {
        map.panTo([pin.latitude, pin.longitude], { animate: true, duration: 0.45 });
      } finally {
        window.setTimeout(() => { suppressMoveCancellation = false; }, 500);
      }
      if (openPopup) pinMarkers.get(pin.id)?.openPopup();
    }

    function pinIsCentered(pin) {
      const pinPoint = map.latLngToContainerPoint([pin.latitude, pin.longitude]);
      return pinPoint.distanceTo(map.getSize().divideBy(2)) <= 6;
    }

    function activatePin(pin) {
      if (!pinIsCentered(pin)) {
        setFollowedPin(pin.id, true);
        return;
      }
      setFollowedPin(pin.id, false);
      const marker = pinMarkers.get(pin.id);
      if (marker?.isPopupOpen()) marker.closePopup();
      else marker?.openPopup();
    }

    function setFollowedPin(id, recenter = true) {
      const pin = id ? pins.get(id) : null;
      followedPinId = pin ? id : null;
      if (pin) {
        followedPeloton = null;
        relativeDistanceReference = { type: "pin", id: pin.id };
        if (followedSerial) setFollowedTracker(null, false, false);
        if (clientPositionFollowing) setClientPositionFollowing(false);
        highlightedCheckpointTrackName = null;
        if (recenter) focusPin(pin);
      }
      renderTrackerList();
      updateSideRelativeDistances();
      if (solarSummaryDialog.open) renderSolarSummary();
    }

    function renderPinModeration() {
      const makeHeading = text => {
        const heading = document.createElement("h3");
        heading.textContent = text;
        return heading;
      };
      const makeRow = pin => {
        const row = document.createElement("div");
        const deleteAction = document.createElement("span");
        const marker = document.createElement("span");
        const identity = document.createElement("span");
        const message = document.createElement("span");
        const meta = document.createElement("span");
        const age = document.createElement("span");
        const relative = document.createElement("span");
        const actions = document.createElement("span");
        row.className = "pin-moderation-row";
        row.dataset.pinId = pin.id;
        const canModerate = staffUnlocked && !pin.local_pending;
        row.classList.toggle("public-pin-row", !canModerate);
        marker.className = "pin-horizontal-marker";
        marker.innerHTML = horizontalPinSvg(PIN_COLORS[pin.color]);
        message.className = "pin-moderation-message";
        message.textContent = pin.message;
        message.title = pin.message;
        meta.className = "pin-moderation-meta";
        age.className = "pin-moderation-age";
        age.textContent = formatPinAge(pin);
        meta.append(age, ` · ${formatPinDateTime(pin)}`);
        meta.title = meta.textContent;
        identity.className = "pin-moderation-identity";
        identity.append(message, meta);
        relative.className = "solar-summary-relative";
        const reference = activeSideDistanceReference();
        const distanceMeters = pinRouteDistanceMeters(pin);
        relative.textContent = reference && Number.isFinite(reference.distanceMeters)
          && Number.isFinite(distanceMeters)
          ? sideRelativeDistance(distanceMeters, "pin", pin.id)
          : "";
        if (canModerate) {
          deleteAction.className = "pin-moderation-actions pin-moderation-delete-action";
          deleteAction.append(pinActionButton("Delete pin", deletePinSvg, () =>
            sendPinMessage({ type: "pin_delete", id: pin.id })
          ));
        }
        actions.className = "pin-moderation-actions";
        if (canModerate && !pin.approved) {
          actions.append(pinActionButton("Approve pin", approvePinSvg, () =>
            sendPinMessage({ type: "pin_approve", id: pin.id })
          ));
        }
        const jumpButton = pinActionButton("Follow pin", followCrosshairSvg, () => {
          pinModerationDialog.close();
          setFollowedPin(pin.id, true);
          scrollRacePinIntoView(pin.id);
        });
        jumpButton.classList.add("pin-moderation-jump");
        actions.append(jumpButton);
        if (pin.approved) {
          row.tabIndex = 0;
          row.setAttribute("role", "button");
          row.addEventListener("click", event => {
            if (event.target.closest("button")) return;
            pinModerationDialog.close();
            setFollowedPin(pin.id, true);
            scrollRacePinIntoView(pin.id);
          });
          row.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              pinModerationDialog.close();
              setFollowedPin(pin.id, true);
              scrollRacePinIntoView(pin.id);
            }
          });
        }
        if (canModerate) row.append(deleteAction);
        row.append(marker, identity, relative, actions);
        return row;
      };
      const pending = [...pins.values()]
        .filter(pin => !pin.approved && !pin.local_pending)
        .sort((left, right) => left.submitted_at?.localeCompare(right.submitted_at || "") || 0);
      const approved = [...pins.values()]
        .filter(pin => pin.approved)
        .sort((left, right) => {
          const leftDistance = pinRouteDistanceMeters(left);
          const rightDistance = pinRouteDistanceMeters(right);
          if (Number.isFinite(leftDistance) && Number.isFinite(rightDistance)) {
            return leftDistance - rightDistance
              || left.message.localeCompare(right.message, undefined, {
                numeric: true,
                sensitivity: "base"
              });
          }
          if (Number.isFinite(leftDistance)) return -1;
          if (Number.isFinite(rightDistance)) return 1;
          return left.message.localeCompare(right.message, undefined, {
            numeric: true,
            sensitivity: "base"
          });
        });
      const content = [];
      if (staffUnlocked) {
        content.push(makeHeading(`Pending (${pending.length})`));
        if (pending.length) content.push(...pending.map(makeRow));
        else {
          const empty = document.createElement("div");
          empty.className = "checkpoint-eta-empty";
          empty.textContent = "No pending pins";
          content.push(empty);
        }
        content.push(makeHeading(`Approved (${approved.length})`));
      }
      if (approved.length) content.push(...approved.map(makeRow));
      else if (!staffUnlocked) {
        const empty = document.createElement("div");
        empty.className = "checkpoint-eta-empty";
        empty.textContent = "No map pins";
        content.push(empty);
      }
      pinModerationContent.replaceChildren(...content);
    }

    pinComposeForm.addEventListener("submit", event => {
      event.preventDefault();
      const normalized = pinMessageInput.value.trim().replace(/\s+/g, " ");
      if (!normalized || normalized.length > 240 || !pinPlacementPosition) return;
      const color = new FormData(pinComposeForm).get("pin-color") || selectedPinColor;
      selectedPinColor = color;
      persistPinColor(color);
      const clientId = `local-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;
      const pending = {
        id: clientId,
        client_id: clientId,
        latitude: pinPlacementPosition.lat,
        longitude: pinPlacementPosition.lng,
        color,
        message: normalized,
        submitted_at: new Date().toISOString(),
        approved: false,
        local_pending: true
      };
      if (!sendPinMessage({
        type: "pin_submit",
        latitude: pending.latitude,
        longitude: pending.longitude,
        color,
        message: normalized,
        client_id: clientId
      })) return;
      upsertPin(pending, false);
      pinComposeDialog.close();
      pinMessageInput.value = "";
      stopPinPlacement();
    });
    document.querySelector("#pin-compose-cancel").addEventListener("click", () => {
      pinComposeDialog.close();
    });
    pinModerationDialog.querySelector(".checkpoint-summary-close")
      .addEventListener("click", () => pinModerationDialog.close());

    function installClientLocationControl() {
      const control = L.control({ position: "topleft" });
      control.onAdd = () => {
        const root = L.DomUtil.create("div", "client-location-control");
        const buttons = L.DomUtil.create("div", "client-location-buttons", root);
        clientLocationButton = L.DomUtil.create(
          "button", "client-location-button", buttons
        );
        clientLocationButton.type = "button";
        clientLocationButton.title = "Show and follow this device's location";
        clientLocationButton.setAttribute("aria-label", clientLocationButton.title);
        clientLocationButton.setAttribute("aria-pressed", "false");
        const arrow = L.DomUtil.create("span", "client-location-arrow", clientLocationButton);
        arrow.setAttribute("aria-hidden", "true");
        arrow.innerHTML = `<svg viewBox="0 0 26 26">
          <path d="M13 1 L23 23 L13 18 L3 23 Z" fill="rgba(33,123,218,0.52)" stroke="rgba(255,255,255,0.82)" stroke-width="3" stroke-linejoin="round"/>
        </svg>`;
        clientAnchorButton = L.DomUtil.create(
          "button", "client-anchor-button", buttons
        );
        clientAnchorButton.type = "button";
        clientAnchorButton.hidden = true;
        clientAnchorButton.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="5" r="2.2" fill="none" stroke="currentColor"
                  stroke-width="2"/>
          <path d="M12 7.2V20M7 11h10M5 16c1.2 3 3.5 4.5 7 4.5S17.8 19 19 16"
                fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="m5 16 1.2-2.2M19 16l-1.2-2.2" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>`;
        clientSpeedElement = L.DomUtil.create("div", "client-speed", root);
        clientSpeedElement.hidden = true;
        clientSpeedElement.innerHTML = '<span class="client-speed-value">--</span><span class="client-speed-unit">MPH</span>';
        clientRouteSummaryElement = L.DomUtil.create("div", "client-route-summary", root);
        clientRouteSummaryElement.hidden = true;
        L.DomEvent.disableClickPropagation(root);
        L.DomEvent.disableScrollPropagation(root);
        let lastTouchPointerUpAt = -Infinity;
        let suppressLocationClickUntil = -Infinity;
        clientLocationButton.addEventListener("pointerup", event => {
          if (event.pointerType !== "touch") return;
          const now = performance.now();
          if (now - lastTouchPointerUpAt <= 500) {
            event.preventDefault();
            event.stopPropagation();
            lastTouchPointerUpAt = -Infinity;
            suppressLocationClickUntil = now + 700;
            disableClientPosition();
            return;
          }
          lastTouchPointerUpAt = now;
        });
        clientLocationButton.addEventListener("click", event => {
          if (performance.now() < suppressLocationClickUntil) {
            event.preventDefault();
            return;
          }
          if (event.detail >= 2) {
            disableClientPosition();
            return;
          }
          toggleClientPositionFollow();
        });
        clientLocationButton.addEventListener("dblclick", event => {
          event.preventDefault();
          disableClientPosition();
        });
        clientAnchorButton.addEventListener("click", () => {
          setClientAnchorEnabled(!clientAnchorEnabled);
        });
        return root;
      };
      control.addTo(map);
      installClientAnchorInteractionTracking();
    }

    function renderClientLocationControl() {
      if (!clientLocationButton || !clientAnchorButton
        || !clientSpeedElement || !clientRouteSummaryElement) return;
      const icon = clientLocationButton.querySelector(".client-location-arrow");
      clientLocationButton.classList.toggle("location-enabled", clientPositionEnabled);
      if (icon) {
        icon.innerHTML = clientPositionEnabled
          ? followCrosshairSvg
          : `<svg viewBox="0 0 26 26" aria-hidden="true">
              <path d="M13 1 L23 23 L13 18 L3 23 Z"
                    fill="rgba(33,123,218,0.52)"
                    stroke="rgba(255,255,255,0.82)" stroke-width="3"
                    stroke-linejoin="round"/>
            </svg>`;
      }
      clientLocationButton.setAttribute("aria-pressed", String(clientPositionFollowing));
      clientLocationButton.title = clientPositionFollowing
        ? "Stop following this device's location"
        : "Follow this device's location";
      clientLocationButton.setAttribute("aria-label", clientLocationButton.title);
      clientAnchorButton.hidden = !(clientPositionFollowing || clientAnchorEnabled);
      clientAnchorButton.setAttribute("aria-pressed", String(clientAnchorEnabled));
      clientAnchorButton.title = clientAnchorEnabled
        ? "Disable automatic return to your location"
        : "Return to your location after 10 seconds without interaction";
      clientAnchorButton.setAttribute("aria-label", clientAnchorButton.title);
      clientSpeedElement.hidden = !clientPositionEnabled;
      const speedMphValue = Number.isFinite(clientSpeedMetersPerSecond)
        ? clientSpeedMetersPerSecond * 2.236936
        : null;
      clientSpeedElement.querySelector(".client-speed-value").textContent = Number.isFinite(speedMphValue)
        ? Math.max(0, speedMphValue).toFixed(0)
        : "--";
      const routeLines = [];
      const checkpointEta = clientSummaryTracker
        ? formatCheckpointEta(clientSummaryTracker)
        : null;
      if (checkpointEta) routeLines.push(checkpointEta);
      for (const kind of ["segment", "loop", "alternate"]) {
        const route = clientSummaryTracker?.routeDistances?.closest[kind];
        if (!route || !clientSummaryTracker.routeDistances.applicable[kind]
          || route.lineOfSightMeters > ROUTE_MATCH_MARGIN_METERS) continue;
        routeLines.push(
          `${route.track.name} ${compactDistanceLeft(route.trackRemainingMeters)}`
        );
      }
      clientRouteSummaryElement.replaceChildren(...routeLines.map(line => {
        const row = document.createElement("div");
        row.textContent = line;
        return row;
      }));
      clientRouteSummaryElement.hidden = !clientPositionEnabled || !routeLines.length;
      renderNavigationControl();
    }

    function scheduleClientAnchorRestore() {
      window.clearTimeout(clientAnchorRestoreTimer);
      clientAnchorRestoreTimer = null;
      if (!clientAnchorEnabled) return;
      clientAnchorRestoreTimer = window.setTimeout(() => {
        clientAnchorRestoreTimer = null;
        if (!clientAnchorEnabled) return;
        if (clientAnchorActivePointers.size || document.hidden || !clientPositionTarget) {
          scheduleClientAnchorRestore();
          return;
        }
        setClientPositionFollowing(true);
        if (Number.isFinite(clientAnchorZoom)) {
          suppressMoveCancellation = true;
          try {
            map.setZoom(clientAnchorZoom, { animate: false });
          } finally {
            suppressMoveCancellation = false;
          }
        }
      }, 10_000);
    }

    function setClientAnchorEnabled(enabled) {
      clientAnchorEnabled = Boolean(
        enabled && clientPositionEnabled && clientPositionFollowing
      );
      window.clearTimeout(clientAnchorRestoreTimer);
      clientAnchorRestoreTimer = null;
      if (clientAnchorEnabled) {
        clientAnchorZoom = map.getZoom();
        scheduleClientAnchorRestore();
      } else {
        clientAnchorZoom = null;
      }
      renderClientLocationControl();
    }

    function noteClientAnchorInteraction() {
      if (clientAnchorEnabled) scheduleClientAnchorRestore();
    }

    function installClientAnchorInteractionTracking() {
      document.addEventListener("pointerdown", event => {
        clientAnchorActivePointers.add(event.pointerId);
        noteClientAnchorInteraction();
      }, true);
      const finishPointer = event => {
        clientAnchorActivePointers.delete(event.pointerId);
        noteClientAnchorInteraction();
      };
      document.addEventListener("pointerup", finishPointer, true);
      document.addEventListener("pointercancel", finishPointer, true);
      document.addEventListener("wheel", noteClientAnchorInteraction, {
        capture: true,
        passive: true
      });
      document.addEventListener("keydown", noteClientAnchorInteraction, true);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) noteClientAnchorInteraction();
      });
    }

    function setClientPositionFollowing(following) {
      const startedFollowing = Boolean(following) && !clientPositionFollowing;
      clientPositionFollowing = Boolean(following);
      if (clientPositionFollowing) {
        followedPeloton = null;
        relativeDistanceReference = {
          type: "client",
          id: "__client_position__"
        };
        highlightedCheckpointTrackName = null;
        followedPinId = null;
      }
      if (clientPositionFollowing && followedSerial) setFollowedTracker(null, false, false);
      if (!clientPositionFollowing && clientFollowFrame !== null) {
        window.cancelAnimationFrame(clientFollowFrame);
        clientFollowFrame = null;
        clientFollowFrameAt = null;
      }
      if (!clientPositionFollowing) map.stop();
      if (clientPositionFollowing) {
        persistFollowTarget({ type: "client" });
      } else if (!followedSerial && !pendingRestoredFollowTarget) {
        persistFollowTarget(null);
      }
      renderClientLocationControl();
      renderTrackerList();
      if (startedFollowing) scrollTrackerIntoView("__client_position__");
      if (clientPositionFollowing && clientPositionTarget) scheduleClientFollow();
    }

    function persistClientPositionEnabled() {
      try {
        window.localStorage.setItem(
          CLIENT_LOCATION_STORAGE_KEY,
          String(clientPositionEnabled)
        );
      } catch (error) {
        // Storage may be disabled.
      }
    }

    function readPersistedClientPositionEnabled() {
      try {
        return window.localStorage.getItem(CLIENT_LOCATION_STORAGE_KEY) === "true";
      } catch (error) {
        return false;
      }
    }

    function enableClientPosition(following) {
      if (!("geolocation" in navigator)) {
        clientPositionEnabled = false;
        persistClientPositionEnabled();
        clientLocationButton.disabled = true;
        clientLocationButton.title = "Location is not supported by this browser";
        return;
      }
      clientPositionEnabled = true;
      clientSummaryTracker ||= {
        serial: "__client_position__",
        serial_hex: "",
        name: "Your Location",
        client_tracker: true,
        color: "#217bda",
        latitude: null,
        longitude: null,
        speed_kph: null,
        course_deg: null,
        sample_unix: null,
        routeDistances: null,
        checkpointEta: null
      };
      persistClientPositionEnabled();
      setClientPositionFollowing(following);
      clientPositionWatchId = navigator.geolocation.watchPosition(
        updateClientPosition,
        error => {
          console.warn("Could not read this device's location", error);
          clientLocationButton.title = `Location unavailable: ${error.message}`;
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
      );
      if (navigationEnabled && navigationAudioEnabled) {
        ensureNavigationAudioContext();
      }
      renderClientLocationControl();
    }

    function disableClientPosition() {
      setNavigationEnabled(false);
      setClientAnchorEnabled(false);
      setClientPositionFollowing(false);
      if (clientPositionWatchId !== null && "geolocation" in navigator) {
        navigator.geolocation.clearWatch(clientPositionWatchId);
      }
      clientPositionWatchId = null;
      if (clientPositionMarker) map.removeLayer(clientPositionMarker);
      if (clientAccuracyCircle) map.removeLayer(clientAccuracyCircle);
      clientPositionMarker = null;
      clientAccuracyCircle = null;
      clientPositionTarget = null;
      clientSummaryTracker = null;
      clientSpeedMetersPerSecond = null;
      clientSpeedRouteMatch = null;
      clientPositionEnabled = false;
      persistClientPositionEnabled();
      renderClientLocationControl();
      renderTrackerList();
    }

    function toggleClientPositionFollow() {
      if (!clientPositionEnabled) {
        enableClientPosition(true);
        return;
      }
      setClientPositionFollowing(!clientPositionFollowing);
    }

    function updateClientSpeedRouteMatch(tracker, accuracyMeters) {
      const kindPriority = { segment: 0, loop: 1, alternate: 2 };
      const match = ["segment", "loop", "alternate"]
        .filter(kind =>
          tracker.routeDistances?.applicable[kind]
          && tracker.routeDistances.closest[kind]
        )
        .map(kind => ({ ...tracker.routeDistances.closest[kind], kind }))
        .filter(route =>
          route.lineOfSightMeters <= ROUTE_MATCH_MARGIN_METERS
        )
        .sort((left, right) =>
          left.lineOfSightMeters - right.lineOfSightMeters
          || kindPriority[left.kind] - kindPriority[right.kind]
        )[0];
      if (!match) {
        clientSpeedRouteMatch = null;
        return;
      }
      const rawProgressMeters = match.edge.progressFromStartMeters
        + match.fraction * match.edge.lengthMeters;
      let progressMeters = rawProgressMeters;
      const position = L.latLng(tracker.latitude, tracker.longitude);
      const previous = clientSpeedRouteMatch;
      if (previous?.track === match.track) {
        const movementMeters = map.distance(previous.position, position);
        const noiseRadiusMeters = Math.max(
          30,
          Number(accuracyMeters) || 0,
          Number(previous.accuracyMeters) || 0
        );
        const moving = Number.isFinite(clientSpeedMetersPerSecond)
          && clientSpeedMetersPerSecond >= CLIENT_MOVING_THRESHOLD_MPS;
        if (
          (!moving && movementMeters <= noiseRadiusMeters)
          || (moving
            && rawProgressMeters < previous.progressMeters
            && previous.progressMeters - rawProgressMeters
              <= noiseRadiusMeters * 2)
        ) {
          progressMeters = previous.progressMeters;
        }
      }
      clientSpeedRouteMatch = {
        track: match.track,
        progressMeters,
        rawProgressMeters,
        position,
        accuracyMeters: Math.max(0, Number(accuracyMeters) || 0)
      };
    }

    function updateClientPosition(position) {
      const latitude = position.coords.latitude;
      const longitude = position.coords.longitude;
      if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return;
      clientPositionTarget = L.latLng(latitude, longitude);
      const accuracy = Number.isFinite(position.coords.accuracy) ? position.coords.accuracy : 0;
      clientSpeedMetersPerSecond = position.coords.speed;
      if (Number.isFinite(position.coords.heading)) clientCourseDegrees = position.coords.heading;
      clientSummaryTracker = {
        serial: "__client_position__",
        serial_hex: "",
        name: "Your Location",
        client_tracker: true,
        color: "#217bda",
        latitude,
        longitude,
        altitude_m: Number.isFinite(position.coords.altitude)
          ? position.coords.altitude
          : null,
        speed_kph: Number.isFinite(clientSpeedMetersPerSecond)
          ? clientSpeedMetersPerSecond * 3.6
          : null,
        course_deg: Number.isFinite(clientCourseDegrees) ? clientCourseDegrees : null,
        sample_unix: Number.isFinite(position.timestamp)
          ? position.timestamp / 1000
          : Date.now() / 1000
      };
      updateTrackerRouteDistances(clientSummaryTracker);
      updateClientSpeedRouteMatch(clientSummaryTracker, accuracy);
      const moving = Number.isFinite(clientSpeedMetersPerSecond)
        && clientSpeedMetersPerSecond >= CLIENT_MOVING_THRESHOLD_MPS;
      if (!clientAccuracyCircle) {
        clientAccuracyCircle = L.circle(clientPositionTarget, {
          radius: accuracy,
          color: "#217bda",
          weight: 1,
          opacity: 0.38,
          fillColor: "#4b9bea",
          fillOpacity: 0.12,
          pane: "clientAccuracyPane",
          interactive: false
        }).addTo(map);
      } else {
        clientAccuracyCircle.setLatLng(clientPositionTarget).setRadius(accuracy);
      }
      if (clientPositionMarker && clientPositionMarker.clientIsMoving !== moving) {
        map.removeLayer(clientPositionMarker);
        clientPositionMarker = null;
      }
      if (!clientPositionMarker) {
        clientPositionMarker = moving
          ? L.marker(clientPositionTarget, {
              icon: clientPositionArrowIcon(),
              pane: "clientPositionPane"
            }).addTo(map)
          : L.circleMarker(clientPositionTarget, {
              radius: 12,
              color: "#ffffff",
              weight: 3,
              opacity: 0.78,
              fillColor: "#217bda",
              fillOpacity: 0.5,
              pane: "clientPositionPane"
            }).addTo(map);
        clientPositionMarker.clientIsMoving = moving;
      } else {
        clientPositionMarker.setLatLng(clientPositionTarget);
        if (moving) clientPositionMarker.setIcon(clientPositionArrowIcon());
      }
      renderClientLocationControl();
      renderTrackerList(new Set([clientSummaryTracker.serial]));
      updateNavigationAssist();
      if (clientPositionFollowing) scheduleClientFollow();
    }

    function clientPositionArrowIcon() {
      return L.divIcon({
        className: "tracker-arrow-icon",
        iconSize: [36, 36],
        iconAnchor: [18, 18],
        html: `<div class="client-position-arrow" style="--course:${clientCourseDegrees}deg">
          <svg viewBox="0 0 26 26" width="36" height="36" aria-hidden="true">
            <path d="M13 1 L23 23 L13 18 L3 23 Z" fill="rgba(33,123,218,0.48)" stroke="rgba(255,255,255,0.78)" stroke-width="3" stroke-linejoin="round"/>
          </svg>
        </div>`
      });
    }

    function scheduleClientFollow() {
      if (!clientPositionFollowing || !clientPositionTarget || zoomInProgress) return;
      suppressMoveCancellation = true;
      try {
        const onScreen = map.getBounds().contains(clientPositionTarget);
        map.panTo(clientPositionTarget, onScreen
          ? { animate: true, duration: 0.65, easeLinearity: 0.2, noMoveStart: true }
          : { animate: false });
      } finally {
        suppressMoveCancellation = false;
      }
    }

    function validPosition(tracker) {
      return Number.isFinite(tracker.latitude) && Number.isFinite(tracker.longitude);
    }

    function trackerIsStale(tracker) {
      return trackerIsMoving(tracker)
        && Number.isFinite(tracker.sample_unix)
        && Date.now() / 1000 - tracker.sample_unix > STALE_MOVING_TRACKER_AGE_SECONDS;
    }

    function trackerIsVisuallyStale(tracker) {
      if (trackerIsStale(tracker)) return true;
      return trackerIsKnownStopped(tracker)
        && Number.isFinite(tracker.sample_unix)
        && Date.now() / 1000 - tracker.sample_unix > 60 * 60;
    }

    function trackerIsMoving(tracker) {
      return Number.isFinite(tracker.speed_kph) && tracker.speed_kph > 0;
    }

    function trackerIsKnownStopped(tracker) {
      return Number.isFinite(tracker.speed_kph) && tracker.speed_kph <= 0;
    }

    function isStaffTracker(tracker) {
      return !tracker.client_tracker && !(tracker.name || "").startsWith("#");
    }

    function arrowIcon(tracker) {
      const color = trackerMarkerColor(tracker);
      const course = Number.isFinite(tracker.course_deg) ? tracker.course_deg : 0;
      const size = followedSerial === tracker.serial ? 39 : 26;
      const staffClass = isStaffTracker(tracker) ? " staff-tracker-marker" : "";
      return L.divIcon({
        className: "tracker-arrow-icon",
        iconSize: [size, size],
        iconAnchor: [size / 2, size / 2],
        html: `<div class="tracker-arrow${staffClass}" style="--course:${course}deg;color:${color};width:${size}px;height:${size}px">
          <svg viewBox="0 0 26 26" width="${size}" height="${size}" aria-hidden="true">
            <path d="M13 1 L23 23 L13 18 L3 23 Z" fill="currentColor" stroke="white" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>`
      });
    }

    function formatNumber(value, digits = 1) {
      return Number.isFinite(value) ? value.toFixed(digits) : "Unknown";
    }

    function speedMph(speedKph) {
      return Number.isFinite(speedKph) ? speedKph * 0.621371 : null;
    }

    function altitudeFeet(altitudeMeters) {
      return Number.isFinite(altitudeMeters) ? altitudeMeters * 3.28084 : null;
    }

    function formatSampleAge(tracker, now = Date.now() / 1000) {
      if (!Number.isFinite(tracker.sample_unix)) return "Age unknown";
      const seconds = Math.max(0, Math.floor(now - tracker.sample_unix));
      if (seconds < 60) return `${seconds}s old`;
      if (seconds < 3600) return `${Math.floor(seconds / 60)}m old`;
      if (seconds < 86400) return `${Math.floor(seconds / 3600)}h old`;
      return `${Math.floor(seconds / 86400)}d old`;
    }

    function pinSubmittedUnix(pin) {
      const milliseconds = Date.parse(pin?.submitted_at);
      return Number.isFinite(milliseconds) ? milliseconds / 1000 : null;
    }

    function formatPinAge(pin, now = Date.now() / 1000) {
      return formatSampleAge({ sample_unix: pinSubmittedUnix(pin) }, now);
    }

    function formatPinDateTime(pin) {
      const milliseconds = Date.parse(pin?.submitted_at);
      if (!Number.isFinite(milliseconds)) return "Time unknown";
      return new Date(milliseconds).toLocaleString([], {
        dateStyle: "short",
        timeStyle: "short"
      });
    }

    function updateTrackerRouteDistances(tracker) {
      tracker.routeDistances = validPosition(tracker) && routeTracks.length
        ? routeDistancesAt(
          L.latLng(tracker.latitude, tracker.longitude),
          Number.isFinite(tracker.course_deg) ? tracker.course_deg : null
        )
        : null;
      tracker.checkpointEta = checkpointEtaForTracker(tracker);
    }

    function checkpointEtaForTracker(tracker) {
      const route = tracker.routeDistances?.closest.segment;
      const speedMps = Number(tracker.speed_kph) / 3.6;
      if (!route || route.lineOfSightMeters > ROUTE_MATCH_MARGIN_METERS
        || !(speedMps > 0) || !Number.isFinite(tracker.sample_unix)) return null;
      const now = Date.now() / 1000;
      const ageSeconds = Math.max(0, now - tracker.sample_unix);
      const maximumReachMeters = speedMps * (ageSeconds + 15 * 60);
      if (route.trackRemainingMeters > maximumReachMeters) return null;
      const match = {
        edge: route.edge,
        fraction: route.fraction,
        position: route.position
      };
      const travelSeconds = route.lineOfSightMeters / speedMps
        + trackTravelSeconds(match, speedMps);
      const arrivalUnix = tracker.sample_unix + travelSeconds;
      if (!Number.isFinite(arrivalUnix) || arrivalUnix <= now || arrivalUnix - now > 15 * 60) {
        return null;
      }
      return { arrivalUnix, trackName: route.track.name };
    }

    function formatCheckpointEta(tracker, now = Date.now() / 1000) {
      const eta = tracker.checkpointEta;
      if (!eta || eta.arrivalUnix <= now || eta.arrivalUnix - now > 15 * 60) return null;
      const time = new Date(eta.arrivalUnix * 1000).toLocaleTimeString([], {
        hour: "numeric",
        minute: "2-digit"
      });
      return `${eta.trackName} ETA ${time}`;
    }

    function trackerMetaParts(tracker, now) {
      const compactAge = formatSampleAge(tracker, now).replace(/ old$/, "");
      const fixed = `${compactAge} · ` +
        `${formatNumber(speedMph(tracker.speed_kph), 0)} mph`;
      const distanceParts = [];
      const checkpointEta = formatCheckpointEta(tracker, now);
      if (checkpointEta) distanceParts.push(checkpointEta);
      const distances = tracker.routeDistances;
      for (const routeKind of ["segment", "loop", "alternate"]) {
        if (!distances?.applicable[routeKind] || !distances.closest[routeKind]) continue;
        const route = distances.closest[routeKind];
        distanceParts.push(
          `${route.track.name} ${(route.trackRemainingMeters / 1609.344).toFixed(0)} mi`
        );
      }
      return { fixed, distances: distanceParts.join(" · ") };
    }

    function popupContent(tracker, now) {
      const root = document.createElement("div");
      root.className = "tracker-popup";
      const followButton = document.createElement("button");
      const isFollowing = followedSerial === tracker.serial;
      const trackerName = tracker.name || tracker.serial_hex;
      followButton.type = "button";
      followButton.className = "popup-follow-button";
      followButton.textContent = trackerName;
      followButton.setAttribute("aria-pressed", String(isFollowing));
      followButton.setAttribute(
        "aria-label",
        `${isFollowing ? "Stop following" : "Follow"} ${trackerName}`
      );
      followButton.title = isFollowing ? "Stop following" : "Follow tracker";
      followButton.addEventListener("click", event => {
        event.stopPropagation();
        const startFollowing = followedSerial !== tracker.serial;
        const markerIsVisible = trackerMarkerIsVisible(tracker.serial);
        setFollowedTracker(
          startFollowing ? tracker.serial : null,
          startFollowing && !markerIsVisible,
          startFollowing
        );
        if (startFollowing) scrollTrackerIntoView(tracker.serial);
      });
      root.append(followButton);

      const coordinateText = `${formatNumber(tracker.latitude, 6)}, ${formatNumber(tracker.longitude, 6)}`;
      let coordinateValue = coordinateText;
      if (validPosition(tracker)) {
        const coordinateLink = document.createElement("a");
        coordinateLink.href = `geo:${tracker.latitude},${tracker.longitude}?q=${tracker.latitude},${tracker.longitude}`;
        coordinateLink.textContent = coordinateText;
        coordinateLink.title = "Open this location in your maps app";
        coordinateValue = coordinateLink;
      }
      const details = [
        ["Age", formatSampleAge(tracker, now)],
        ["Lat / Lon", coordinateValue],
        ["Speed / Course", `${formatNumber(speedMph(tracker.speed_kph))} mph / ${formatNumber(tracker.course_deg, 0)}°`],
        ["Altitude", `${formatNumber(altitudeFeet(tracker.altitude_m), 0)} ft`]
      ];
      const routeDistances = tracker.routeDistances;
      for (const kind of ["segment", "loop", "alternate"]) {
        const route = routeDistances?.closest[kind];
        details.push([
          route?.track.name || ({ segment: "Segment", loop: "Loop", alternate: "Alternate" })[kind],
          route && routeDistances.applicable[kind]
            ? formatRouteDistance(route.trackRemainingMeters)
            : "—"
        ]);
      }
      const list = document.createElement("dl");
      for (const [label, value] of details) {
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        term.textContent = label;
        if (value instanceof Node) description.append(value);
        else description.textContent = value;
        list.append(term, description);
      }
      root.append(list);
      return root;
    }

    function updateMarker(tracker) {
      if (!validPosition(tracker)) {
        removeTrackerProjection(tracker.serial, false);
        const oldMarker = markers.get(tracker.serial);
        if (oldMarker) {
          if (oldMarker.touchTarget) map.removeLayer(oldMarker.touchTarget);
          map.removeLayer(oldMarker);
        }
        markers.delete(tracker.serial);
        if (followedSerial === tracker.serial) {
          followedSerial = null;
          exclusiveProjectionKey = null;
          persistFollowTarget(null);
          renderNavigationControl();
          updateNavigationAssist();
        }
        scheduleTeamBadgeLayout();
        return;
      }

      const position = [tracker.latitude, tracker.longitude];
      const color = trackerMarkerColor(tracker);
      const moving = trackerIsMoving(tracker);
      const projected = trackerProjections.has(tracker.serial);
      const showMovingMarker = moving && !projected;
      const isStaff = isStaffTracker(tracker);
      const stale = trackerIsVisuallyStale(tracker);
      const isFollowing = followedSerial === tracker.serial;
      const circleRadius = projected ? 7 : isFollowing ? 12 : 10;
      let marker = markers.get(tracker.serial);
      let restoreOpenPopup = false;
      if (marker && (
        marker.trackerIsMoving !== showMovingMarker
        || marker.trackerIsFollowed !== isFollowing
        || marker.trackerIsProjected !== projected
      )) {
        restoreOpenPopup = marker.isPopupOpen();
        marker.preservePopupState = restoreOpenPopup;
        if (marker.touchTarget) map.removeLayer(marker.touchTarget);
        map.removeLayer(marker);
        markers.delete(tracker.serial);
        marker = null;
      }
      if (!marker) {
        marker = showMovingMarker
          ? L.marker(position, {
              icon: arrowIcon(tracker),
              pane: isFollowing ? "followedTrackerPane" : "markerPane",
              bubblingMouseEvents: false
            }).addTo(map)
          : L.circleMarker(position, {
              radius: circleRadius,
              color: "#ffffff",
              weight: 2,
              fillColor: color,
              fillOpacity: 1,
              pane: isFollowing ? "followedTrackerPane" : "overlayPane",
              bubblingMouseEvents: false
            }).addTo(map);
        marker.trackerIsMoving = showMovingMarker;
        marker.trackerIsFollowed = isFollowing;
        marker.trackerIsProjected = projected;
        marker.trackerIsStaff = isStaff;
        // The tracker is centered before its popup opens. Leaflet's automatic
        // popup pan can otherwise look like a user pan and cancel following.
        marker.bindPopup(popupContent(tracker), {
          autoPan: false,
          // Projection and touch-target clicks toggle this popup explicitly.
          // Leaflet's default map-level preclick close happens before those
          // handlers and would otherwise make every click look like an open.
          closeOnClick: false
        });
        marker.on("popupopen", () => {
          detailedSerial = tracker.serial;
          scheduleDetailVisibilitySync(tracker.serial);
        });
        marker.on("popupclose", () => {
          if (!marker.preservePopupState && detailedSerial === tracker.serial) {
            detailedSerial = null;
          }
          scheduleDetailVisibilitySync(tracker.serial);
        });
        if (!showMovingMarker) {
          marker.touchTarget = L.circleMarker(position, {
            radius: 22,
            stroke: false,
            fill: true,
            fillColor: "#000",
            fillOpacity: 0.001,
            className: "tracker-touch-target",
            pane: isFollowing ? "followedTrackerPane" : "overlayPane",
            bubblingMouseEvents: false
          }).addTo(map);
          marker.touchTarget.on("click", event => {
            if (event.originalEvent) L.DomEvent.stop(event.originalEvent);
            toggleTrackerDetail(tracker.serial);
          });
        }
        markers.set(tracker.serial, marker);
        if (restoreOpenPopup || detailedSerial === tracker.serial) marker.openPopup();
      } else {
        marker.setLatLng(position);
        marker.touchTarget?.setLatLng(position);
        if (showMovingMarker) marker.setIcon(arrowIcon(tracker));
        else {
          marker.setRadius(circleRadius);
          marker.setStyle({ fillColor: color });
        }
        updateBoundPopup(marker, popupContent(tracker));
      }
      if (showMovingMarker) {
        marker.setOpacity(stale ? 0.45 : 1);
      } else {
        const markerElement = marker.getElement();
        markerElement?.classList.add("tracker-circle-marker");
        markerElement?.classList.toggle("staff-tracker-circle", isStaff && !projected);
        markerElement?.style.setProperty("--staff-marker-color", color);
        marker.setStyle({
          opacity: stale ? 0.45 : 1,
          fillOpacity: stale ? 0.4 : 1
        });
      }

      if (followedSerial === tracker.serial && !suppressFollowCentering) {
        centerOnTracker(tracker, false);
      }
      scheduleTeamBadgeLayout();
    }

    function trackerFollowPosition(tracker) {
      const projection = trackerProjections.get(tracker.serial);
      if (exclusiveProjectionKey) {
        const exclusiveTarget = projection?.targets?.find(target =>
          target.key === exclusiveProjectionKey
        );
        if (exclusiveTarget) return exclusiveTarget.position;
      }
      const positions = projection?.targets?.map(target => target.position);
      if (!positions?.length) return L.latLng(tracker.latitude, tracker.longitude);
      return L.latLng(
        positions.reduce((sum, position) => sum + position.lat, 0) / positions.length,
        positions.reduce((sum, position) => sum + position.lng, 0) / positions.length
      );
    }

    function centerOnTracker(tracker, zoomIn) {
      if (!validPosition(tracker)) return;
      suppressMoveCancellation = true;
      const position = trackerFollowPosition(tracker);
      try {
        if (map.getBounds().contains(position)) {
          scheduleSmoothTrackerPan(tracker);
        } else if (zoomIn) {
          cancelSmoothTrackerPan();
          map.setView(position, trackerSelectionZoom(tracker), { animate: false });
        } else {
          cancelSmoothTrackerPan();
          map.panTo(position, { animate: false });
        }
      } finally {
        suppressMoveCancellation = false;
      }
    }

    function trackerSelectionZoom(tracker) {
      const mph = speedMph(tracker.speed_kph);
      if (!Number.isFinite(mph)) return 14;
      if (mph < 3) return 15;
      if (mph >= 50) return 12;
      if (mph >= 25) return 13;
      return 14;
    }

    function cancelSmoothTrackerPan() {
      if (trackerFollowFrame !== null) window.cancelAnimationFrame(trackerFollowFrame);
      map.stop();
      trackerFollowFrame = null;
      trackerFollowFrameAt = null;
      trackerFollowTarget = null;
      trackerFollowTargetSerial = null;
    }

    function scheduleSmoothTrackerPan(tracker) {
      trackerFollowTarget = trackerFollowPosition(tracker);
      trackerFollowTargetSerial = tracker.serial;
      if (zoomInProgress || followedSerial !== tracker.serial) return;
      suppressMoveCancellation = true;
      try {
        map.panTo(trackerFollowTarget, {
          animate: true,
          duration: 0.65,
          easeLinearity: 0.2,
          noMoveStart: true
        });
      } finally {
        suppressMoveCancellation = false;
      }
    }

    function trackerMarkerIsVisible(serial) {
      const marker = markers.get(serial);
      return Boolean(marker && map.getBounds().contains(marker.getLatLng()));
    }

    function trackerNeedsRecentering(tracker) {
      if (!validPosition(tracker)) return false;
      const point = map.latLngToContainerPoint(trackerFollowPosition(tracker));
      const size = map.getSize();
      return Math.abs(point.x - size.x / 2) > 1 || Math.abs(point.y - size.y / 2) > 1;
    }

    function setFollowedTracker(
      serial,
      zoomIn = false,
      recenter = true,
      projectionKey = null
    ) {
      if (serial && clientPositionFollowing) setClientPositionFollowing(false);
      if (serial) {
        followedPeloton = null;
        highlightedCheckpointTrackName = null;
        followedPinId = null;
      }
      if (!serial) cancelSmoothTrackerPan();
      const previousSerial = followedSerial;
      followedSerial = serial;
      if (!clientPositionEnabled && previousSerial !== serial) {
        cancelPendingNavigationCue();
        navigationHalfMileChimedKey = null;
        navigationImminentChimedKey = null;
        navigationOffRouteAnnounced = false;
        window.speechSynthesis?.cancel();
      }
      if (serial) {
        relativeDistanceReference = { type: "tracker", id: serial };
      }
      exclusiveProjectionKey = serial && typeof projectionKey === "string"
        ? projectionKey
        : null;
      if (serial) {
        persistTrackerFollowExclusivity();
      } else if (!clientPositionFollowing && !pendingRestoredFollowTarget) {
        persistFollowTarget(null);
      }
      suppressFollowCentering = true;
      try {
        if (previousSerial && previousSerial !== serial && trackers.has(previousSerial)) {
          updateMarker(trackers.get(previousSerial));
        }
        if (serial && trackers.has(serial)) updateMarker(trackers.get(serial));
      } finally {
        suppressFollowCentering = false;
      }
      if (projectionEnabled) refreshTrackerProjections(Date.now() / 1000, false);
      if (recenter && serial && trackers.has(serial)) {
        centerOnTracker(trackers.get(serial), zoomIn);
      }
      renderTrackerList();
      renderNavigationControl();
      updateNavigationAssist();
    }

    function restorePersistedTrackerFollow() {
      const target = pendingRestoredFollowTarget;
      if (target?.type !== "tracker") return;
      const tracker = trackers.get(target.serial);
      if (!tracker || !validPosition(tracker)) return;
      pendingRestoredFollowTarget = null;
      hasFitInitialView = true;
      setFollowedTracker(
        target.serial,
        false,
        true,
        target.exclusiveProjectionKey
      );
      scrollTrackerIntoView(target.serial);
    }

    function scrollTrackerIntoView(serial) {
      window.requestAnimationFrame(() => {
        const candidates = [...groupsElement.querySelectorAll(".tracker-row")]
          .filter(candidate => candidate.dataset.serial === serial);
        const row = candidates.find(candidate => candidate.offsetParent !== null)
          || candidates[0];
        row?.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    function scrollRacePinIntoView(pinId) {
      window.requestAnimationFrame(() => {
        const row = [...groupsElement.querySelectorAll(
          '.tracker-group[data-group="race"] .pin-list-row[data-pin-id]'
        )].find(candidate => candidate.dataset.pinId === pinId);
        row?.scrollIntoView({ behavior: "smooth", block: "center" });
      });
    }

    function activateTracker(tracker) {
      const popupWasOpen = markers.get(tracker.serial)?.isPopupOpen() === true;
      const mapWillRecenter = trackerNeedsRecentering(tracker);
      if (followedSerial !== tracker.serial) {
        setFollowedTracker(tracker.serial, true, true);
        if (popupWasOpen && !mapWillRecenter) markers.get(tracker.serial)?.closePopup();
        return;
      }

      centerOnTracker(tracker, false);
      const marker = markers.get(tracker.serial);
      if (marker) {
        suppressMoveCancellation = true;
        if (popupWasOpen) {
          if (!mapWillRecenter) marker.closePopup();
        } else {
          marker.openPopup();
        }
        window.setTimeout(() => { suppressMoveCancellation = false; }, 0);
      }
    }

    map.on("zoomstart", () => { zoomInProgress = true; });
    map.on("zoomend", () => {
      zoomInProgress = false;
      refreshTrackerProjections(Date.now() / 1000, false);
      if (followedSerial && trackers.has(followedSerial)) {
        centerOnTracker(trackers.get(followedSerial), false);
      } else if (followedPeloton) {
        centerOnPeloton(followedPeloton, false);
      } else if (clientPositionFollowing) {
        scheduleClientFollow();
      } else if (highlightedCheckpointTrackName) {
        const checkpoint = checkpointMarkers.find(item =>
          item.track.name === highlightedCheckpointTrackName
        );
        if (checkpoint && !checkpointIsCentered(checkpoint)) {
          suppressMoveCancellation = true;
          try {
            map.panTo(checkpoint.position, { animate: false });
          } finally {
            suppressMoveCancellation = false;
          }
        }
      }
    });
    map.on("dragstart", () => {
      if (followedPeloton) {
        followedPeloton = null;
        renderTrackerList();
      }

    function effectiveTrackerDistanceMeters(tracker) {
      const projectedDistance = projectionEnabled && !tracker.client_tracker
        ? trackerProjections.get(tracker.serial)?.minimumRouteRemainingMeters
        : null;
      return Number.isFinite(projectedDistance)
        ? projectedDistance
        : tracker.routeDistances?.totalMeters;
    }

    function detectPelotons() {
      const maximumGapMeters = 1609.344;
      const solarCars = [...trackers.values()]
        .filter(tracker =>
          (tracker.name || "").startsWith("#")
          && validPosition(tracker)
          && Number.isFinite(effectiveTrackerDistanceMeters(tracker))
        )
        .sort((left, right) =>
          effectiveTrackerDistanceMeters(left) - effectiveTrackerDistanceMeters(right)
        );
      const chains = [];
      let chain = [];
      for (const tracker of solarCars) {
        const previous = chain.at(-1);
        if (
          previous
          && (
            effectiveTrackerDistanceMeters(tracker)
              - effectiveTrackerDistanceMeters(previous) > maximumGapMeters
            || map.distance(
              [previous.latitude, previous.longitude],
              [tracker.latitude, tracker.longitude]
            ) > maximumGapMeters
          )
        ) {
          if (chain.length >= 2) chains.push(chain);
          chain = [];
        }
        chain.push(tracker);
      }
      if (chain.length >= 2) chains.push(chain);
      return chains.map(trackersInPeloton => {
        const serials = trackersInPeloton.map(tracker => tracker.serial);
        return {
          serials,
          key: serials.slice().sort().join(","),
          trackers: trackersInPeloton,
          frontDistanceMeters: Math.min(
            ...trackersInPeloton.map(effectiveTrackerDistanceMeters)
          ),
          averageDistanceMeters:
            trackersInPeloton.reduce(
              (sum, tracker) => sum + effectiveTrackerDistanceMeters(tracker),
              0
            ) / trackersInPeloton.length
        };
      });
    }

    function pelotonPositions(peloton) {
      return peloton.serials
        .map(serial => trackers.get(serial))
        .filter(tracker => tracker && validPosition(tracker))
        .map(tracker => trackerFollowPosition(tracker));
    }

    function pelotonCenter(peloton) {
      const positions = pelotonPositions(peloton);
      if (!positions.length) return null;
      return L.latLng(
        positions.reduce((sum, position) => sum + position.lat, 0) / positions.length,
        positions.reduce((sum, position) => sum + position.lng, 0) / positions.length
      );
    }

    function pelotonZoom(peloton, center) {
      const positions = pelotonPositions(peloton);
      if (!positions.length || !center) return map.getZoom();
      const symmetricBounds = L.latLngBounds([center]);
      for (const position of positions) {
        symmetricBounds.extend(position);
        symmetricBounds.extend([
          2 * center.lat - position.lat,
          2 * center.lng - position.lng
        ]);
      }
      return Math.min(15, map.getBoundsZoom(symmetricBounds, false, L.point(50, 50)));
    }

    function centerOnPeloton(peloton, fit = false) {
      const center = pelotonCenter(peloton);
      if (!center) return;
      const requiredZoom = pelotonZoom(peloton, center);
      suppressMoveCancellation = true;
      try {
        if (fit || map.getZoom() > requiredZoom) {
          map.setView(center, requiredZoom, { animate: false });
        } else {
          map.panTo(center, {
            animate: true,
            duration: 0.65,
            easeLinearity: 0.2,
            noMoveStart: true
          });
        }
      } finally {
        suppressMoveCancellation = false;
      }
    }

    function setFollowedPeloton(peloton, fit = true) {
      if (!peloton) {
        followedPeloton = null;
        renderTrackerList();
        return;
      }
      if (followedSerial) setFollowedTracker(null, false, false);
      if (clientPositionFollowing) setClientPositionFollowing(false);
      if (followedPinId) setFollowedPin(null, false);
      highlightedCheckpointTrackName = null;
      followedPeloton = {
        key: peloton.key,
        serials: [...peloton.serials],
        trackers: peloton.trackers,
        frontDistanceMeters: peloton.frontDistanceMeters,
        averageDistanceMeters: peloton.averageDistanceMeters
      };
      relativeDistanceReference = {
        type: "peloton",
        id: followedPeloton.key
      };
      centerOnPeloton(followedPeloton, fit);
      renderTrackerList();
    }

    function reconcileFollowedPeloton(nextPelotons) {
      if (!followedPeloton) return;
      const previousMembers = new Set(followedPeloton.serials);
      if (
        previousMembers.size === 2
        && !nextPelotons.some(peloton =>
          [...previousMembers].every(serial => peloton.serials.includes(serial))
        )
      ) {
        const previousTrackers = [...previousMembers]
          .map(serial => trackers.get(serial))
          .filter(Boolean)
          .sort((left, right) => {
            const leftDistance = effectiveTrackerDistanceMeters(left);
            const rightDistance = effectiveTrackerDistanceMeters(right);
            if (Number.isFinite(leftDistance) && Number.isFinite(rightDistance)) {
              return leftDistance - rightDistance;
            }
            if (Number.isFinite(leftDistance)) return -1;
            if (Number.isFinite(rightDistance)) return 1;
            return followedPeloton.serials.indexOf(left.serial)
              - followedPeloton.serials.indexOf(right.serial);
          });
        const leadTracker = previousTrackers[0];
        followedPeloton = null;
        if (leadTracker) setFollowedTracker(leadTracker.serial, false, true);
        return;
      }
      const candidates = nextPelotons
        .map(peloton => ({
          peloton,
          retained: peloton.serials.filter(serial => previousMembers.has(serial)).length
        }))
        .filter(candidate => candidate.retained > 0)
        .sort((left, right) =>
          right.retained - left.retained
          || left.peloton.frontDistanceMeters - right.peloton.frontDistanceMeters
        );
      if (!candidates.length) {
        followedPeloton = null;
        return;
      }
      const selected = candidates[0].peloton;
      followedPeloton = {
        key: selected.key,
        serials: [...selected.serials],
        trackers: selected.trackers,
        frontDistanceMeters: selected.frontDistanceMeters,
        averageDistanceMeters: selected.averageDistanceMeters
      };
      relativeDistanceReference = {
        type: "peloton",
        id: followedPeloton.key
      };
      centerOnPeloton(followedPeloton, false);
    }

    function refreshDetectedPelotons() {
      const previousSignature = detectedPelotons
        .map(peloton => peloton.key).join("|");
      const next = detectPelotons();
      reconcileFollowedPeloton(next);
      detectedPelotons = next;
      return previousSignature !== next.map(peloton => peloton.key).join("|");
    }

    function pelotonMemberMetaText(tracker, now = Date.now() / 1000) {
      const parts = [
        formatSampleAge(tracker, now).replace(/ old$/, ""),
        `${formatNumber(speedMph(tracker.speed_kph), 0)} mph`
      ];
      const segment = tracker.routeDistances?.applicable.segment
        ? tracker.routeDistances.closest.segment
        : null;
      if (segment) {
        parts.push(
          `${segment.track.name} ${(segment.trackRemainingMeters / 1609.344).toFixed(0)} mi`
        );
      }
      return parts.join(" · ");
    }

        );

        follow.className = "follow-button";

        follow.title = `Follow ${tracker.name || tracker.serial_hex}`;

        follow.setAttribute("aria-pressed", String(followedSerial === tracker.serial));
        follow.addEventListener("click", event => {

          scrollTrackerIntoView(tracker.serial);
        });
        member.append(identity, relative, follow);
        members.append(member);
      }
      const activate = () => {

        );

    function pelotonGroup(pelotons) {
